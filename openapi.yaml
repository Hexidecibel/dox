              schema:
                $ref: '#/components/schemas/Error'

  /api/reports/generate:
    post:
      tags: [Reports]
      summary: Generate a document report
      description: |
        Generates a report of every non-deleted document matching the given
        filters. Returns CSV (default) or JSON. CSV includes Content-Disposition
        for download. Non-super_admins are scoped to their own tenant.

        The filters are exactly the four below — tenant, the legacy `category`
        field, and a `created_at` range. There is no supplier, document-type,
        product or status filter, and the output carries no supplier or products
        column; the columns are the ten listed in the response schema.

        Writes a `report.generate` audit row with the format, the category
        filter and the row count.
        **Requires any authenticated user.**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenantId:
                  type: string
                  description: Filter by tenant (super_admin only)
                category:
                  type: string
                  description: Filter by document category
                dateFrom:
                  type: string
                  format: date
                  description: Start date (inclusive)
                  example: "2024-01-01"
                dateTo:
                  type: string
                  format: date
                  description: End date (inclusive)
                  example: "2024-12-31"
                format:
                  type: string
                  enum: [csv, json]
                  default: csv
            example:
              category: "regulatory"
              dateFrom: "2024-01-01"
              dateTo: "2024-12-31"
              format: "json"
      responses:
        '200':
          description: Report data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                        category:
                          type: string
                        tags:
                          type: string
                        status:
                          type: string
                        currentVersion:
                          type: integer
                        fileName:
                          type: string
                        fileSizeKB:
                          type: integer
                        uploadedBy:
                          type: string
                        createdDate:
                          type: string
                        lastUpdated:
                          type: string
                  total:
                    type: integer
              description: JSON format response
            text/csv:
              schema:
                type: string
              description: |
                CSV format response with Content-Disposition header. Columns:
                Title, Category, Tags, Status, Current Version, File Name,
                File Size (KB), Uploaded By, Created Date, Last Updated.

  /api/reports/coa-fulfillment:
    get:
      tags: [Reports]
      summary: COA fulfillment — is a certificate on file for each shipped line?
      description: |
        One row per shipped order line, joined customer - order - lot - COA,
        each classified `ok` / `missing_lot` / `missing_coa` / `expired` against
        `as_of`. Any authenticated user; `tenant_id` is super_admin only and
        everyone else is pinned to their own tenant.

        With `format=csv` the same rows are returned as a CSV worklist and the
        request writes a `report.generate` audit row (`report_kind:
        "coa_fulfillment"`) with the filters and the row count. The JSON form
        writes no audit row — it is a screen read, not an export.
      parameters:
        - { name: tenant_id, in: query, schema: { type: string }, description: super_admin only }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: customer_id, in: query, schema: { type: string } }
        - { name: as_of, in: query, schema: { type: string, format: date }, description: Pins "today" for the expiry rule. Defaults to the server's UTC date. }
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 1000 }, description: "For `format=csv`: default 5000, maximum 5000." }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json } }
        - { name: gaps_only, in: query, schema: { type: boolean, default: false }, description: "CSV only: emit just the lines that are not `ok` (the Needs COA worklist)." }
      responses:
        '200':
          description: Rows plus a summary, or a CSV worklist
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows: { type: array, items: { type: object } }
                  summary: { type: object }
            text/csv:
              schema: { type: string }
              description: 'Columns: Customer, Order, PO, Product, Code, Lot, Status, Action.'

  /api/audit:
    get:
      tags: [Audit]
      summary: Query audit log
      description: |
        Returns paginated audit log entries with user info.
        - super_admin can query all entries, optionally filtered by tenant.
        - org_admin can only see their own tenant's entries.
        - user/reader get 403.

        Filters are built by the same `buildAuditFilters` helper the CSV export
        uses, so the screen and the export cannot drift. The tenant parameter is
        spelled `tenant_id` (snake case) — a `tenantId` parameter is ignored.
        **Requires super_admin or org_admin role.**
      parameters:
        - name: tenant_id
          in: query
          schema:
            type: string
          description: Filter by tenant (super_admin only; ignored for org_admin, who is pinned to their own tenant)
        - name: action
          in: query
          schema:
            type: string
          description: Filter by action type. Comma-separated for multiple (e.g. `login,logout`).
        - name: userId
          in: query
          schema:
            type: string
          description: Filter by user ID
        - name: resourceType
          in: query
          schema:
            type: string
          description: Filter by resource type (user, document, tenant, etc.)
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
          description: Start date (inclusive)
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
          description: End date (inclusive, through end of day)
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: Paginated audit entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAudit'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/audit/export:
    get:
      tags: [Audit]
      summary: Export audit log as CSV
      description: |
        Streams a CSV of every audit row matching the given filters — not just
        one page. Accepts exactly the same filters as `GET /api/audit` and
        enforces exactly the same permissions:
        - super_admin can export all entries, optionally narrowed by `tenant_id`.
        - org_admin is pinned to their own tenant; a `tenant_id` parameter is ignored, never honoured.
        - user/reader get 403.

        The response is streamed in batches rather than materialised in memory,
        and is a point-in-time snapshot: the row set is pinned before the export
        writes its own `audit.export` entry, so the CSV never contains its own
        record and always matches `X-Audit-Export-Matched`.

        Every field is quoted and escaped per RFC 4180, so commas, double quotes
        and newlines inside the JSON `details` column round-trip intact.

        Exports over 100,000 matching rows are truncated at that limit; the
        `X-Audit-Export-Truncated` header reports it. Narrow the date range to
        retrieve the remainder.

        The export itself is an auditable event and writes an `audit.export`
        row recording the user, IP, filters applied and matched row count.

        **Requires super_admin or org_admin role.**
      parameters:
        - name: tenant_id
          in: query
          schema:
            type: string
          description: Filter by tenant (super_admin only; ignored for org_admin)
        - name: action
          in: query
          schema:
            type: string
          description: Filter by action type. Comma-separated for multiple (e.g. `login,logout`).
        - name: userId
          in: query
          schema:
            type: string
          description: Filter by user ID
        - name: resourceType
          in: query
          schema:
            type: string
          description: Filter by resource type (user, document, tenant, etc.)
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
          description: Start date (inclusive)
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
          description: End date (inclusive, through end of day)
      responses:
        '200':
          description: |
            CSV stream. Columns: id, timestamp, user_id, user_name, user_email,
            tenant_id, action, resource_type, resource_id, ip_address, details.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: 'attachment; filename="audit-log-YYYY-MM-DD.csv"'
            X-Audit-Export-Matched:
              schema:
                type: integer
              description: Rows matching the filters at the moment of the request
            X-Audit-Export-Limit:
              schema:
                type: integer
              description: Maximum rows a single export will emit (100000)
            X-Audit-Export-Truncated:
              schema:
                type: string
                enum: ['true', 'false']
              description: Whether the export stopped at the limit
          content:
            text/csv:
              schema:
                type: string
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/documents/ingest:
    post:
      tags: [Documents]
      summary: Ingest a document (upsert by external_ref)
      description: |
        Creates a new document or adds a new version to an existing document,
        identified by `external_ref` within a tenant. Designed for agentic AI
        and email processing pipelines.

        - If a document with the given `external_ref` exists in the tenant, a new version is added.
        - If no document exists, a new document is created with version 1.

        Requires `user`, `org_admin`, or `super_admin` role.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The document file
                external_ref:
                  type: string
                  description: Stable external reference ID (e.g. "REF-2024-001")
                  example: "REF-2024-001"
                tenant_id:
                  type: string
                  description: Tenant this document belongs to
                title:
                  type: string
                  description: Document title (used on creation; if omitted, derived from filename)
                description:
                  type: string
                  description: Document description
                category:
                  type: string
                  description: Document category
                tags:
                  type: string
                  description: JSON string array of tags
                  example: '["safety","compliance"]'
                changeNotes:
                  type: string
                  description: Version change notes
                  example: "Updated via email from vendor@acme.com"
                source_metadata:
                  type: string
                  description: JSON string with ingestion metadata
                  example: '{"source":"email","from":"vendor@acme.com","subject":"Updated safety report","received_at":"2026-03-24T12:00:00Z"}'
              required: [file, external_ref, tenant_id]
      responses:
        '200':
          description: New version added to existing document
          content:
            application/json:
              schema:
                type: object
                properties:
                  action:
                    type: string
                    enum: [version_added]
                  document:
                    $ref: '#/components/schemas/Document'
                  version:
                    $ref: '#/components/schemas/DocumentVersion'
        '201':
          description: New document created
          content:
            application/json:
              schema:
                type: object
                properties:
                  action:
                    type: string
                    enum: [created]
                  document:
                    $ref: '#/components/schemas/Document'
                  version:
                    $ref: '#/components/schemas/DocumentVersion'
        '400':
          description: Missing required fields, invalid file type, or file too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No access to tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/documents/lookup:
    get:
      tags: [Documents]
      summary: Look up a document by external reference
      description: |
        Returns the document (with current version info) identified by `external_ref`
        within a tenant. Returns 404 if not found. Useful for checking if a document
        exists before deciding whether to create or update.
      parameters:
        - name: external_ref
          in: query
          required: true
          schema:
            type: string
          description: External reference ID to look up
          example: "REF-2024-001"
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
          description: Tenant ID to search within
      responses:
        '200':
          description: Document found
          content:
            application/json:
              schema:
                type: object
                properties:
                  document:
                    $ref: '#/components/schemas/Document'
                  currentVersion:
                    $ref: '#/components/schemas/DocumentVersion'
        '400':
          description: Missing required query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No access to tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/api-keys:
    get:
      tags: [API Keys]
      summary: List API keys
      description: |
        Returns all API keys visible to the caller.
        - super_admin sees all keys across all tenants.
        - org_admin sees only keys scoped to their tenant.
        **Requires super_admin or org_admin role.**
      responses:
        '200':
          description: List of API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKey'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [API Keys]
      summary: Create a new API key
      description: |
        Creates a new API key for programmatic access. The full key is returned only once
        in the response — it cannot be retrieved later. Keys authenticate as the user who
        created them and inherit that user's role and permissions.
        - org_admin keys are automatically scoped to their tenant.
        - super_admin can optionally scope a key to a specific tenant.
        **Requires super_admin or org_admin role.**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Human-readable name for the key
                  example: "CI Pipeline Key"
                tenantId:
                  type: string
                  description: Tenant to scope this key to (super_admin only; org_admin auto-scoped)
                permissions:
                  type: array
                  items:
                    type: string
                  description: 'Permission scopes (default: ["*"])'
                  example: ["*"]
                expiresAt:
                  type: string
                  description: |
                    Optional. The last moment the key works. Either a date
                    (`YYYY-MM-DD`), meaning the key works THROUGH the end of
                    that day in UTC, or an ISO 8601 timestamp WITH a time zone
                    (e.g. `2026-09-15T23:59:59-07:00`). A timestamp without a
                    zone is rejected, as is a value already in the past. Stored
                    normalised to a UTC timestamp. Omit for a key that never
                    expires.
                  example: "2026-12-31"
              required: [name]
      responses:
        '201':
          description: API key created (full key shown only once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKey:
                    $ref: '#/components/schemas/ApiKey'
                  key:
                    type: string
                    description: The full API key (shown only once, starts with dox_sk_)
                    example: "dox_sk_abc123def456..."
        '400':
          description: Missing name, or an `expiresAt` that is malformed or already in the past
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/api-keys/{id}:
    delete:
      tags: [API Keys]
      summary: Revoke an API key
      description: |
        Revokes an API key so it can no longer be used for authentication.
        - super_admin can revoke any key.
        - org_admin can only revoke keys scoped to their tenant.
        **Requires super_admin or org_admin role.**
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: API key ID to revoke
      responses:
        '200':
          description: Key revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Key is already revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions or key belongs to another tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: API key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/request-uploads:
    get:
      tags: [Supplier Arrivals]
      summary: List supplier arrivals
      description: |
        Any tenant user. `pending=1` is the inbox (oldest first): arrivals with at
        least one claimed requirement still waiting on a person, on a live ask.
        `request_id` accepts any version of an ask and shows its whole history.
        A super_admin must pass `tenant_id`.
      parameters:
        - { name: pending, in: query, schema: { type: string, enum: ['1'] } }
        - { name: request_id, in: query, schema: { type: string } }
        - { name: supplier_id, in: query, schema: { type: string } }
        - { name: queue_id, in: query, schema: { type: string }, description: The arrival a Review Queue item came from }
        - { name: tenant_id, in: query, schema: { type: string }, description: super_admin only (required for one) }
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: Arrivals
          content:
            application/json:
              schema:
                type: object
                properties:
                  arrivals:
                    type: array
                    items: { $ref: '#/components/schemas/RequestArrival' }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
                  pending_total: { type: integer, description: Tenant-wide inbox size, ignoring filters. }
        '404':
          description: request_id is not a request in this tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/request-uploads/{id}:
    get:
      tags: [Supplier Arrivals]
      summary: Get one supplier arrival
      description: Any tenant user. Another tenant's id is a 404.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The arrival
          content:
            application/json:
              schema:
                type: object
                properties:
                  arrival: { $ref: '#/components/schemas/RequestArrival' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/request-uploads/{id}/file:
    get:
      tags: [Supplier Arrivals]
      summary: Download the file a supplier sent
      description: |
        Any tenant user. Serves the upload's own object while it exists; once
        approval has moved the bytes, serves the linked document's current
        version instead. `X-File-Source` says which (`upload` | `document`).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: File bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: The arrival is recorded but no bytes are held for it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/request-uploads/{id}/decide:
    post:
      tags: [Supplier Arrivals]
      summary: Decide which requirements a supplier's file satisfies
      description: |
        super_admin, org_admin or user (not reader). Writes, in one batch, the
        claim decision, the current line's status and notes, and
        `request_lines.accepted_document_id`. Accepting a typed line confirms its
        `document_requirements` link (inserted with source `request_accept`, or a
        `suggested` link promoted). Deciding a requirement the supplier did not
        tick records a staff claim. No email is sent to the supplier.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecideArrivalRequest' }
      responses:
        '200':
          description: The refreshed arrival and the current version's line counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  arrival: { $ref: '#/components/schemas/RequestArrival' }
                  counts: { type: object }
        '400':
          description: Malformed decisions, a line not on the current version, or an ineligible document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Reader
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            Accepting before the file is approved in the Review Queue; the ask is
            not issued; or a person already rejected the document for that
            requirement. Nothing is written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/request-uploads/{id}/enqueue:
    post:
      tags: [Supplier Arrivals]
      summary: Put an unread supplier file on the extraction queue
      description: super_admin or org_admin. Only for an arrival whose queue insert failed at upload time.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Enqueued
          content:
            application/json:
              schema:
                type: object
                properties:
                  arrival: { $ref: '#/components/schemas/RequestArrival' }
                  intake_duplicate:
                    type: object
                    nullable: true
                    description: |
                      Set when the file is identical to one already approved or
                      already waiting (0108); the arrival was linked to that
                      instead of queued.
        '409':
          description: Already on the queue, or already linked to a document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: The bytes are gone
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/intake-duplicates:
    get:
      tags: [Intake Duplicates]
      summary: List files received again
      description: |
        Any tenant user. Newest first. A super_admin may pass `tenant_id`
        (omitted = every tenant).
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [open, reviewed, all], default: all }, description: open = not sent for review }
        - { name: document_id, in: query, schema: { type: string }, description: "Everything received again that is this document, including arrivals matched to the queue item it was approved from" }
        - { name: matched_queue_id, in: query, schema: { type: string } }
        - { name: tenant_id, in: query, schema: { type: string }, description: super_admin only }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: Suppressed arrivals
          content:
            application/json:
              schema:
                type: object
                properties:
                  duplicates:
                    type: array
                    items: { $ref: '#/components/schemas/IntakeDuplicate' }
                  total: { type: integer }
                  open_count: { type: integer, description: Rows not sent for review, same filters without state }
                  limit: { type: integer }
                  offset: { type: integer }
        '404':
          description: document_id not found in the tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/intake-duplicates/{id}/review:
    post:
      tags: [Intake Duplicates]
      summary: Review anyway
      description: |
        super_admin, org_admin or user. Replays the enqueue call the door made
        with the duplicate check skipped, stamps who sent it and when, and
        audits `intake_duplicate.review_anyway`. For a supplier-portal arrival
        the upload is pointed at the new queue item; its link to the existing
        document is removed only if no claim on it has been decided.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  duplicate: { $ref: '#/components/schemas/IntakeDuplicate' }
                  queue_id: { type: string }
        '403':
          description: Reader
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Not found in the tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Already sent for review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: The stored file is gone
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/suppliers/{id}/product-identifiers:
    get:
      tags: [Suppliers]
      summary: Supplier-side view of the product identifier graph
      description: |
        Any role in the tenant. Migration 0113 retired `supplier_product_map`
        and REMOVED `GET/PUT /api/product-map`; this is its replacement.
        Without query parameters: every `supplier_item` / `supplier_name`
        identifier for this supplier with the product of ours it names (our
        SKUs and pack alongside), plus `unidentified` — the product names and
        item numbers this supplier's certificates carry that do not resolve to
        one confirmed product, each with the resolver's reason.
        With `coa_product` and/or `item`: `{ resolution }`, resolved the way lot
        matching does (item number first, then name + pack, then a name that
        names exactly one product; an ambiguous name resolves to no product).
        Writes go through `POST /api/products/{id}/identifiers` and
        `PUT/DELETE /api/product-identifiers/{id}` (org_admin / super_admin, audited).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: coa_product, in: query, required: false, schema: { type: string } }
        - { name: item, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: The identifiers and unidentified certificate products, or one resolution
          content:
            application/json:
              schema:
                type: object
                properties:
                  supplier: { type: object, properties: { id: { type: string }, name: { type: string } } }
                  identifiers: { type: array, items: { type: object } }
                  unidentified: { type: array, items: { type: object } }
                  resolution:
                    type: object
                    properties:
                      product_id: { type: [string, 'null'] }
                      product_label: { type: [string, 'null'] }
                      route: { type: [string, 'null'], enum: [supplier_item, customer_item, name_pack, name, null] }
                      confirmed: { type: boolean }
                      our_skus: { type: array, items: { type: string } }
                      candidates: { type: array, items: { type: object } }
                      note: { type: [string, 'null'] }
        '404':
          description: Supplier not found in the tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/spec-unmatched:
    get:
      tags: [Spec Register]
      summary: Printed test names no configured analyte recognises
      description: |
        org_admin+. Replays the spec engine over this tenant's approved
        documents and reports every printed test name that matched no analyte —
        the alias gap, which is otherwise invisible: a limit whose analyte never
        matches a supplier's spelling never runs, and the register cannot report
        a check that never happened.

        Spellings are grouped by the key the matcher compares on, so `Flavor`
        and `FLAVOR` are one entry. A name that matches an analyte but has no
        limit in scope is NOT listed — that is a missing limit, not a missing
        alias.

        The scan is BOUNDED (the most recent `scan` documents, default and
        maximum 2000) and `scan_truncated` says when the tenant holds more, in
        which case the counts are a floor. Same derivation as
        `bin/recheck-spec-limits` (shared/unmatchedAnalytes.ts).
      parameters:
        - { name: tenant_id, in: query, schema: { type: string }, description: super_admin only, and then required }
        - { name: limit, in: query, schema: { type: integer, default: 25, maximum: 100 }, description: groups per page }
        - $ref: '#/components/parameters/OffsetParam'
        - { name: scan, in: query, schema: { type: integer, maximum: 2000 }, description: cap on documents replayed }
        - { name: include_ignored, in: query, schema: { type: string, enum: ['1'] }, description: also return the dismissed spellings }
      responses:
        '200':
          description: The gap, with what each spelling costs
          content:
            application/json:
              schema:
                type: object
                properties:
                  unmatched:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string, description: normalized match key }
                        name: { type: string, description: the commonest spelling }
                        results: { type: integer }
                        documents: { type: integer }
                        spellings:
                          type: array
                          items:
                            type: object
                            properties:
                              name: { type: string }
                              results: { type: integer }
                              documents: { type: integer }
                        suppliers:
                          type: array
                          items:
                            type: object
                            properties:
                              id: { type: string, nullable: true }
                              name: { type: string, nullable: true }
                              results: { type: integer }
                        example:
                          type: object
                          nullable: true
                          properties:
                            document_id: { type: string }
                            document_title: { type: string, nullable: true }
                            supplier_id: { type: string, nullable: true }
                            supplier_name: { type: string, nullable: true }
                            test_name_raw: { type: string }
                            value_raw: { type: string }
                            unit_raw: { type: string, nullable: true }
                  total_groups: { type: integer }
                  total_results: { type: integer }
                  documents_scanned: { type: integer }
                  documents_with_results: { type: integer }
                  scan_truncated: { type: boolean }
                  scan_cap: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
                  ignored_count: { type: integer }
                  ignored:
                    type: array
                    description: Only with `include_ignored=1`.
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name_key: { type: string }
                        name_raw: { type: string }
                        reason: { type: string, nullable: true }
                        created_at: { type: string }
                        created_by: { type: string, nullable: true }
                        created_by_name: { type: string, nullable: true }
        '400':
          description: super_admin without `tenant_id`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Not org_admin or super_admin

  /api/spec-unmatched/ignore:
    post:
      tags: [Spec Register]
      summary: Record that a printed name is not a test
      description: |
        org_admin+. Keeps a spelling off the configuration worklist (migration
        0114). It changes NO verdict — the engine never reads this table, and the
        result is still reported as unjudged on the document. Keyed on the match
        key, so dismissing `Flavor` also dismisses `FLAVOR`. Idempotent, and
        audited as `spec_unmatched.ignored`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: the spelling as printed }
                reason: { type: string, nullable: true }
                tenant_id: { type: string, description: super_admin only }
      responses:
        '201':
          description: Dismissed (or already dismissed)
        '400':
          description: No name, or super_admin without `tenant_id`
        '403':
          description: Not org_admin or super_admin
    delete:
      tags: [Spec Register]
      summary: Put a dismissed spelling back on the worklist
      description: org_admin+. Audited as `spec_unmatched.restored`.
      parameters:
        - { name: name, in: query, required: true, schema: { type: string } }
        - { name: tenant_id, in: query, schema: { type: string }, description: super_admin only }
      responses:
        '200':
          description: Restored
        '404':
          description: That spelling is not dismissed

  /api/spec-tests/{id}/aliases:
    post:
      tags: [Spec Register]
      summary: Add a spelling to an analyte
      description: |
        org_admin+. MERGES into `spec_tests.aliases`; `PUT /api/spec-tests/{id}`
        replaces the whole array, which would silently delete a spelling another
        admin added between a read and a write — and the failure is invisible,
        because the limit stays configured and simply stops matching one
        supplier's certificates. An alias already present is reported, not an
        error. Audited as `spec_test.alias_added`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                names: { type: array, items: { type: string } }
      responses:
        '201':
          description: At least one spelling added
          content:
            application/json:
              schema:
                type: object
                properties:
                  specTest: { type: object, description: the analyte, aliases already parsed }
                  added: { type: array, items: { type: string } }
                  already_present: { type: array, items: { type: string } }
                  same_as_name: { type: array, items: { type: string } }
        '200':
          description: Nothing to add — every spelling was already recognised
        '409':
          description: Another analyte already answers to that spelling
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/spec-checks:
    get:
      tags: [Spec Register]
      summary: List register rows
      description: |
        Any tenant user. Defaults to out-of-spec results, newest first. A
        super_admin may pass `tenant_id`. Every row carries `judgement_origin`
        and `bulk_run_at` whatever the `origin` filter.
      parameters:
        - { name: verdict, in: query, schema: { type: string, enum: [out_of_spec, not_checked, in_spec, all], default: out_of_spec } }
        - { name: acknowledged, in: query, schema: { type: string, enum: ['0', '1'] } }
        - name: origin
          in: query
          description: Who judged the result. Any other value is a 400.
          schema: { type: string, enum: [all, approval, bulk_recheck], default: all }
        - { name: document_id, in: query, schema: { type: string } }
        - { name: supplier_id, in: query, schema: { type: string } }
        - { name: spec_test_id, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string }, description: ISO date; rows created on or after }
        - { name: tenant_id, in: query, schema: { type: string }, description: super_admin only }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: Register rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  specChecks:
                    type: array
                    items: { $ref: '#/components/schemas/SpecCheck' }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        '400':
          description: Unknown `origin`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [Spec Register]
      summary: Acknowledge results
      description: |
        Any tenant user. Records that a person has seen these results and accepted
        them. Never changes a verdict or its origin, and works the same on
        approval and bulk re-check rows. Ids from another tenant are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, items: { type: string } }
                note: { type: string }
      responses:
        '200':
          description: Acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  acknowledged: { type: integer }
        '400':
          description: ids is required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/expirations:
    get:
      tags: [Renewals]
      summary: Renewal dashboard feed
      description: |
        Any tenant user (Compliance module). Every active document with a
        resolvable due date. `status` is judged against `window_days`, the
        dashboard look-ahead, which is a VIEW filter only. `alert_status` is
        judged against the document's own `alert_lead_days` (type override,
        else the organization setting, else 60) and is what renewal alerts
        mail on.
      parameters:
        - { name: window_days, in: query, schema: { type: integer }, description: Look-ahead for `status`. Defaults to the organization's lead time. }
        - { name: as_of, in: query, schema: { type: string, format: date } }
        - { name: tenant_id, in: query, schema: { type: string }, description: super_admin only }
      responses:
        '200':
          description: Classified rows and summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items: { $ref: '#/components/schemas/ExpirationRow' }
                  summary: { type: object }
                  window_days: { type: integer }
                  as_of: { type: string, format: date }
                  tenant_lead: { $ref: '#/components/schemas/ResolvedRenewalAlertLead' }

  /api/expirations/notify:
    post:
      tags: [Renewals]
      summary: Send the renewal digest now
      description: |
        super_admin or org_admin. Same engine as the daily scheduled run, with
        the re-alert cooldown skipped (the ledger is still written). Each
        document is alerting when `days_until <= alert_lead_days`. There is no
        window parameter: a `window_days` in the body or query is ignored and
        reported as `window_days_ignored: true`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant_id: { type: string, description: super_admin only }
                as_of: { type: string, format: date }
      responses:
        '200':
          description: What was sent, to whom, and what reached nobody
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: boolean }
                  recipients: { type: array, items: { type: string } }
                  document_count: { type: integer }
                  alerting_count: { type: integer }
                  suppressed_count: { type: integer }
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        owner_label: { type: string, nullable: true }
                        via: { type: string }
                        recipients: { type: array, items: { type: string } }
                        document_count: { type: integer }
                        document_ids: { type: array, items: { type: string } }
                        documents:
                          type: array
                          items: { $ref: '#/components/schemas/RenewalAlertedDocument' }
                        sent: { type: boolean }
                  unrouted: { type: object }
                  tenant_lead: { $ref: '#/components/schemas/ResolvedRenewalAlertLead' }
                  window_days_ignored: { type: boolean }
                  reason: { type: string, enum: [no_documents, all_suppressed, email_not_configured, all_unrouted, no_recipients] }

  /api/expirations/lead-time:
    get:
      tags: [Renewals]
      summary: Read the organization's renewal alert lead time
      description: super_admin (with `tenant_id`) or org_admin (own tenant). Compliance module.
      parameters:
        - { name: tenant_id, in: query, schema: { type: string }, description: required for super_admin }
      responses:
        '200':
          description: The setting, its effective value, and the document types that override it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenewalAlertLeadTime' }
        '403':
          description: Not an admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      tags: [Renewals]
      summary: Set how many days before a due date owners are warned
      description: |
        super_admin (with `tenant_id`) or org_admin (always its own tenant).
        `lead_days` is required: a whole number from 7 to 365, or null for the
        60-day default. A change stamps `renewal_alert_lead_updated_at/_by` and
        writes a `renewal_alert_lead_time_updated` audit row with the previous
        value; saving the same value writes nothing. Changing it never re-sends
        a record already alerted within the 7-day cooldown.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lead_days]
              properties:
                lead_days: { type: integer, minimum: 7, maximum: 365, nullable: true }
                tenant_id: { type: string, description: super_admin only }
      responses:
        '200':
          description: The saved setting
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenewalAlertLeadTime' }
        '400':
          description: Missing, fractional, non-numeric or out-of-range `lead_days`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Not an admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/expirations/lead-time/preview:
    get:
      tags: [Renewals]
      summary: Preview what a lead time change would do at the next run
      description: |
        super_admin or org_admin. Read-only: classifies the tenant's documents
        under the stored and the proposed configuration and applies the
        scheduled run's re-alert rules. Writes nothing and sends nothing. With
        `document_type_id` it previews that type's override; without, the
        organization setting.
      parameters:
        - { name: lead_days, in: query, required: true, schema: { type: string }, description: '7-365, or `inherit` / empty for null' }
        - { name: document_type_id, in: query, schema: { type: string } }
        - { name: as_of, in: query, schema: { type: string, format: date } }
        - { name: tenant_id, in: query, schema: { type: string }, description: required for super_admin }
      responses:
        '200':
          description: Counts, and up to 25 documents entering and leaving the warning window
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenewalLeadTimePreview' }
        '400':
          description: Bad `lead_days` or `as_of`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Document type not in this tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/spec-gaps:
    get:
      tags: [Spec Register]
      summary: What was NOT judged on an approved document
      description: |
        The other half of `/api/spec-checks` (migration 0109). Any role in the
        tenant — evidence, not configuration. Read-only: rows are written at
        approval and replaced on re-approval, and there is nothing to
        acknowledge (an unjudged result is fixed by configuring a limit, a
        missing analyte by the supplier sending one).

        `kind=missing_required` — an analyte this supplier's certificates of
        this type MUST report (a supplier watch, `/api/spec-required-analytes`)
        that the certificate did not report.
        `kind=unjudged` — a printed result with no limit in scope and no printed
        specification.
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [all, missing_required, unjudged], default: all } }
        - { name: document_id, in: query, schema: { type: string } }
        - { name: supplier_id, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Gap rows and total
          content:
            application/json:
              schema:
                type: object
                properties:
                  specGaps: { type: array, items: { type: object } }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }

  /api/suppliers/{id}/lot-scheme:
    get:
      tags: [Suppliers]
      summary: The supplier's declared lot format, and how its lots read against it
      description: |
        Migration 0110. Any role in the tenant. Returns every declared VERSION
        (the table is append-only), the one in force, and a read-only fit
        preview over this supplier's stored lots. With no declaration the
        legacy `suppliers.lot_scheme` enum is mapped onto an equivalent spec.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Versions, the resolved spec, and the fit preview
          content:
            application/json:
              schema: { type: object }
        '404':
          description: Supplier not found in the tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      tags: [Suppliers]
      summary: Declare a lot format (appends a version)
      description: |
        org_admin / super_admin. Body `{ spec, note? }`. The spec is validated
        before anything is written — a declaration that cannot mean one thing
        (a Julian day with no year, a date segment with no role) is refused 400.
        A new VERSION is appended; nothing is updated in place, so a stored
        decode stays explainable. Saving the format already in force writes
        nothing and returns `unchanged: true`. Audited
        (`supplier.lot_scheme_declared`) with the previous spec and the fit
        counts the new one produces.

        **A declaration is a validator and a labelled fallback, never an
        authority**: saving one rewrites no stored lot key and no stored date.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spec]
              properties:
                spec: { type: object }
                note: { type: string }
      responses:
        '200':
          description: The declaration in force after the call
          content:
            application/json:
              schema: { type: object }
        '400':
          description: The spec is not a valid declaration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/products/{id}/identifiers:
    get:
      tags: [Products]
      summary: What this product goes by
      description: |
        Migration 0107. Any role in the tenant. One row per identifier — our
        SKU, a supplier's item number, a supplier's product name, an alias, a
        GTIN, a pack — each with `source`, `confirmed`, `superseded` and the
        evidence in `note`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The product's identifiers
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifiers: { type: array, items: { type: object } }
    post:
      tags: [Products]
      summary: Add an identifier
      description: |
        org_admin / super_admin, audited. A person adding an identifier here
        stands behind it, so it is written `confirmed: true`, `source:
        'reviewer'` unless the body says `confirmed: false` — search then
        labels every result reached through it "via unconfirmed identifier".
        `kind` and `supplier_id` are paired: the supplier kinds require one,
        the rest refuse one. Uniqueness is per product, so two products may
        legitimately claim one number — that ambiguity is something search
        shows rather than hides.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, value]
              properties:
                kind: { type: string, enum: [our_sku, supplier_item, supplier_name, alias, gtin, pack] }
                value: { type: string }
                supplier_id: { type: [string, 'null'] }
                confirmed: { type: boolean, default: true }
                superseded: { type: boolean, default: false }
                note: { type: string }
      responses:
        '200':
          description: 'The identifier already existed (`created: false`)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier: { type: object }
                  created: { type: boolean }
        '201':
          description: 'The identifier as stored (`created: true`)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier: { type: object }
                  created: { type: boolean }
        '400':
          description: Invalid kind/value/supplier pairing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/product-identifiers/{id}:
    put:
      tags: [Products]
      summary: Confirm an identifier, mark it a former number, or edit its note
      description: |
        org_admin / super_admin, own tenant, audited. The value, kind and
        supplier of an identifier are its IDENTITY and are not editable: a
        wrong number is removed and the right one added, so the audit log shows
        both.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmed: { type: boolean }
                superseded: { type: boolean }
                note: { type: [string, 'null'] }
      responses:
        '200':
          description: The identifier after the change
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier: { type: object }
    delete:
      tags: [Products]
      summary: Remove an identifier
      description: |
        org_admin / super_admin, own tenant. The `product_identifier.removed`
        audit row carries the WHOLE row, since nothing else keeps it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  /api/supplier-list/import:
    post:
      tags: [Supplier Requirements]
      summary: Derive supplier requirements from the verified supplier list
      description: |
        Migration 0112. super_admin / org_admin. The ONE door to the derivation
        rules (`shared/requirementDerivation.ts`), so a spreadsheet and a future
        webhook get the same answer for the same supplier.

        Exactly one list source: `csv`, `xlsx_base64` (first sheet), `rows`, or
        `rerun_of` (the id of an earlier APPLIED run, whose stored input is
        re-run). `dry_run` DEFAULTS TO TRUE and writes nothing at all — not even
        a run row; a caller has to say it means to write.

        Applying creates missing suppliers, writes derived rows with their
        provenance, ADOPTS rows nobody had attributed (never lowering a tier),
        FLAGS derived rows the list no longer implies rather than deleting them,
        and never touches a row a human or a packet wrote.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                csv: { type: string }
                xlsx_base64: { type: string }
                rows: { type: array, items: { type: object } }
                rerun_of: { type: string }
                dry_run: { type: boolean, default: true }
                file_name: { type: string }
                pack: { type: string }
                tenant_id: { type: string, description: super_admin only }
      responses:
        '200':
          description: The plan a dry run would apply. Nothing was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierListImportResponse' }
        '201':
          description: Applied. `run_id` is the stored run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierListImportResponse' }
        '400':
          description: No list source, more than one, or the rows are unreadable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/supplier-list/imports:
    get:
      tags: [Supplier Requirements]
      summary: Applied supplier-list import runs
      description: |
        super_admin / org_admin. Newest first, summary only — a run's per-row
        outcomes are on `GET /api/supplier-list/imports/{id}`. A dry run is not
        a run and never appears here.
      parameters:
        - { name: tenant_id, in: query, schema: { type: string }, description: super_admin only }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: Run summaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  imports: { type: array, items: { type: object } }

  /api/supplier-list/imports/{id}:
    get:
      tags: [Supplier Requirements]
      summary: One import run, with its per-row outcomes
      description: super_admin / org_admin, own tenant.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The run, its counts, its row outcomes and its stored input
          content:
            application/json:
              schema:
                type: object
                properties:
                  import: { type: object }
        '404':
          description: Run not found in the tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/document-exports/zip:
    post:
      tags: [Documents]
      summary: Export selected documents as a ZIP
      description: |
        Zips the CURRENT version of each selected document plus a `manifest.csv`
        naming, per file, the document, supplier, document type, lot and
        production date.

        Tenant-scoped in SQL: an id belonging to another tenant is reported as
        missing, never exported. **Any authenticated user with tenant access,
        reader included** — the same bar as downloading one document at a time.

        Writes ONE audit row (`document_export.zip`) naming every document.

        Refused with 413 over 50 documents or 40 MB of source files; the message
        states the cap. Module-gated under `library`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_ids]
              properties:
                document_ids:
                  type: array
                  items: { type: string }
                tenant_id:
                  type: string
      responses:
        '200':
          description: ZIP archive
          content:
            application/zip:
              schema:
                type: string
                format: binary
          headers:
            X-Export-Documents:
              schema: { type: integer }
            X-Export-Missing:
              schema: { type: integer }
        '400': { description: Empty selection }
        '404': { description: Nothing in the selection is available }
        '413': { description: Over the document or size cap }

  /api/document-exports/send:
    post:
      tags: [Documents]
      summary: Email the selected documents as a token-gated link
      description: |
        Mints a `document_export_links` row (migration 0115) and emails a LINK —
        never attachments — from the portal's own sender with a reply-to of the
        calling user. `on_behalf_of` is free text printed as context; nothing
        impersonates a recipient's domain.

        Rate limited to 30 sends per hour per user. The link is revoked if the
        email fails, so a live link never exists for a message nobody received.
        Audited as `document_export.sent` with the recipients and the id list.
        Module-gated under `library`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_ids, recipients]
              properties:
                document_ids:
                  type: array
                  items: { type: string }
                recipients:
                  type: array
                  items: { type: string, format: email }
                on_behalf_of: { type: string }
                message: { type: string }
                tenant_id: { type: string }
      responses:
        '200':
          description: Sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: boolean }
                  recipients:
                    type: array
                    items: { type: string }
                  document_count: { type: integer }
                  missing_ids:
                    type: array
                    items: { type: string }
                  expires_at: { type: string }
        '400': { description: No recipients, or an address that is not valid }
        '403': { description: A reader may download an export but may not mail one }
        '413': { description: Over the document or size cap }
        '429': { description: Rate limited }
        '502': { description: The email could not be sent; the link was revoked }
        '503': { description: Email is not configured for this portal }

  /api/document-exports/links:
    get:
      tags: [Documents]
      summary: Documents you sent - the register of export links
      description: |
        One row per send (migrations 0115 + 0116): when, by whom, on whose
        behalf, to which addresses, how many documents with the first few
        titles, the view and download counts, and a resolved `state` of
        `active` / `expired` / `revoked` (revoked wins over expired).

        An admin (super_admin / org_admin) sees the organization's sends;
        anybody else sees their own. `scope` is a request, not a guarantee -
        the response reports the scope it actually answered in.

        THE TOKEN IS NEVER RETURNED. This is the accountability screen, not a
        second way to open every export ever sent. Counts are counts of
        REQUESTS against the link, not of people: the URL is a bearer
        credential and may be forwarded, so nothing here can say which
        recipient opened it. Module-gated under `library`.
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [tenant, mine] }
        - name: tenant_id
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, maximum: 200, default: 100 }
      responses:
        '200':
          description: The sends, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  links:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        state: { type: string, enum: [active, expired, revoked] }
                        created_at: { type: string }
                        expires_at: { type: string }
                        revoked_at: { type: string, nullable: true }
                        revoked_by_name: { type: string, nullable: true }
                        sent_by_id: { type: string }
                        sent_by_name: { type: string, nullable: true }
                        sent_by_email: { type: string, nullable: true }
                        on_behalf_of: { type: string, nullable: true }
                        message: { type: string, nullable: true }
                        recipients:
                          type: array
                          items: { type: string }
                        document_count: { type: integer }
                        document_titles:
                          type: array
                          items: { type: string }
                        documents_truncated: { type: boolean }
                        view_count: { type: integer }
                        last_viewed_at: { type: string, nullable: true }
                        download_count: { type: integer }
                        last_downloaded_at: { type: string, nullable: true }
                        can_revoke: { type: boolean }
                  scope: { type: string, enum: [tenant, mine] }
                  can_see_tenant: { type: boolean }
        '400': { description: No organization selected }
        '403': { description: Another tenant }

  /api/document-exports/links/{id}/revoke:
    post:
      tags: [Documents]
      summary: Revoke a sent export link
      description: |
        Shuts the link off immediately and on ALL THREE recipient routes - the
        landing read, the ZIP and the per-file download - because every one of
        them resolves its token through `loadUsableExportLink`, which returns
        null for a revoked row, and all three then answer the same 404 they
        answer for a token that never existed.

        The sender may revoke their own; an admin may revoke anyone's in the
        tenant. Another tenant's link answers 404, never 403, so the endpoint
        cannot be used as a probe. A second press is a no-op that does not move
        the first revocation's timestamp.

        It cannot recall a file already downloaded, and THERE IS NO EXTEND:
        lengthening a link after the fact changes the terms of a mail already
        sent. Send again instead. Audited as `document_export.revoked` with the
        recipients, the id list and the counts at the moment it was pulled.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The link, now revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  link: { type: object }
        '403': { description: Not the sender, and not an admin }
        '404': { description: No such link in this tenant }

  /api/document-exports/public/{token}:
    get:
      tags: [Documents]
      summary: What an export link contains (public, token-gated)
      description: |
        The unauthenticated read behind `/export/:token`. The response is an
        explicit allow-list carrying no internal id; files are addressed by
        their POSITION in the link's own frozen list. Every unusable state —
        unknown, expired, revoked — answers 404 alike. Each view is audited
        (`document_export_link.view`) and rate limited per (link, IP).
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The documents this export contained
        '404': { description: Unknown, expired or revoked }
        '429': { description: Rate limited }

  /api/document-exports/public/{token}/download:
    get:
      tags: [Documents]
      summary: The recipient's ZIP (public, token-gated)
      description: |
        The same archive and manifest as the signed-in export. The document set
        comes from the link, never from the request. Audited as
        `document_export_link.download`.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ZIP archive
          content:
            application/zip:
              schema: { type: string, format: binary }
        '404': { description: Unknown, expired or revoked }
        '429': { description: Rate limited }

  /api/document-exports/public/{token}/file/{index}:
    get:
      tags: [Documents]
      summary: One file out of an export (public, token-gated)
      description: |
        `index` is a POSITION in the link's own list, not a document id, so it
        addresses nothing outside this export. Audited as
        `document_export_link.file`.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
        - name: index
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: The file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { description: Unknown link, or a position not in the export }
        '429': { description: Rate limited }

  /api/graphql:
    post:
      tags: [GraphQL]
      summary: GraphQL endpoint
      description: |
        Full GraphQL API with queries and mutations mirroring the REST API.
        Supports GraphiQL IDE when accessed via GET in a browser.
        Authentication is optional (login mutation works without a token).
        Authenticated requests use the same Bearer JWT as REST endpoints.
        **No auth required** (the /api/graphql path is public; individual resolvers enforce auth).

        **Errors match the REST surface for the same condition.** A refusal
        carries the same message the REST handler returns and an
        `extensions.code` of `UNAUTHENTICATED` / `FORBIDDEN` / `NOT_FOUND` /
        `BAD_REQUEST` / `CONFLICT`, and the response status is the matching
        401 / 403 / 404 / 400 / 409. A module refusal keeps its own
        `module_disabled` / `module_not_visible` code. **Everything else is
        masked**: a genuine server error is always `Unexpected error.` with
        code `INTERNAL_SERVER_ERROR` and nothing of the original attached.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                variables:
                  type: object
                operationName:
                  type: string
              required: [query]
            example:
              query: "query { me { id email name role } }"
      responses:
        '200':
          description: GraphQL response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                  errors:
                    type: array
                    items:
                      type: object

    get:
      tags: [GraphQL]
      summary: GraphiQL IDE
      description: |
        Serves the GraphiQL interactive IDE for exploring the GraphQL schema.
        Open in a browser to use the IDE.
        **No auth required.**
      security: []
      responses:
        '200':
          description: GraphiQL HTML page
          content:
