openapi: 3.1.0
info:
  title: Dox API
  description: |
    Multi-tenant document upload/download portal with version tracking, role-based access control,
    audit logging, and report generation. Built on Cloudflare Pages Functions with D1 (SQLite) and R2 (object storage).

    ## Authentication
    All endpoints except login, forgot-password, reset-password, and GraphQL require authentication
    via either a Bearer JWT token in the Authorization header or an API key in the X-API-Key header.
    JWT tokens are issued by POST /api/auth/login and expire after 24 hours.
    API keys are created via POST /api/api-keys and use the prefix `dox_sk_`.
    Sessions can be revoked server-side via POST /api/auth/logout.

    ## Roles
    - **super_admin** — Full access across all tenants. Can manage tenants, users, and all documents.
    - **org_admin** — Admin within their tenant. Can manage users (user/reader only) and documents in their org.
    - **user** — Can create, upload, update, and delete documents within their tenant.
    - **reader** — Read-only access to documents within their tenant.

    ## Multi-tenancy
    All data is scoped to tenants. Non-super_admin users are automatically restricted to their own tenant.
  version: 0.1.0
  contact:
    name: Dox

servers:
  - url: http://localhost:8788
    description: Local development
  - url: https://dox.pages.dev
    description: Production (Cloudflare Pages)

security:
  - BearerAuth: []
  - ApiKeyAuth: []

tags:
  - name: Auth
    description: Authentication and password management
  - name: Documents
    description: Document CRUD, file upload/download, versioning, and search
  - name: Tenants
    description: Tenant (organization) management
  - name: Users
    description: User management and profiles
  - name: Reports
    description: Document report generation (CSV/JSON)
  - name: Audit
    description: Audit log queries
  - name: API Keys
    description: API key management for programmatic access
  - name: Orders
    description: |
      Building an order by hand and sending its documents to the customer:
      picking approved documents onto lines, the send preview, the send and
      its record (migration 0134).
  - name: Supplier Arrivals
    description: |
      Files suppliers sent through a request link, as staff see them, and the
      decision about which requirements each one satisfies (migration 0104).
  - name: Intake Duplicates
    description: |
      Files that arrived byte-identical to one already approved or already
      waiting in the Review Queue, recorded instead of queued a second time,
      and "Review anyway" (migration 0108).
  - name: Spec Register
    description: |
      The out-of-spec register — every judged COA test result, which limit it
      was judged against, who judged it, and who acknowledged it.
  - name: Renewals
    description: |
      The renewal dashboard, renewal alerts, and how far ahead owners are
      warned (renewal alert lead time, migration 0111).
  - name: Suppliers
    description: |
      Suppliers, the product identifiers each one's certificates are read
      through, and each supplier's declared lot format (migration 0110).
  - name: Products
    description: |
      Our products and the identifier graph that says what each one goes by —
      our SKU, a supplier's item number or name, an alias, a GTIN, a pack
      (migration 0107).
  - name: Supplier Requirements
    description: |
      What a supplier owes, derived from the verified supplier list rather than
      guessed uniformly (migration 0112).
  - name: GraphQL
    description: GraphQL API (alternative to REST)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token obtained from POST /api/auth/login.
        Token payload contains: sub (user ID), email, role, tenantId.
        Tokens expire after 24 hours. Sessions are tracked server-side and can be revoked.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        API key for programmatic access, created via POST /api/api-keys.
        Keys use the prefix `dox_sk_` and authenticate as the user who created them.
        Pass the full key in the X-API-Key header. Keys can be scoped to a tenant
        and optionally have an expiration date.

  schemas:
    OrderDocumentLine:
      type: object
      description: One document line of an order (migration 0138), judged for the caller.
      properties:
        id: { type: string }
        order_id: { type: string }
        product_id: { type: string }
        product_name: { type: string, nullable: true }
        supplier_id: { type: string }
        supplier_name: { type: string, nullable: true }
        facility:
          type: object
          nullable: true
          description: The pair's plant as recorded now. Display only; not stored on the line.
          properties:
            id: { type: string }
            name: { type: string }
            plant_code: { type: string, nullable: true }
        document_type_id: { type: string }
        document_type_name: { type: string, nullable: true }
        document_id: { type: string, nullable: true }
        document_title: { type: string, nullable: true }
        document_status: { type: string, nullable: true }
        resolution: { type: string, enum: [found, missing, expired], description: As it stands now }
        resolution_note: { type: string, nullable: true }
        document_due_date: { type: string, nullable: true }
        rule_at_resolve: { type: string, nullable: true, enum: [free, qa, locked], description: The rule when the line was resolved. Decides nothing. }
        sharing_rule: { type: string, nullable: true, enum: [free, qa, locked], description: The rule now }
        release_status: { type: string, enum: [none, pending_qa, releasing, released, refused] }
        release_stuck: { type: boolean, description: "A release was claimed more than five minutes ago and never finished. Never shown as sent." }
        pending_send_id: { type: string, nullable: true }
        pending_recipients: { type: array, items: { type: string }, description: Who a release would mail }
        document_approved_at: { type: string, nullable: true }
        decided_by_name: { type: string, nullable: true }
        decided_at: { type: string, nullable: true }
        decision_note: { type: string, nullable: true }
        last_sent_at: { type: string, nullable: true }
        private_label: { type: boolean }
        advisory: { type: string, nullable: true, description: What sales should know before sharing a co-packer's document. Warns, never blocks. }
        stale: { type: boolean, description: A fresh resolve would give a different answer }
        stale_note: { type: string, nullable: true }
        disposition: { type: string, enum: [goes_now, waits_for_qa, will_not_go] }
        disposition_reason: { type: string, nullable: true, enum: [missing, expired, inactive, no_file, locked, refused, already_released, stale] }
        disposition_text: { type: string }
        delivery: { type: string, enum: [link, attachment] }

    SupplierListImportResponse:
      type: object
      description: |
        What a supplier-list import did, or would do. Identical in shape for a
        dry run and an apply — the only difference is `dry_run` and whether
        `run_id` is set — so a reviewer reads the same report either way.
      properties:
        dry_run: { type: boolean }
        run_id: { type: [string, 'null'], description: The stored run. Always null on a dry run, which stores nothing. }
        pack: { type: string }
        file_name: { type: [string, 'null'] }
        counts: { type: object }
        suppliers: { type: array, items: { type: object }, description: Per supplier, the requirements derived and why. }
        flagged: { type: array, items: { type: object }, description: Derived rows the list no longer implies. Flagged, never deleted. }
        rows: { type: array, items: { type: object }, description: Per input row, what became of it. }
        unmatched: { type: array, items: { type: object }, description: Products and claims the row named that the tenant does not hold. Reported, never invented. }
        approvals:
          type: array
          description: |
            Migration 0135. What the Approved column does to each
            supplier-and-item pair. `action` is set / unchanged / kept_person
            (a person decided; never overridden) / unresolved (the product is
            not in the catalog) / conflict (the list's rows disagree). A dry
            run reports these and writes nothing.
          items:
            type: object
            properties:
              lines: { type: array, items: { type: integer } }
              supplier_id: { type: string, nullable: true }
              supplier_name: { type: string }
              product_id: { type: string, nullable: true }
              product_label: { type: string }
              listed: { type: string, nullable: true, enum: [approved, pending, not_approved] }
              current: { type: string, nullable: true, enum: [approved, pending, not_approved] }
              current_source: { type: string, nullable: true }
              action: { type: string, enum: [set, unchanged, kept_person, unresolved, conflict] }
              reason: { type: string, nullable: true }
        rule_problems: { type: array, items: { type: string } }
        unrecognized_headers: { type: array, items: { type: string } }
        rules: { type: object, description: The rules in force for this pack, echoed back. }
    ApprovedItem:
      type: object
      description: One item from one supplier (migration 0135). Approval is separate from `supplied`.
      properties:
        link_id: { type: string, nullable: true, description: The product_suppliers row. Null = a legacy-only link made after 0135 with nothing recorded yet. }
        product_id: { type: string }
        product_name: { type: string }
        product_active: { type: boolean }
        our_sku: { type: string, nullable: true }
        supplier_id: { type: string }
        supplier_name: { type: string }
        facility:
          type: object
          nullable: true
          description: Null = no facility recorded. The item counts toward the whole supplier.
          properties:
            id: { type: string }
            name: { type: string }
            plant_code: { type: string, nullable: true }
            active: { type: boolean }
        approval_status: { type: string, enum: [approved, pending, not_approved] }
        approval_source: { type: string, nullable: true, enum: [initial, person, import], description: initial = on file when approvals were introduced and nobody decided it. Null = nothing said yet. }
        approval_decided_at: { type: string, nullable: true }
        approval_decided_by: { type: string, nullable: true }
        approval_decided_by_name: { type: string, nullable: true }
        approval_note: { type: string, nullable: true }
        supplied: { type: boolean, description: Not marked no longer supplied. Independent of approval. }
        discontinued_at: { type: string, nullable: true }
        link_source: { type: string, nullable: true }
        brand_owner: { type: string, nullable: true }
        producer: { type: string, nullable: true }
        plant_code: { type: string, nullable: true }
        private_label: { type: boolean, description: Brand owner and producer both recorded and different. Display only. }
    SupplierFacility:
      type: object
      properties:
        id: { type: string }
        supplier_id: { type: string }
        name: { type: string }
        plant_code: { type: string, nullable: true, description: Recorded, never matched on }
        notes: { type: string, nullable: true }
        active: { type: boolean }
        item_count: { type: integer }
        created_at: { type: string }
        updated_at: { type: string }
    SupplierFacilities:
      type: object
      properties:
        supplier:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
        facilities:
          type: array
          items: { $ref: '#/components/schemas/SupplierFacility' }
    CustomerContact:
      type: object
      properties:
        id: { type: string }
        customer_id: { type: string }
        name: { type: string, nullable: true }
        email: { type: string }
        role: { type: string, nullable: true }
        is_primary: { type: boolean }
        coa_recipient: { type: boolean, description: Pre-filled as a recipient when an order's documents are sent }
        created_at: { type: string }
        updated_at: { type: string }
    CustomerContacts:
      type: object
      properties:
        customer:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            email: { type: string, nullable: true }
        contacts:
          type: array
          items: { $ref: '#/components/schemas/CustomerContact' }
    CustomerItemRequirement:
      type: object
      description: What one customer needs for one item (migration 0135).
      properties:
        id: { type: string }
        customer_id: { type: string }
        product_id: { type: string }
        product_name: { type: string }
        product_active: { type: boolean }
        coa_required: { type: string, enum: ['yes', 'no', on_request] }
        must_show: { type: string, nullable: true }
        timing: { type: string, nullable: true }
        delivery_contact_id: { type: string, nullable: true }
        delivery_contact:
          type: object
          nullable: true
          properties:
            id: { type: string }
            name: { type: string, nullable: true }
            email: { type: string }
        source: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        created_at: { type: string }
        updated_at: { type: string }
    CustomerItemRequirements:
      type: object
      properties:
        customer:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
        requirements:
          type: array
          items: { $ref: '#/components/schemas/CustomerItemRequirement' }
    SupplierContact:
      type: object
      properties:
        id: { type: string }
        supplier_id: { type: string }
        name: { type: string, nullable: true }
        email: { type: string }
        role: { type: string, nullable: true }
        priority: { type: integer, nullable: true }
        is_document_contact: { type: boolean, description: The one address document requests go to }
        active: { type: boolean }
        source: { type: string, nullable: true, description: admin or import }
        created_at: { type: string }
        updated_at: { type: string }
    SupplierContacts:
      type: object
      properties:
        supplier:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
        contacts:
          type: array
          items: { $ref: '#/components/schemas/SupplierContact' }
        document_contact:
          allOf:
            - { $ref: '#/components/schemas/SupplierContact' }
          nullable: true
    SupplierContactWrite:
      type: object
      properties:
        email: { type: string }
        name: { type: string, nullable: true }
        role: { type: string, nullable: true }
        priority: { type: integer, nullable: true }
        is_document_contact: { type: boolean }
        active: { type: boolean }
    RenewalRequestSend:
      type: object
      properties:
        id: { type: string }
        stage: { type: string, enum: [window_open, day_of, plus_7, plus_14] }
        status: { type: string, enum: [pending, sent, failed, skipped, superseded, cancelled] }
        draft_subject: { type: string }
        draft_body: { type: string }
        approver_user_id: { type: string, nullable: true }
        approver_name: { type: string, nullable: true }
        approver_via: { type: string, nullable: true, enum: [owner_route, master_user, org_admins] }
        drafted_at: { type: string }
        approved_by: { type: string, nullable: true }
        approved_by_name: { type: string, nullable: true }
        approved_at: { type: string, nullable: true }
        sent_at: { type: string, nullable: true }
        sent_to: { type: string, nullable: true }
        sent_subject: { type: string, nullable: true, description: The exact subject that left }
        sent_body: { type: string, nullable: true, description: The exact body that left, link block included }
        skipped_by_name: { type: string, nullable: true }
        skipped_at: { type: string, nullable: true }
        failure: { type: string, nullable: true }
    RenewalRequest:
      type: object
      properties:
        id: { type: string }
        document:
          type: object
          properties:
            id: { type: string }
            title: { type: string }
        supplier:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
        due_date: { type: string, format: date }
        status: { type: string, enum: [open, satisfied, stopped, escalated] }
        status_reason: { type: string, nullable: true }
        escalated_at: { type: string, nullable: true }
        closed_at: { type: string, nullable: true }
        request_id: { type: string, nullable: true, description: The document request the first approval issued }
        contact:
          type: object
          nullable: true
          properties:
            name: { type: string, nullable: true }
            email: { type: string }
        sends:
          type: array
          items: { $ref: '#/components/schemas/RenewalRequestSend' }
        waiting_send_id: { type: string, nullable: true }
        can_approve: { type: boolean, description: Whether the caller may approve or skip the waiting draft }
        emails_sent: { type: integer }
    RenewalDefaultOwner:
      type: object
      properties:
        tenant_id: { type: string }
        user_id: { type: string, nullable: true }
        user_name: { type: string, nullable: true }
        user_email: { type: string, nullable: true }
        resolves: { type: boolean }
        updated_at: { type: string, nullable: true }
        updated_by_name: { type: string, nullable: true }
        unchanged: { type: boolean }
        candidates:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              email: { type: string }
              role: { type: string }
    ResolvedRenewalAlertLead:
      type: object
      description: A resolved renewal alert lead time and which rung answered.
      properties:
        days: { type: integer }
        source: { type: string, enum: [document_type, tenant, default] }
    ExpirationRow:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        primary_category_name: { type: string, nullable: true }
        owner: { type: string, nullable: true }
        renewal_type: { type: string }
        renewal_due_date: { type: string, format: date, nullable: true }
        status: { type: string, enum: [current, expiring, expired, overdue, stale], description: Judged against the dashboard look-ahead }
        days_until: { type: integer, nullable: true }
        renewal_rule: { type: string }
        renewal_period_months: { type: integer, nullable: true }
        alert_lead_days: { type: integer, description: "Days before due this document's owner is warned" }
        alert_lead_source: { type: string, enum: [document_type, tenant, default] }
        alert_status: { type: string, enum: [current, expiring, expired, overdue, stale], description: "Judged against alert_lead_days; what alerts mail on" }
    RenewalAlertedDocument:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        status: { type: string }
        renewal_due_date: { type: string, format: date, nullable: true }
        days_until: { type: integer, nullable: true }
        alert_lead_days: { type: integer }
        alert_lead_source: { type: string, enum: [document_type, tenant, default] }
    RenewalAlertLeadTime:
      type: object
      properties:
        tenant_id: { type: string }
        lead_days: { type: integer, nullable: true, description: "The stored setting; null = the default applies" }
        effective: { $ref: '#/components/schemas/ResolvedRenewalAlertLead' }
        default_lead_days: { type: integer, example: 60 }
        min_lead_days: { type: integer, example: 7 }
        max_lead_days: { type: integer, example: 365 }
        presets: { type: array, items: { type: integer }, example: [30, 60, 90] }
        updated_at: { type: string, nullable: true }
        updated_by: { type: string, nullable: true }
        updated_by_name: { type: string, nullable: true }
        document_type_overrides:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              lead_days: { type: integer }
              updated_at: { type: string, nullable: true }
    RenewalLeadTimePreview:
      type: object
      properties:
        as_of: { type: string, format: date }
        scope: { type: string, enum: [tenant, document_type] }
        document_type_id: { type: string, nullable: true }
        proposed_lead_days: { type: integer, nullable: true }
        current_tenant_lead: { $ref: '#/components/schemas/ResolvedRenewalAlertLead' }
        proposed_tenant_lead: { $ref: '#/components/schemas/ResolvedRenewalAlertLead' }
        current_alerting_count: { type: integer }
        proposed_alerting_count: { type: integer }
        newly_entering_count: { type: integer, description: "Alerting under the proposal and not today" }
        newly_entering_would_send_count: { type: integer, description: "Of those, the ones the next scheduled run would mail (cooldown applied)" }
        leaving_count: { type: integer }
        lead_changed_count: { type: integer }
        newly_entering:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              days_until: { type: integer, nullable: true }
              alert_lead_days: { type: integer }
              alert_lead_source: { type: string }
              current_alert_lead_days: { type: integer }
              next_run_decision: { type: string, enum: [first, escalated, cooldown_elapsed, suppressed], nullable: true }
        leaving: { type: array, items: { type: object } }
    User:
      type: object
      properties:
        id:
          type: string
          description: Hex UUID (no dashes)
          example: "a1b2c3d4e5f6789012345678abcdef01"
        email:
          type: string
          format: email
          example: "user@example.com"
        name:
          type: string
          example: "John Doe"
        role:
          type: string
          enum: [super_admin, org_admin, user, reader]
          example: "user"
        tenant_id:
          type: string
          nullable: true
          description: Tenant this user belongs to. Null for super_admins without a tenant.
          example: "abcdef1234567890abcdef1234567890"
        active:
          type: integer
          enum: [0, 1]
          description: "1 = active, 0 = deactivated"
          example: 1
        last_login_at:
          type: string
          nullable: true
          format: date-time
        created_at:
          type: string
          format: date-time
      required: [id, email, name, role, active]

    Tenant:
      type: object
      properties:
        id:
          type: string
          example: "abcdef1234567890abcdef1234567890"
        name:
          type: string
          example: "Acme Corp"
        slug:
          type: string
          description: URL-safe identifier, auto-generated from name if not provided
          example: "acme-corp"
        description:
          type: string
          nullable: true
          example: "Manufacturing division"
        active:
          type: integer
          enum: [0, 1]
          example: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, name, slug, active, created_at, updated_at]

    Document:
      type: object
      properties:
        id:
          type: string
          example: "doc123abc456def789012345678abcde"
        tenant_id:
          type: string
        title:
          type: string
          example: "Safety Data Sheet - Widget A"
        description:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
          example: "regulatory"
        tags:
          type: string
          description: JSON-encoded array of tag strings
          example: '["safety","compliance"]'
        current_version:
          type: integer
          description: Latest version number (0 = no file uploaded yet)
          example: 3
        status:
          type: string
          enum: [active, archived, deleted]
          example: "active"
        created_by:
          type: string
          description: User ID of creator
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        creator_name:
          type: string
          nullable: true
          description: Joined from users table
        creator_email:
          type: string
          nullable: true
          description: Joined from users table
        tenant_name:
          type: string
          nullable: true
          description: Joined from tenants table
        external_ref:
          type: string
          nullable: true
          description: Stable external reference ID for programmatic upserts
          example: "REF-2024-001"
        source_metadata:
          type: string
          nullable: true
          description: JSON string with ingestion metadata (source, from, subject, received_at, etc.)
      required: [id, tenant_id, title, current_version, status, created_by, created_at, updated_at]

    DocumentVersion:
      type: object
      properties:
        id:
          type: string
        document_id:
          type: string
        version_number:
          type: integer
          example: 2
        file_name:
          type: string
          example: "sds-widget-a-v2.pdf"
        file_size:
          type: integer
          description: File size in bytes
          example: 524288
        mime_type:
          type: string
          example: "application/pdf"
        r2_key:
          type: string
          description: Storage key in R2
          example: "acme-corp/doc123/2/sds-widget-a-v2.pdf"
        checksum:
          type: string
          nullable: true
          description: SHA-256 hex digest
        change_notes:
          type: string
          nullable: true
          example: "Updated section 4.2 with new regulations"
        uploaded_by:
          type: string
          description: User ID of uploader
        created_at:
          type: string
          format: date-time
        uploader_name:
          type: string
          nullable: true
          description: Joined from users table (present in list responses)
      required: [id, document_id, version_number, file_name, file_size, mime_type, r2_key, uploaded_by, created_at]

    AuditEntry:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: string
          nullable: true
        tenant_id:
          type: string
          nullable: true
        action:
          type: string
          description: "Action performed, e.g. login, logout, document_created, document_updated, document_deleted, document_version_uploaded, document_downloaded, user_created, user_updated, user_deactivated, user.password_reset, tenant_created, tenant_updated, tenant_deactivated, password_changed, report.generate"
          example: "document_created"
        resource_type:
          type: string
          nullable: true
          example: "document"
        resource_id:
          type: string
          nullable: true
        details:
          type: string
          nullable: true
          description: JSON string with change details
        ip_address:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        user_name:
          type: string
          nullable: true
          description: Joined from users table
        user_email:
          type: string
          nullable: true
          description: Joined from users table
      required: [id, action, created_at]

    AuthPayload:
      type: object
      properties:
        token:
          type: string
          description: JWT bearer token (24h expiry)
        user:
          type: object
          properties:
            id:
              type: string
            email:
              type: string
            name:
              type: string
            role:
              type: string
            tenant_id:
              type: string
              nullable: true
            force_password_change:
              type: integer
              enum: [0, 1]
              description: "1 if user must change password on next login"
      required: [token, user]

    SharingRule:
      type: string
      enum: [free, qa, locked]
      description: |
        May a document leave the organization (decision C-003, migration 0137).
        `free` = send freely; `qa` = needs QA approval; `locked` = never leaves.
        Resolved, most specific first: the document's own override; NO TYPE AT
        ALL = `locked`; the rule stored on its document type; the type's name
        against the starting table; a name nobody recognises = `qa`.

    SharingRefusal:
      type: object
      description: |
        One document an exit refused, and why. Every exit that can refuse names
        its refusals with this shape; a document left behind is never silently
        dropped.
      properties:
        document_id: { type: string }
        title: { type: string }
        document_type_name: { type: string, nullable: true }
        rule: { $ref: '#/components/schemas/SharingRule' }
        reason:
          type: string
          enum: [locked, needs_qa]
          description: "`locked` = never leaves; `needs_qa` = the caller may not release it."
        message: { type: string, description: One sentence a screen can print as it stands. }

    SharingRuleRefused:
      type: object
      description: The 403 body when the sharing rule left NOTHING to hand over.
      properties:
        error: { type: string, description: Names every document under its reason. }
        code: { type: string, enum: [sharing_rule_refused] }
        refused:
          type: array
          items: { $ref: '#/components/schemas/SharingRefusal' }

    Error:
      type: object
      properties:
        error:
          type: string
          example: "Unauthorized"
      required: [error]

    ApiKey:
      type: object
      properties:
        id:
          type: string
          description: Hex UUID
        name:
          type: string
          description: Human-readable name for the API key
          example: "CI Pipeline Key"
        key_prefix:
          type: string
          description: First 12 characters of the key (for identification)
          example: "dox_sk_abc12"
        user_id:
          type: string
          description: User who created the key
        tenant_id:
          type: string
          nullable: true
          description: Tenant this key is scoped to (null = determined by user's tenant)
        permissions:
          type: string
          description: JSON array of permission strings (default '["*"]')
          example: '["*"]'
        last_used_at:
          type: string
          nullable: true
          format: date-time
        expires_at:
          type: string
          nullable: true
          description: Last moment the key works (UTC timestamp). Older keys may hold a bare date, which means through the end of that day UTC.
        revoked:
          type: integer
          enum: [0, 1]
          description: "0 = active, 1 = revoked"
        created_at:
          type: string
          format: date-time
        user_name:
          type: string
          nullable: true
          description: Joined from users table
        user_email:
          type: string
          nullable: true
          description: Joined from users table
      required: [id, name, key_prefix, user_id, permissions, revoked, created_at]

    RequestArrivalClaim:
      type: object
      description: |
        One "this file covers that requirement" claim, mapped onto the CURRENT
        version of the request by line identity. `line_id` is the id to decide
        with; `claimed_line_id` is the row the claim was made against.
      properties:
        claim_id: { type: string }
        line_id: { type: string, nullable: true, description: Null when a later amendment removed the line. }
        claimed_line_id: { type: string }
        line_name: { type: string }
        line_kind: { type: string, enum: [requirement, free_text] }
        requirement_id: { type: string, nullable: true }
        tier: { type: string, enum: [required, recommended] }
        line_status: { type: string, nullable: true, enum: [not_started, received, under_review, accepted, needs_attention] }
        line_accepted_document_id: { type: string, nullable: true }
        claimed_by: { type: string, enum: [supplier, staff] }
        added_by_name: { type: string, nullable: true }
        decision: { type: string, nullable: true, enum: [accepted, needs_attention] }
        decision_document_id: { type: string, nullable: true }
        decided_at: { type: string, nullable: true }
        decided_by_name: { type: string, nullable: true }
        decided_elsewhere:
          type: boolean
          description: Undecided here, but the line was settled from another file or by hand.

    SpecCheck:
      type: object
      description: |
        One judged test result in the out-of-spec register. Verdicts are never
        edited; only acknowledgement is written from outside.
      properties:
        id: { type: string }
        tenant_id: { type: string }
        document_id: { type: string }
        version_number: { type: integer, nullable: true }
        queue_item_id: { type: string, nullable: true }
        spec_test_id: { type: string, nullable: true }
        test_name_raw: { type: string }
        value_raw: { type: string, nullable: true }
        value_num: { type: number, nullable: true }
        unit_raw: { type: string, nullable: true }
        verdict: { type: string, enum: [in_spec, out_of_spec, not_checked] }
        reason: { type: string, nullable: true }
        source: { type: string, enum: [printed, limit], description: "printed = the COA's own spec; limit = our configured limit" }
        limit_id: { type: string, nullable: true }
        limit_snapshot: { type: string, nullable: true, description: JSON of the limit as it stood when judged }
        acknowledged_by: { type: string, nullable: true }
        acknowledged_at: { type: string, nullable: true }
        acknowledgement_note: { type: string, nullable: true }
        notified_at: { type: string, nullable: true }
        judgement_origin:
          type: string
          nullable: true
          enum: [approval, bulk_recheck]
          description: |
            Who judged it (migration 0103). `approval` = a reviewer had the
            document open with this result showing. `bulk_recheck` =
            bin/backfill-spec-register computed it over history; nobody reviewed
            it at approval and nobody was emailed.
        bulk_run_at: { type: string, nullable: true, description: The bulk pass's timestamp; NULL at approval }
        result_key: { type: string, nullable: true, description: 'Where on the certificate the result was printed (migration 0105), e.g. "ai_fields::t0r2c9"' }
        result_location: { type: string, nullable: true, description: 'The same place in words, e.g. "Table 1, row 3 (26141R)"' }
        created_at: { type: string }
        document_title: { type: string, nullable: true }
        supplier_id: { type: string, nullable: true }
        supplier_name: { type: string, nullable: true }
        spec_test_name: { type: string, nullable: true }
        acknowledged_by_name: { type: string, nullable: true }

    IntakeDuplicate:
      type: object
      description: |
        One arrival that did not become a review card because the identical
        file (same SHA-256, same tenant) was already approved or already
        waiting. Never carries the storage key.
      properties:
        id: { type: string }
        tenant_id: { type: string }
        checksum: { type: string }
        match_kind: { type: string, enum: [already_approved, already_waiting] }
        matched_document_id: { type: string, nullable: true }
        matched_document_title: { type: string, nullable: true }
        matched_queue_id: { type: string, nullable: true }
        matched_queue_file_name: { type: string, nullable: true }
        matched_queue_status: { type: string, nullable: true, enum: [pending, approved, rejected] }
        source: { type: string, description: "The door: import, email, api, public_link, s3, manual, request_link" }
        source_detail: { type: string, nullable: true }
        source_id: { type: string, nullable: true }
        connector_run_id: { type: string, nullable: true }
        request_upload_id: { type: string, nullable: true }
        file_name: { type: string }
        file_size: { type: integer }
        mime_type: { type: string }
        received_at: { type: string }
        created_by: { type: string, nullable: true }
        created_by_name: { type: string, nullable: true }
        queue_id: { type: string, nullable: true, description: NULL while still suppressed; the queue item Review anyway created. }
        overridden_by: { type: string, nullable: true }
        overridden_by_name: { type: string, nullable: true }
        overridden_at: { type: string, nullable: true }

    RequestArrival:
      type: object
      description: |
        One supplier upload. Never carries the uploader IP or the storage key;
        the bytes are served by GET /api/request-uploads/{id}/file.
      properties:
        id: { type: string }
        tenant_id: { type: string }
        supplier_id: { type: string }
        supplier_name: { type: string, nullable: true }
        request_id: { type: string, description: The version current when the file arrived. }
        root_request_id: { type: string }
        current_request_id: { type: string, description: The version decisions are made against. }
        current_request_status: { type: string, enum: [draft, issued, cancelled, closed] }
        request_title: { type: string }
        file_name: { type: string }
        file_size: { type: integer }
        mime_type: { type: string }
        uploaded_at: { type: string }
        uploader_label: { type: string, nullable: true }
        queue_id: { type: string, nullable: true }
        document_id: { type: string, nullable: true }
        document_title: { type: string, nullable: true }
        documents:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
        pipeline_state:
          type: string
          enum: [not_read, extracting, extraction_error, awaiting_approval, rejected_in_queue, document_linked]
          description: Only `document_linked` allows a requirement to be accepted from this file.
        rejection_reason: { type: string, nullable: true }
        rejection_note: { type: string, nullable: true }
        processing_error: { type: string, nullable: true }
        spec:
          type: object
          nullable: true
          properties:
            out_of_spec: { type: integer }
            not_checked: { type: integer }
            source: { type: string, enum: [queue, register] }
        claims:
          type: array
          items:
            $ref: '#/components/schemas/RequestArrivalClaim'
        pending_count:
          type: integer
          description: Undecided claims whose current line is still received or under review.

    DecideArrivalRequest:
      type: object
      required: [decisions]
      properties:
        decisions:
          type: array
          minItems: 1
          items:
            type: object
            required: [line_id, decision]
            properties:
              line_id: { type: string, description: A line on the CURRENT version. }
              decision: { type: string, enum: [accepted, needs_attention] }
              document_id:
                type: string
                nullable: true
                description: Accept only. Defaults to the arrival's document; must be an active document of the same supplier.
              status_note: { type: string, nullable: true, description: Internal. Never shown to the supplier. }
              attention_reason:
                type: string
                nullable: true
                description: Needs-attention only. The sentence the supplier reads; blank falls back to one composed from the line's criteria.

    SearchConstraint:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [lot, date, supplier, product, document_type, metadata, text] }
        label: { type: string, example: "production date Jul 31, 2026" }
        raw: { type: string }
        value: { type: string }
        fields: { type: array, items: { type: string } }
        role: { type: string, enum: [production, code, expiration, ship, uploaded, any] }
        date_from: { type: string, nullable: true }
        date_to: { type: string, nullable: true }
        month_day:
          type: object
          nullable: true
          properties:
            month: { type: integer }
            day: { type: integer }
        match: { type: string, enum: [equals, contains] }
        source: { type: string, enum: [query_text, ai_parse] }
        note: { type: string, nullable: true }
    SearchConstraintCheck:
      type: object
      properties:
        constraint_id: { type: string }
        outcome:
          type: string
          enum: [match, near, role_mismatch, ambiguous, partial_lot, multiple_values, mismatch, missing, unverified]
        field: { type: string, nullable: true }
        field_label: { type: string, nullable: true }
        value: { type: string, nullable: true }
        provenance: { type: string, enum: [extracted, linked_record, system], nullable: true }
        message: { type: string }
        distance_days: { type: integer, nullable: true }
    CoverageDocumentRow:
      type: object
      description: A document row (d.* plus joined names and snippets). Coverage fields are present on constrained searches only.
      additionalProperties: true
      properties:
        id: { type: string }
        title: { type: string }
        match_status: { type: string, enum: [covering, candidate_not_matching] }
        match_checks: { type: array, items: { $ref: '#/components/schemas/SearchConstraintCheck' } }
        match_reason: { type: string, nullable: true }
    SearchUnreviewedCandidate:
      type: object
      properties:
        queue_id: { type: string }
        file_name: { type: string }
        supplier: { type: string, nullable: true }
        created_at: { type: string, nullable: true }
        review_url: { type: string, example: "/review?item=39c0426404e44947a83ed8b15f3423be" }
        match_status: { type: string, enum: [unreviewed_candidate] }
        matches_all_constraints: { type: boolean }
        record_label: { type: string, nullable: true }
        match_checks: { type: array, items: { $ref: '#/components/schemas/SearchConstraintCheck' } }
        match_reason: { type: string }
    SearchCoverageFields:
      type: object
      properties:
        coverage: { type: string, enum: [covered, likely, ambiguous, none, unconstrained] }
        constraints: { type: array, items: { $ref: '#/components/schemas/SearchConstraint' } }
        dropped_constraints:
          type: array
          items:
            type: object
            properties:
              kind: { type: string }
              label: { type: string }
              raw: { type: string }
              reason: { type: string }
        coverage_summary: { type: string, nullable: true, example: "No document on file covers production date Jul 31, 2026." }
        covering_count: { type: integer }
        candidate_count: { type: integer }
        unreviewed_candidates: { type: array, items: { $ref: '#/components/schemas/SearchUnreviewedCandidate' } }
        coverage_scan_truncated: { type: boolean }
        modules_not_applied:
          type: array
          items: { type: string, enum: [library, compliance, fulfillment, records] }
          description: |
            Modules whose records were left out of this answer because the module is off for the
            caller (off for the organization, or not among what their department sees). Today only
            `fulfillment`: no order or customer was searched and no order number or customer PO was
            followed. ABSENT for a caller who has the module.
    UniversalSearchBlock:
      type: object
      properties:
        total: { type: integer }
        results: { type: array, items: { type: object, additionalProperties: true } }

    PaginatedDocuments:
      type: object
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/Document'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    PaginatedAudit:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

  parameters:
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 50
        maximum: 200
      description: Maximum number of results (capped at 200)
    OffsetParam:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
      description: Number of results to skip for pagination

paths:
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in and obtain a JWT
      description: |
        Authenticates with email and password. Returns a JWT token valid for 24 hours.
        Creates a server-side session record. Rate limited to 5 attempts per 15 minutes per IP+email.
        **No auth required.**
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required: [email, password]
            example:
              email: "admin@example.com"
              password: "SecurePass1"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPayload'
        '400':
          description: Missing email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Account inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited (too many failed attempts)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register (create) a new user
      description: |
        Creates a new user account. **Requires super_admin or org_admin role.**
        - super_admin can create any role in any tenant.
        - org_admin can only create user/reader roles within their own tenant.
        Sends an invitation email if RESEND_API_KEY is configured.
        The new user is created with force_password_change = 1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                role:
                  type: string
                  enum: [super_admin, org_admin, user, reader]
                password:
                  type: string
                  description: "Must be 8-128 chars with uppercase, lowercase, and number"
                tenantId:
                  type: string
                  description: Required for non-super_admin roles. org_admin defaults to own tenant.
              required: [email, name, role, password]
            example:
              email: "newuser@example.com"
              name: "Jane Doe"
              role: "user"
              password: "Welcome123"
              tenantId: "abcdef1234567890abcdef1234567890"
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  emailSent:
                    type: boolean
                    description: Whether invitation email was sent
        '400':
          description: Validation error (missing fields, bad email, weak password)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: User with this email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/password:
    put:
      tags: [Auth]
      summary: Change own password
      description: |
        Allows the authenticated user to change their own password.
        Requires the current password for verification.
        Clears the force_password_change flag.
        **Requires any authenticated user.**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  description: "Must be 8-128 chars with uppercase, lowercase, and number"
              required: [currentPassword, newPassword]
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Missing fields or weak password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Current password incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Log out (revoke session)
      description: |
        Revokes the current session server-side. The JWT in the Authorization header
        is looked up by its SHA-256 hash and marked as revoked.
        **Requires any authenticated user.**
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

  /api/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset email
      description: |
        Sends a password reset email with a one-time token (1 hour expiry).
        Always returns the same success message regardless of whether the email exists (prevents enumeration).
        Rate limited to 3 attempts per 15 minutes per IP.
        **No auth required.**
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required: [email]
      responses:
        '200':
          description: Always returns success message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "If an account exists with that email, a reset link has been sent"
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password using a token
      description: |
        Completes a password reset using the token from the reset email.
        Validates password complexity, updates the password, and revokes all existing sessions.
        **No auth required.**
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: Reset token from the email link
                newPassword:
                  type: string
                  description: "Must be 8-128 chars with uppercase, lowercase, and number"
              required: [token, newPassword]
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Password has been reset successfully"
        '400':
          description: Invalid/expired token or weak password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/documents:
    get:
      tags: [Documents]
      summary: List documents
      description: |
        Returns a paginated list of documents. Non-super_admin users are restricted to their own tenant.
        **Requires any authenticated user.**
      parameters:
        - name: tenantId
          in: query
          schema:
            type: string
          description: Filter by tenant (super_admin only; others auto-scoped)
        - name: category
          in: query
          schema:
            type: string
          description: Filter by category
        - name: status
          in: query
          schema:
            type: string
            enum: [active, archived, deleted]
            default: active
          description: Filter by status
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: Paginated document list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDocuments'

    post:
      tags: [Documents]
      summary: Create a new document
      description: |
        Creates a document metadata record (no file yet — upload separately).
        **Requires super_admin, org_admin, or user role.**
        Non-super_admins are forced to their own tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                category:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
                tenantId:
                  type: string
                  description: Required. super_admin can specify any tenant.
              required: [title]
            example:
              title: "Safety Data Sheet - Widget A"
              description: "SDS for Widget A per OSHA 2024"
              category: "regulatory"
              tags: ["safety", "osha", "2024"]
              tenantId: "abcdef1234567890abcdef1234567890"
      responses:
        '201':
          description: Document created
          content:
            application/json:
              schema:
                type: object
                properties:
                  document:
                    $ref: '#/components/schemas/Document'
        '400':
          description: Missing title or tenantId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions or wrong tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Tenant not found or inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/documents/{id}:
    get:
      tags: [Documents]
      summary: Get a single document
      description: |
        Returns document metadata with current version info.
        Requires tenant access (user must belong to the document's tenant, or be super_admin).
        **Requires any authenticated user.**
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Document with current version
          content:
            application/json:
              schema:
                type: object
                properties:
                  document:
                    $ref: '#/components/schemas/Document'
                  currentVersion:
                    $ref: '#/components/schemas/DocumentVersion'
        '403':
          description: Access denied to this tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [Documents]
      summary: Update document metadata
      description: |
        Updates title, description, category, tags, and/or status.
        Logs a diff of what changed in the audit trail.
        **Requires super_admin, org_admin, or user role** with tenant access.

        `sharing_rule_override` (migration 0137) gives this ONE document its own
        sharing rule, or `null` to go back to its type's rule. Only an admin or
        a QA releaser may change it (403 otherwise), `sharing_rule_reason` is
        required when it changes (400 otherwise), and only an admin may move a
        document off `locked`. Audited as `document.sharing_rule_overridden`
        with the reason. Sending the value already in force is not a change.

        `document_type_id` and `categories` change the document's TYPE, and the
        type carries the sharing rule, so they are checked the same way: a
        change that LOOSENS the effective rule needs an administrator (off
        `locked`, which includes typing a document that has no type) or a QA
        releaser (`qa` to `free`), and is never made with an API key; 403
        `sharing_rule_change_refused` otherwise, and nothing is written. The
        type must belong to the document's organization (400). Any move of the
        effective rule is audited as `document.sharing_rule_changed`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                category:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
                status:
                  type: string
                  enum: [active, archived]
                sharing_rule_override:
                  nullable: true
                  allOf:
                    - $ref: '#/components/schemas/SharingRule'
                sharing_rule_reason:
                  type: string
                  description: Why. Required when `sharing_rule_override` changes. 500 characters at most.
            example:
              title: "Updated Title"
              status: "archived"
      responses:
        '200':
          description: Updated document
          content:
            application/json:
              schema:
                type: object
                properties:
                  document:
                    $ref: '#/components/schemas/Document'
        '400':
          description: No fields to update or invalid status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Documents]
      summary: Delete a document (soft delete)
      description: |
        Sets document status to 'deleted'. Does not remove files from R2.
        **Requires super_admin, org_admin, or user role** with tenant access.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Document deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/documents/{id}/upload:
    post:
      tags: [Documents]
      summary: Upload a new document version
      description: |
        Uploads a file as a new version of the document. Accepts multipart form data.
        The file is stored in R2 with key: `{tenantSlug}/{docId}/{version}/{fileName}`.
        SHA-256 checksum is computed and stored.

        **Allowed file types:** PDF, DOC, DOCX, XLS, XLSX, CSV, TXT, PNG, JPG.
        **Max file size:** 100 MB.

        **Requires super_admin, org_admin, or user role** with tenant access.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload
                changeNotes:
                  type: string
                  description: Optional notes describing what changed in this version
              required: [file]
      responses:
        '201':
          description: Version uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    $ref: '#/components/schemas/DocumentVersion'
        '400':
          description: Missing file, invalid type, or file too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Document not found or not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/documents/{id}/download:
    get:
      tags: [Documents]
      summary: Download a document file
      description: |
        Downloads the file for a specific version (or current version by default).
        Returns the raw file with Content-Disposition header for browser download.
        Logs a download audit entry.
        **Requires any authenticated user** with tenant access.

        **Sharing rule (migration 0137).** A logged-in person opening one file
        in the portal is not "leaving": any role, any rule. An **API key** reads
        the file only when its sharing rule is `free`; otherwise 403
        `sharing_rule_refused` (audited `document.sharing_rule_refused`). With
        `source=packet` the file is the original packet, which holds every part
        split from it, so a key reads it only when EVERY document citing that
        packet is `free`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: query
          schema:
            type: integer
          description: Version number to download (defaults to current version)
        - name: source
          in: query
          schema:
            type: string
            enum: [packet]
          description: Return the original packet this version was split out of (migration 0126).
      responses:
        '200':
          description: File download
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="report.pdf"'
            Content-Type:
              schema:
                type: string
                example: "application/pdf"
            ETag:
              schema:
                type: string
                description: SHA-256 checksum
        '400':
          description: Invalid version number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Document, version, or file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/documents/{id}/versions:
    get:
      tags: [Documents]
      summary: List all versions of a document
      description: |
        Returns all versions for a document, ordered by version number descending.
        Includes uploader name and email.
        **Requires any authenticated user** with tenant access.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Version list
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions:
                    type: array
                    items:
                      $ref: '#/components/schemas/DocumentVersion'
                  document_id:
                    type: string
                  current_version:
                    type: integer
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/documents/search:
    get:
      tags: [Documents]
      summary: Search documents
      description: |
        Searches documents by title, description, tags, and file names using SQL LIKE.
        Joins document_versions to match against file_name as well.
        Only returns active documents. Non-admins are restricted to their own tenant.
        **Requires any authenticated user.**
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query (matches title, description, tags, and file names)
        - name: tenantId
          in: query
          schema:
            type: string
          description: Filter by tenant (admin only)
        - name: category
          in: query
          schema:
            type: string
          description: Filter by category
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDocuments'

  /api/search:
    get:
      tags: [Documents]
      summary: Universal search with coverage
      description: |
        Grouped FTS5 search across documents, suppliers, products, document types, orders,
        customers and bundles (top-N per type).

        **Coverage.** When the query states a lot (`1042620303`, `10426203-03`, `lot 10426203 sublot 03`)
        or a date (`production date 7/31/2026`, `exp 31-Jul-2026`, a bare `2026-07-31`), those become
        constraints. Each document is checked against its OWN structured fields (lot records,
        extracted production/code/expiration/ship dates, supplier) and the `documents` block becomes
        the covering documents followed by labelled non-matching candidates (`match_status`,
        `match_checks`, `match_reason`). `coverage` is `covered`, `none` or `unconstrained`. A prefix of a
        lot is never covering; a code date never covers a production date; a stored date that reads
        two ways (`02/07/2026`) is reported as unverifiable. Pending Review Queue files that match are
        returned in `unreviewed_candidates` and are never covering.

        **Products and orders (migration 0107).** A product named the way a person knows it — our SKU
        (`2235`), the supplier's item (`810004`), a pack (`300 gal tote`), or words next to another
        constraint (`bulk unsalted butter produced 7/22/26`) — resolves through the product identifier
        graph into a `product` constraint carrying `product_resolution` (what it resolved to, and how).
        A phrase that fits several products is `coverage: ambiguous`: nothing is picked, and each
        candidate carries its own `covering_count`. Anything reached through an unconfirmed identifier,
        a pending lot-match suggestion, or an older auto-link is `likely` ("confirm"), never covering.
        A WMS order number (`1797062`) becomes an `order` constraint that follows its lines to the lots
        they shipped; a certificate covers only through a person's accepted match or an exact lot row.

        Query-time folding: simple singular/plural and `gal/gallon`, `lb/lbs/pound`, `oz/ounce`.

        **Module toggles.** Orders and customers belong to the fulfillment module. When it is off for
        the caller the `orders` and `customers` blocks are empty, an order number is not followed, and
        the response carries `modules_not_applied: ["fulfillment"]`. A super_admin is never narrowed.
        **Requires any authenticated user.**
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: tenant_id
          in: query
          schema: { type: string }
          description: Required for super_admin; ignored for everyone else.
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: limit_per_type
          in: query
          schema: { type: integer, default: 5, maximum: 25 }
        - name: lot
          in: query
          schema: { type: string }
          description: |
            A lot typed as its own input rather than inside `q`. Combined with
            `sublot` the two are matched PART AGAINST PART — a sublot never
            matches against a base lot number.
        - name: sublot
          in: query
          schema: { type: string }
          description: The sublot half of a two-input lot search. Only meaningful alongside `lot`.
      responses:
        '200':
          description: Grouped results, plus coverage fields
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SearchCoverageFields'
                  - type: object
                    properties:
                      documents:
                        type: object
                        properties:
                          total: { type: integer }
                          results:
                            type: array
                            items: { $ref: '#/components/schemas/CoverageDocumentRow' }
                      suppliers: { $ref: '#/components/schemas/UniversalSearchBlock' }
                      products: { $ref: '#/components/schemas/UniversalSearchBlock' }
                      doc_types: { $ref: '#/components/schemas/UniversalSearchBlock' }
                      orders: { $ref: '#/components/schemas/UniversalSearchBlock' }
                      customers: { $ref: '#/components/schemas/UniversalSearchBlock' }
                      bundles: { $ref: '#/components/schemas/UniversalSearchBlock' }

  /api/documents/search/natural:
    post:
      tags: [Documents]
      summary: Natural-language document search with coverage
      description: |
        An LLM parses the question into structure (`parsed_query`). Every structured predicate
        (supplier, products, document type, lot / date / other metadata filters, date range with
        `date_role`, expiration filter) is a CONSTRAINT judged per document, never a SQL filter
        dropped until something comes back. A role-dated phrase typed in the question ("produced
        7/22/26") overrides the model's reading of it. Anything that cannot be applied is listed in
        `dropped_constraints`, and then `coverage` cannot be `covered`. With no constraints the
        response is a plain keyword-ranked list (`coverage: unconstrained`).
        Returns 503 when the LLM is unavailable. **Requires any authenticated user.**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, example: "Darigold bulk unsalted butter produced 7/22/26" }
                tenant_id: { type: string }
      responses:
        '200':
          description: Results with coverage
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SearchCoverageFields'
                  - type: object
                    properties:
                      parsed_query: { type: object, description: 'LLM parse, including optional date_role' }
                      results:
                        type: array
                        items: { $ref: '#/components/schemas/CoverageDocumentRow' }
                      total: { type: integer }
        '503':
          description: LLM unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/tenants:
    get:
      tags: [Tenants]
      summary: List tenants
      description: |
        super_admin sees all tenants. Other users see only their own tenant.
        **Requires any authenticated user.**
      parameters:
        - name: active
          in: query
          schema:
            type: integer
            enum: [0, 1]
          description: Filter by active status
      responses:
        '200':
          description: Tenant list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tenant'

    post:
      tags: [Tenants]
      summary: Create a new tenant
      description: |
        Creates a new tenant (organization). Slug is auto-generated from name if not provided.
        **Requires super_admin role.**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                slug:
                  type: string
                  description: URL-safe identifier. Auto-generated from name if omitted.
                description:
                  type: string
              required: [name]
            example:
              name: "Acme Corp"
              description: "Manufacturing division"
      responses:
        '201':
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          description: Missing name or invalid slug
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not super_admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Slug already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/tenants/{id}:
    get:
      tags: [Tenants]
      summary: Get a tenant by ID
      description: |
        Returns a single tenant. super_admin can view any tenant.
        Other users can only view their own tenant.
        **Requires any authenticated user.**
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tenant details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [Tenants]
      summary: Update a tenant
      description: |
        Updates tenant fields. super_admin can update all fields (name, slug, description, active).
        org_admin can only update name and description for their own tenant.
        **Requires super_admin or org_admin role.**
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                slug:
                  type: string
                  description: super_admin only
                description:
                  type: string
                active:
                  type: integer
                  enum: [0, 1]
                  description: super_admin only
      responses:
        '200':
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          description: No valid fields to update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Slug already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Tenants]
      summary: Deactivate a tenant
      description: |
        Soft-deactivates a tenant by setting active = 0.
        **Requires super_admin role.**
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tenant deactivated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '403':
          description: Not super_admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users:
    get:
      tags: [Users]
      summary: List users
      description: |
        super_admin sees all users (optionally filtered by tenantId).
        org_admin sees only their own tenant's users.
        **Requires super_admin or org_admin role.**
      parameters:
        - name: tenantId
          in: query
          schema:
            type: string
          description: Filter by tenant (super_admin only)
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [Users]
      summary: Create user (redirects to register)
      description: |
        Returns a 308 redirect to POST /api/auth/register.
        Use /api/auth/register directly to create users.
      responses:
        '308':
          description: Redirect to /api/auth/register
          headers:
            Location:
              schema:
                type: string
                example: "/api/auth/register"

  /api/users/{id}:
    get:
      tags: [Users]
      summary: Get a user by ID
      description: |
        super_admin can view any user. org_admin can view users in their tenant.
        user/reader can only view themselves.
        **Requires any authenticated user.**
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: Cannot view users outside scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [Users]
      summary: Update a user
      description: |
        Updates user fields. Allowed fields depend on the caller's role:
        - **super_admin**: name, email, role, active, tenant_id (any user)
        - **org_admin**: name, email, role (user/reader only), active (same tenant only, cannot modify other org_admins)
        - **user/reader**: name only (self only)

        Logs a diff of changes in the audit trail.
        **Requires any authenticated user (self-edit for name).**
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                role:
                  type: string
                  enum: [super_admin, org_admin, user, reader]
                active:
                  type: integer
                  enum: [0, 1]
                tenant_id:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: No valid fields to update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Users]
      summary: Deactivate a user
      description: |
        Soft-deactivates a user by setting active = 0.
        - super_admin can deactivate any user.
        - org_admin can deactivate user/reader in their tenant (not other admins).
        **Requires super_admin or org_admin role.**
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User deactivated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      description: |
        Returns the authenticated user's profile including tenant name.
        **Requires any authenticated user.**
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/User'
                  - type: object
                    properties:
                      tenant_name:
                        type: string
                        nullable: true

  /api/users/{id}/reset-password:
    post:
      tags: [Users]
      summary: Admin-initiated password reset
      description: |
        Generates a temporary password, sets force_password_change = 1, and revokes all sessions.
        Sends an email notification if RESEND_API_KEY is configured.
        - super_admin can reset any user.
        - org_admin can reset user/reader in their tenant (not other admins).
        **Requires super_admin or org_admin role.**
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  temporaryPassword:
                    type: string
                    description: The generated temporary password (show to admin or send via email)
                  emailSent:
                    type: boolean
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/reports/generate:
    post:
      tags: [Reports]
      summary: Generate a document report
      description: |
        Generates a report of every non-deleted document matching the given
        filters. Returns CSV (default) or JSON. CSV includes Content-Disposition
        for download. Non-super_admins are scoped to their own tenant.

        The filters are exactly the four below — tenant, the legacy `category`
        field, and a `created_at` range. There is no supplier, document-type,
        product or status filter, and the output carries no supplier or products
        column; the columns are the ten listed in the response schema.

        Writes a `report.generate` audit row with the format, the category
        filter and the row count.
        **Requires any authenticated user.**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenantId:
                  type: string
                  description: Filter by tenant (super_admin only)
                category:
                  type: string
                  description: Filter by document category
                dateFrom:
                  type: string
                  format: date
                  description: Start date (inclusive)
                  example: "2024-01-01"
                dateTo:
                  type: string
                  format: date
                  description: End date (inclusive)
                  example: "2024-12-31"
                format:
                  type: string
                  enum: [csv, json]
                  default: csv
            example:
              category: "regulatory"
              dateFrom: "2024-01-01"
              dateTo: "2024-12-31"
              format: "json"
      responses:
        '200':
          description: Report data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                        category:
                          type: string
                        tags:
                          type: string
                        status:
                          type: string
                        currentVersion:
                          type: integer
                        fileName:
                          type: string
                        fileSizeKB:
                          type: integer
                        uploadedBy:
                          type: string
                        createdDate:
                          type: string
                        lastUpdated:
                          type: string
                  total:
                    type: integer
              description: JSON format response
            text/csv:
              schema:
                type: string
              description: |
                CSV format response with Content-Disposition header. Columns:
                Title, Category, Tags, Status, Current Version, File Name,
                File Size (KB), Uploaded By, Created Date, Last Updated.

  /api/reports/coa-fulfillment:
    get:
      tags: [Reports]
      summary: COA fulfillment — is a certificate on file for each shipped line?
      description: |
        One row per shipped order line, joined customer - order - lot - COA,
        each classified `ok` / `missing_lot` / `missing_coa` / `expired` against
        `as_of`. Any authenticated user; `tenant_id` is super_admin only and
        everyone else is pinned to their own tenant.

        With `format=csv` the same rows are returned as a CSV worklist and the
        request writes a `report.generate` audit row (`report_kind:
        "coa_fulfillment"`) with the filters and the row count. The JSON form
        writes no audit row — it is a screen read, not an export.
      parameters:
        - { name: tenant_id, in: query, schema: { type: string }, description: super_admin only }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: customer_id, in: query, schema: { type: string } }
        - { name: as_of, in: query, schema: { type: string, format: date }, description: Pins "today" for the expiry rule. Defaults to the server's UTC date. }
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 1000 }, description: "For `format=csv`: default 5000, maximum 5000." }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: format, in: query, schema: { type: string, enum: [json, csv], default: json } }
        - { name: gaps_only, in: query, schema: { type: boolean, default: false }, description: "CSV only: emit just the lines that are not `ok` (the Needs COA worklist)." }
      responses:
        '200':
          description: Rows plus a summary, or a CSV worklist
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows: { type: array, items: { type: object } }
                  summary: { type: object }
            text/csv:
              schema: { type: string }
              description: 'Columns: Customer, Order, PO, Product, Code, Lot, Status, Action.'

  /api/audit:
    get:
      tags: [Audit]
      summary: Query audit log
      description: |
        Returns paginated audit log entries with user info.
        - super_admin can query all entries, optionally filtered by tenant.
        - org_admin can only see their own tenant's entries.
        - user/reader get 403.

        Filters are built by the same `buildAuditFilters` helper the CSV export
        uses, so the screen and the export cannot drift. The tenant parameter is
        spelled `tenant_id` (snake case) — a `tenantId` parameter is ignored.
        **Requires super_admin or org_admin role.**
      parameters:
        - name: tenant_id
          in: query
          schema:
            type: string
          description: Filter by tenant (super_admin only; ignored for org_admin, who is pinned to their own tenant)
        - name: action
          in: query
          schema:
            type: string
          description: Filter by action type. Comma-separated for multiple (e.g. `login,logout`).
        - name: userId
          in: query
          schema:
            type: string
          description: Filter by user ID
        - name: resourceType
          in: query
          schema:
            type: string
          description: Filter by resource type (user, document, tenant, etc.)
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
          description: Start date (inclusive)
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
          description: End date (inclusive, through end of day)
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: Paginated audit entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAudit'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/audit/export:
    get:
      tags: [Audit]
      summary: Export audit log as CSV
      description: |
        Streams a CSV of every audit row matching the given filters — not just
        one page. Accepts exactly the same filters as `GET /api/audit` and
        enforces exactly the same permissions:
        - super_admin can export all entries, optionally narrowed by `tenant_id`.
        - org_admin is pinned to their own tenant; a `tenant_id` parameter is ignored, never honoured.
        - user/reader get 403.

        The response is streamed in batches rather than materialised in memory,
        and is a point-in-time snapshot: the row set is pinned before the export
        writes its own `audit.export` entry, so the CSV never contains its own
        record and always matches `X-Audit-Export-Matched`.

        Every field is quoted and escaped per RFC 4180, so commas, double quotes
        and newlines inside the JSON `details` column round-trip intact.

        Exports over 100,000 matching rows are truncated at that limit; the
        `X-Audit-Export-Truncated` header reports it. Narrow the date range to
        retrieve the remainder.

        The export itself is an auditable event and writes an `audit.export`
        row recording the user, IP, filters applied and matched row count.

        **Requires super_admin or org_admin role.**
      parameters:
        - name: tenant_id
          in: query
          schema:
            type: string
          description: Filter by tenant (super_admin only; ignored for org_admin)
        - name: action
          in: query
          schema:
            type: string
          description: Filter by action type. Comma-separated for multiple (e.g. `login,logout`).
        - name: userId
          in: query
          schema:
            type: string
          description: Filter by user ID
        - name: resourceType
          in: query
          schema:
            type: string
          description: Filter by resource type (user, document, tenant, etc.)
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
          description: Start date (inclusive)
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
          description: End date (inclusive, through end of day)
      responses:
        '200':
          description: |
            CSV stream. Columns: id, timestamp, user_id, user_name, user_email,
            tenant_id, action, resource_type, resource_id, ip_address, details.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: 'attachment; filename="audit-log-YYYY-MM-DD.csv"'
            X-Audit-Export-Matched:
              schema:
                type: integer
              description: Rows matching the filters at the moment of the request
            X-Audit-Export-Limit:
              schema:
                type: integer
              description: Maximum rows a single export will emit (100000)
            X-Audit-Export-Truncated:
              schema:
                type: string
                enum: ['true', 'false']
              description: Whether the export stopped at the limit
          content:
            text/csv:
              schema:
                type: string
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/documents/ingest:
    post:
      tags: [Documents]
      summary: Ingest a document (upsert by external_ref)
      description: |
        Creates a new document or adds a new version to an existing document,
        identified by `external_ref` within a tenant. Designed for agentic AI
        and email processing pipelines.

        - If a document with the given `external_ref` exists in the tenant, a new version is added.
        - If no document exists, a new document is created with version 1.

        Requires `user`, `org_admin`, or `super_admin` role.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The document file
                external_ref:
                  type: string
                  description: Stable external reference ID (e.g. "REF-2024-001")
                  example: "REF-2024-001"
                tenant_id:
                  type: string
                  description: Tenant this document belongs to
                title:
                  type: string
                  description: Document title (used on creation; if omitted, derived from filename)
                description:
                  type: string
                  description: Document description
                category:
                  type: string
                  description: Document category
                tags:
                  type: string
                  description: JSON string array of tags
                  example: '["safety","compliance"]'
                changeNotes:
                  type: string
                  description: Version change notes
                  example: "Updated via email from vendor@acme.com"
                source_metadata:
                  type: string
                  description: JSON string with ingestion metadata
                  example: '{"source":"email","from":"vendor@acme.com","subject":"Updated safety report","received_at":"2026-03-24T12:00:00Z"}'
              required: [file, external_ref, tenant_id]
      responses:
        '200':
          description: New version added to existing document
          content:
            application/json:
              schema:
                type: object
                properties:
                  action:
                    type: string
                    enum: [version_added]
                  document:
                    $ref: '#/components/schemas/Document'
                  version:
                    $ref: '#/components/schemas/DocumentVersion'
        '201':
          description: New document created
          content:
            application/json:
              schema:
                type: object
                properties:
                  action:
                    type: string
                    enum: [created]
                  document:
                    $ref: '#/components/schemas/Document'
                  version:
                    $ref: '#/components/schemas/DocumentVersion'
        '400':
          description: Missing required fields, invalid file type, or file too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No access to tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/documents/lookup:
    get:
      tags: [Documents]
      summary: Look up a document by external reference
      description: |
        Returns the document (with current version info) identified by `external_ref`
        within a tenant. Returns 404 if not found. Useful for checking if a document
        exists before deciding whether to create or update.
      parameters:
        - name: external_ref
          in: query
          required: true
          schema:
            type: string
          description: External reference ID to look up
          example: "REF-2024-001"
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
          description: Tenant ID to search within
      responses:
        '200':
          description: Document found
          content:
            application/json:
              schema:
                type: object
                properties:
                  document:
                    $ref: '#/components/schemas/Document'
                  currentVersion:
                    $ref: '#/components/schemas/DocumentVersion'
        '400':
          description: Missing required query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No access to tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/api-keys:
    get:
      tags: [API Keys]
      summary: List API keys
      description: |
        Returns all API keys visible to the caller.
        - super_admin sees all keys across all tenants.
        - org_admin sees only keys scoped to their tenant.
        **Requires super_admin or org_admin role.**
      responses:
        '200':
          description: List of API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKey'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [API Keys]
      summary: Create a new API key
      description: |
        Creates a new API key for programmatic access. The full key is returned only once
        in the response — it cannot be retrieved later. Keys authenticate as the user who
        created them and inherit that user's role and permissions.
        - org_admin keys are automatically scoped to their tenant.
        - super_admin can optionally scope a key to a specific tenant.
        **Requires super_admin or org_admin role.**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Human-readable name for the key
                  example: "CI Pipeline Key"
                tenantId:
                  type: string
                  description: Tenant to scope this key to (super_admin only; org_admin auto-scoped)
                permissions:
                  type: array
                  items:
                    type: string
                  description: 'Permission scopes (default: ["*"])'
                  example: ["*"]
                expiresAt:
                  type: string
                  description: |
                    Optional. The last moment the key works. Either a date
                    (`YYYY-MM-DD`), meaning the key works THROUGH the end of
                    that day in UTC, or an ISO 8601 timestamp WITH a time zone
                    (e.g. `2026-09-15T23:59:59-07:00`). A timestamp without a
                    zone is rejected, as is a value already in the past. Stored
                    normalised to a UTC timestamp. Omit for a key that never
                    expires.
                  example: "2026-12-31"
              required: [name]
      responses:
        '201':
          description: API key created (full key shown only once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKey:
                    $ref: '#/components/schemas/ApiKey'
                  key:
                    type: string
                    description: The full API key (shown only once, starts with dox_sk_)
                    example: "dox_sk_abc123def456..."
        '400':
          description: Missing name, or an `expiresAt` that is malformed or already in the past
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/api-keys/{id}:
    delete:
      tags: [API Keys]
      summary: Revoke an API key
      description: |
        Revokes an API key so it can no longer be used for authentication.
        - super_admin can revoke any key.
        - org_admin can only revoke keys scoped to their tenant.
        **Requires super_admin or org_admin role.**
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: API key ID to revoke
      responses:
        '200':
          description: Key revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Key is already revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions or key belongs to another tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: API key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/request-uploads:
    get:
      tags: [Supplier Arrivals]
      summary: List supplier arrivals
      description: |
        Any tenant user. `pending=1` is the inbox (oldest first): arrivals with at
        least one claimed requirement still waiting on a person, on a live ask.
        `request_id` accepts any version of an ask and shows its whole history.
        A super_admin must pass `tenant_id`.
      parameters:
        - { name: pending, in: query, schema: { type: string, enum: ['1'] } }
        - { name: request_id, in: query, schema: { type: string } }
        - { name: supplier_id, in: query, schema: { type: string } }
        - { name: queue_id, in: query, schema: { type: string }, description: The arrival a Review Queue item came from }
        - { name: tenant_id, in: query, schema: { type: string }, description: super_admin only (required for one) }
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: Arrivals
          content:
            application/json:
              schema:
                type: object
                properties:
                  arrivals:
                    type: array
                    items: { $ref: '#/components/schemas/RequestArrival' }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
                  pending_total: { type: integer, description: Tenant-wide inbox size, ignoring filters. }
        '404':
          description: request_id is not a request in this tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/request-uploads/{id}:
    get:
      tags: [Supplier Arrivals]
      summary: Get one supplier arrival
      description: Any tenant user. Another tenant's id is a 404.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The arrival
          content:
            application/json:
              schema:
                type: object
                properties:
                  arrival: { $ref: '#/components/schemas/RequestArrival' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/request-uploads/{id}/file:
    get:
      tags: [Supplier Arrivals]
      summary: Download the file a supplier sent
      description: |
        Any tenant user. Serves the upload's own object while it exists; once
        approval has moved the bytes, serves the linked document's current
        version instead. `X-File-Source` says which (`upload` | `document`).

        Sharing rule (migration 0137): once the arrival has become a document,
        an API key reads the bytes only when that document is `free` (403
        `sharing_rule_refused` otherwise), whichever object serves them. An
        arrival that is still only an arrival, and a logged-in person, are not
        asked.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: File bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: The arrival is recorded but no bytes are held for it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/request-uploads/{id}/decide:
    post:
      tags: [Supplier Arrivals]
      summary: Decide which requirements a supplier's file satisfies
      description: |
        super_admin, org_admin or user (not reader). Writes, in one batch, the
        claim decision, the current line's status and notes, and
        `request_lines.accepted_document_id`. Accepting a typed line confirms its
        `document_requirements` link (inserted with source `request_accept`, or a
        `suggested` link promoted). Deciding a requirement the supplier did not
        tick records a staff claim. No email is sent to the supplier.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecideArrivalRequest' }
      responses:
        '200':
          description: The refreshed arrival and the current version's line counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  arrival: { $ref: '#/components/schemas/RequestArrival' }
                  counts: { type: object }
        '400':
          description: Malformed decisions, a line not on the current version, or an ineligible document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Reader
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            Accepting before the file is approved in the Review Queue; the ask is
            not issued; or a person already rejected the document for that
            requirement. Nothing is written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/request-uploads/{id}/enqueue:
    post:
      tags: [Supplier Arrivals]
      summary: Put an unread supplier file on the extraction queue
      description: super_admin or org_admin. Only for an arrival whose queue insert failed at upload time.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Enqueued
          content:
            application/json:
              schema:
                type: object
                properties:
                  arrival: { $ref: '#/components/schemas/RequestArrival' }
                  intake_duplicate:
                    type: object
                    nullable: true
                    description: |
                      Set when the file is identical to one already approved or
                      already waiting (0108); the arrival was linked to that
                      instead of queued.
        '409':
          description: Already on the queue, or already linked to a document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: The bytes are gone
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/intake-duplicates:
    get:
      tags: [Intake Duplicates]
      summary: List files received again
      description: |
        Any tenant user. Newest first. A super_admin may pass `tenant_id`
        (omitted = every tenant).
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [open, reviewed, all], default: all }, description: open = not sent for review }
        - { name: document_id, in: query, schema: { type: string }, description: "Everything received again that is this document, including arrivals matched to the queue item it was approved from" }
        - { name: matched_queue_id, in: query, schema: { type: string } }
        - { name: tenant_id, in: query, schema: { type: string }, description: super_admin only }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: Suppressed arrivals
          content:
            application/json:
              schema:
                type: object
                properties:
                  duplicates:
                    type: array
                    items: { $ref: '#/components/schemas/IntakeDuplicate' }
                  total: { type: integer }
                  open_count: { type: integer, description: Rows not sent for review, same filters without state }
                  limit: { type: integer }
                  offset: { type: integer }
        '404':
          description: document_id not found in the tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/intake-duplicates/{id}/review:
    post:
      tags: [Intake Duplicates]
      summary: Review anyway
      description: |
        super_admin, org_admin or user. Replays the enqueue call the door made
        with the duplicate check skipped, stamps who sent it and when, and
        audits `intake_duplicate.review_anyway`. For a supplier-portal arrival
        the upload is pointed at the new queue item; its link to the existing
        document is removed only if no claim on it has been decided.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  duplicate: { $ref: '#/components/schemas/IntakeDuplicate' }
                  queue_id: { type: string }
        '403':
          description: Reader
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Not found in the tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Already sent for review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: The stored file is gone
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/suppliers/{id}/product-identifiers:
    get:
      tags: [Suppliers]
      summary: Supplier-side view of the product identifier graph
      description: |
        Any role in the tenant. Migration 0113 retired `supplier_product_map`
        and REMOVED `GET/PUT /api/product-map`; this is its replacement.
        Without query parameters: every `supplier_item` / `supplier_name`
        identifier for this supplier with the product of ours it names (our
        SKUs and pack alongside), plus `unidentified` — the product names and
        item numbers this supplier's certificates carry that do not resolve to
        one confirmed product, each with the resolver's reason.
        With `coa_product` and/or `item`: `{ resolution }`, resolved the way lot
        matching does (item number first, then name + pack, then a name that
        names exactly one product; an ambiguous name resolves to no product).
        Writes go through `POST /api/products/{id}/identifiers` and
        `PUT/DELETE /api/product-identifiers/{id}` (org_admin / super_admin, audited).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: coa_product, in: query, required: false, schema: { type: string } }
        - { name: item, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: The identifiers and unidentified certificate products, or one resolution
          content:
            application/json:
              schema:
                type: object
                properties:
                  supplier: { type: object, properties: { id: { type: string }, name: { type: string } } }
                  identifiers: { type: array, items: { type: object } }
                  unidentified: { type: array, items: { type: object } }
                  resolution:
                    type: object
                    properties:
                      product_id: { type: [string, 'null'] }
                      product_label: { type: [string, 'null'] }
                      route: { type: [string, 'null'], enum: [supplier_item, customer_item, name_pack, name, null] }
                      confirmed: { type: boolean }
                      our_skus: { type: array, items: { type: string } }
                      candidates: { type: array, items: { type: object } }
                      note: { type: [string, 'null'] }
        '404':
          description: Supplier not found in the tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/spec-unmatched:
    get:
      tags: [Spec Register]
      summary: Printed test names no configured analyte recognises
      description: |
        org_admin+. Replays the spec engine over this tenant's approved
        documents and reports every printed test name that matched no analyte —
        the alias gap, which is otherwise invisible: a limit whose analyte never
        matches a supplier's spelling never runs, and the register cannot report
        a check that never happened.

        Spellings are grouped by the key the matcher compares on, so `Flavor`
        and `FLAVOR` are one entry. A name that matches an analyte but has no
        limit in scope is NOT listed — that is a missing limit, not a missing
        alias.

        The scan is BOUNDED (the most recent `scan` documents, default and
        maximum 2000) and `scan_truncated` says when the tenant holds more, in
        which case the counts are a floor. Same derivation as
        `bin/recheck-spec-limits` (shared/unmatchedAnalytes.ts).
      parameters:
        - { name: tenant_id, in: query, schema: { type: string }, description: super_admin only, and then required }
        - { name: limit, in: query, schema: { type: integer, default: 25, maximum: 100 }, description: groups per page }
        - $ref: '#/components/parameters/OffsetParam'
        - { name: scan, in: query, schema: { type: integer, maximum: 2000 }, description: cap on documents replayed }
        - { name: include_ignored, in: query, schema: { type: string, enum: ['1'] }, description: also return the dismissed spellings }
      responses:
        '200':
          description: The gap, with what each spelling costs
          content:
            application/json:
              schema:
                type: object
                properties:
                  unmatched:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string, description: normalized match key }
                        name: { type: string, description: the commonest spelling }
                        results: { type: integer }
                        documents: { type: integer }
                        spellings:
                          type: array
                          items:
                            type: object
                            properties:
                              name: { type: string }
                              results: { type: integer }
                              documents: { type: integer }
                        suppliers:
                          type: array
                          items:
                            type: object
                            properties:
                              id: { type: string, nullable: true }
                              name: { type: string, nullable: true }
                              results: { type: integer }
                        example:
                          type: object
                          nullable: true
                          properties:
                            document_id: { type: string }
                            document_title: { type: string, nullable: true }
                            supplier_id: { type: string, nullable: true }
                            supplier_name: { type: string, nullable: true }
                            test_name_raw: { type: string }
                            value_raw: { type: string }
                            unit_raw: { type: string, nullable: true }
                  total_groups: { type: integer }
                  total_results: { type: integer }
                  documents_scanned: { type: integer }
                  documents_with_results: { type: integer }
                  scan_truncated: { type: boolean }
                  scan_cap: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
                  ignored_count: { type: integer }
                  ignored:
                    type: array
                    description: Only with `include_ignored=1`.
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name_key: { type: string }
                        name_raw: { type: string }
                        reason: { type: string, nullable: true }
                        created_at: { type: string }
                        created_by: { type: string, nullable: true }
                        created_by_name: { type: string, nullable: true }
        '400':
          description: super_admin without `tenant_id`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Not org_admin or super_admin

  /api/spec-unmatched/ignore:
    post:
      tags: [Spec Register]
      summary: Record that a printed name is not a test
      description: |
        org_admin+. Keeps a spelling off the configuration worklist (migration
        0114). It changes NO verdict — the engine never reads this table, and the
        result is still reported as unjudged on the document. Keyed on the match
        key, so dismissing `Flavor` also dismisses `FLAVOR`. Idempotent, and
        audited as `spec_unmatched.ignored`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: the spelling as printed }
                reason: { type: string, nullable: true }
                tenant_id: { type: string, description: super_admin only }
      responses:
        '201':
          description: Dismissed (or already dismissed)
        '400':
          description: No name, or super_admin without `tenant_id`
        '403':
          description: Not org_admin or super_admin
    delete:
      tags: [Spec Register]
      summary: Put a dismissed spelling back on the worklist
      description: org_admin+. Audited as `spec_unmatched.restored`.
      parameters:
        - { name: name, in: query, required: true, schema: { type: string } }
        - { name: tenant_id, in: query, schema: { type: string }, description: super_admin only }
      responses:
        '200':
          description: Restored
        '404':
          description: That spelling is not dismissed

  /api/spec-tests/{id}/aliases:
    post:
      tags: [Spec Register]
      summary: Add a spelling to an analyte
      description: |
        org_admin+. MERGES into `spec_tests.aliases`; `PUT /api/spec-tests/{id}`
        replaces the whole array, which would silently delete a spelling another
        admin added between a read and a write — and the failure is invisible,
        because the limit stays configured and simply stops matching one
        supplier's certificates. An alias already present is reported, not an
        error. Audited as `spec_test.alias_added`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                names: { type: array, items: { type: string } }
      responses:
        '201':
          description: At least one spelling added
          content:
            application/json:
              schema:
                type: object
                properties:
                  specTest: { type: object, description: the analyte, aliases already parsed }
                  added: { type: array, items: { type: string } }
                  already_present: { type: array, items: { type: string } }
                  same_as_name: { type: array, items: { type: string } }
        '200':
          description: Nothing to add — every spelling was already recognised
        '409':
          description: Another analyte already answers to that spelling
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/spec-checks:
    get:
      tags: [Spec Register]
      summary: List register rows
      description: |
        Any tenant user. Defaults to out-of-spec results, newest first. A
        super_admin may pass `tenant_id`. Every row carries `judgement_origin`
        and `bulk_run_at` whatever the `origin` filter.
      parameters:
        - { name: verdict, in: query, schema: { type: string, enum: [out_of_spec, not_checked, in_spec, all], default: out_of_spec } }
        - { name: acknowledged, in: query, schema: { type: string, enum: ['0', '1'] } }
        - name: origin
          in: query
          description: Who judged the result. Any other value is a 400.
          schema: { type: string, enum: [all, approval, bulk_recheck], default: all }
        - { name: document_id, in: query, schema: { type: string } }
        - { name: supplier_id, in: query, schema: { type: string } }
        - { name: spec_test_id, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string }, description: ISO date; rows created on or after }
        - { name: tenant_id, in: query, schema: { type: string }, description: super_admin only }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: Register rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  specChecks:
                    type: array
                    items: { $ref: '#/components/schemas/SpecCheck' }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        '400':
          description: Unknown `origin`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [Spec Register]
      summary: Acknowledge results
      description: |
        Any tenant user. Records that a person has seen these results and accepted
        them. Never changes a verdict or its origin, and works the same on
        approval and bulk re-check rows. Ids from another tenant are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, items: { type: string } }
                note: { type: string }
      responses:
        '200':
          description: Acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  acknowledged: { type: integer }
        '400':
          description: ids is required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/expirations:
    get:
      tags: [Renewals]
      summary: Renewal dashboard feed
      description: |
        Any tenant user (Compliance module). Every active document with a
        resolvable due date. `status` is judged against `window_days`, the
        dashboard look-ahead, which is a VIEW filter only. `alert_status` is
        judged against the document's own `alert_lead_days` (type override,
        else the organization setting, else 60) and is what renewal alerts
        mail on.
      parameters:
        - { name: window_days, in: query, schema: { type: integer }, description: Look-ahead for `status`. Defaults to the organization's lead time. }
        - { name: as_of, in: query, schema: { type: string, format: date } }
        - { name: tenant_id, in: query, schema: { type: string }, description: super_admin only }
      responses:
        '200':
          description: Classified rows and summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items: { $ref: '#/components/schemas/ExpirationRow' }
                  summary: { type: object }
                  window_days: { type: integer }
                  as_of: { type: string, format: date }
                  tenant_lead: { $ref: '#/components/schemas/ResolvedRenewalAlertLead' }

  /api/expirations/notify:
    post:
      tags: [Renewals]
      summary: Send the renewal digest now
      description: |
        super_admin or org_admin. Same engine as the daily scheduled run, with
        the re-alert cooldown skipped (the ledger is still written). Each
        document is alerting when `days_until <= alert_lead_days`. There is no
        window parameter: a `window_days` in the body or query is ignored and
        reported as `window_days_ignored: true`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant_id: { type: string, description: super_admin only }
                as_of: { type: string, format: date }
      responses:
        '200':
          description: What was sent, to whom, and what reached nobody
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: boolean }
                  recipients: { type: array, items: { type: string } }
                  document_count: { type: integer }
                  alerting_count: { type: integer }
                  suppressed_count: { type: integer }
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        owner_label: { type: string, nullable: true }
                        via: { type: string }
                        recipients: { type: array, items: { type: string } }
                        document_count: { type: integer }
                        document_ids: { type: array, items: { type: string } }
                        documents:
                          type: array
                          items: { $ref: '#/components/schemas/RenewalAlertedDocument' }
                        sent: { type: boolean }
                  unrouted: { type: object }
                  tenant_lead: { $ref: '#/components/schemas/ResolvedRenewalAlertLead' }
                  window_days_ignored: { type: boolean }
                  reason: { type: string, enum: [no_documents, all_suppressed, email_not_configured, all_unrouted, no_recipients] }
                  supplier_requests:
                    type: object
                    description: |
                      Supplier renewal requests DRAFTED by this run (0133):
                      `drafted`, `superseded_count`, `ended`, `escalated`,
                      `not_drafted`, `approver_notices`. Nothing in it was
                      sent to a supplier.

  /api/expirations/default-owner:
    get:
      tags: [Renewals]
      summary: Read the organization's master user
      description: |
        Migration 0133. super_admin (with `tenant_id`) or org_admin. The master
        user approves a supplier renewal request when the record's owner route
        names no portal user. `resolves` is false when the stored user is no
        longer an active user of the organization.
      parameters:
        - { name: tenant_id, in: query, schema: { type: string }, description: super_admin only }
      responses:
        '200':
          description: The setting and the users who can be chosen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenewalDefaultOwner' }
    put:
      tags: [Renewals]
      summary: Set or clear the master user
      description: |
        super_admin or org_admin. `user_id` is required; `null` clears it. The
        user must be an active user of the organization. Audited
        `renewal_default_owner_updated` with the previous value; saving the
        stored value writes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string, nullable: true }
                tenant_id: { type: string, description: super_admin only }
      responses:
        '200':
          description: The setting as stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenewalDefaultOwner' }
        '400':
          description: Missing `user_id`, or not an active user of the organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/renewal-requests:
    get:
      tags: [Renewals]
      summary: Supplier renewal requests - waiting, sent, escalated, and not drafted
      description: |
        Migration 0133. Any role in the tenant; Compliance module. The renewal
        run only DRAFTS these. Nothing is sent to a supplier except by
        `POST /api/renewal-requests/{id}/sends/{sendId}/approve`.

        `not_drafted` is computed at read: alerting documents that name no
        supplier, whose supplier has no document contact, or that were already
        past the last follow-up window when first seen.
      parameters:
        - { name: tenant_id, in: query, schema: { type: string }, description: super_admin only }
      responses:
        '200':
          description: The cycles and what could not be drafted
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items: { $ref: '#/components/schemas/RenewalRequest' }
                  not_drafted:
                    type: object
                    properties:
                      no_supplier: { type: array, items: { type: object } }
                      no_contact: { type: array, items: { type: object } }
                      past_escalation: { type: array, items: { type: object } }
                  link_block_preview: { type: string }
                  email_configured: { type: boolean }
                  escalate_after_days: { type: integer }

  /api/renewal-requests/{id}/sends/{sendId}/approve:
    post:
      tags: [Renewals]
      summary: Approve a drafted renewal request and send it to the supplier
      description: |
        The ONLY endpoint that emails a supplier. The assigned approver, an
        org_admin or a super_admin. On the first approval of a cycle one
        document request is composed and issued for the expiring document, as
        the approving person. The email is sent from "<Organization> via
        SupDox" with reply-to the approver, no attachment, and the system's
        link block appended below `body` (it cannot be supplied or removed).
        The exact subject and body sent are stored and audited
        (`renewal_request.sent`).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: sendId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, body]
              properties:
                subject: { type: string, maxLength: 200 }
                body: { type: string, maxLength: 5000 }
      responses:
        '200':
          description: Sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: boolean }
                  request: { $ref: '#/components/schemas/RenewalRequest' }
        '403':
          description: Neither the assigned approver nor an administrator
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: The draft is no longer waiting, or the supplier has no document contact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: The mail provider refused it; the stage is `failed` and can be approved again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Email is not configured; nothing was sent and the draft keeps waiting
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/renewal-requests/{id}/sends/{sendId}/skip:
    post:
      tags: [Renewals]
      summary: Skip one stage of a renewal request
      description: |
        The assigned approver, an org_admin or a super_admin. Nothing is sent.
        The cycle stays open and the next stage is still drafted when due.
        Audited `renewal_request.skipped`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: sendId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Skipped
          content:
            application/json:
              schema:
                type: object
                properties:
                  skipped: { type: boolean }
                  request: { $ref: '#/components/schemas/RenewalRequest' }
        '409':
          description: The draft is no longer waiting
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/expirations/lead-time:
    get:
      tags: [Renewals]
      summary: Read the organization's renewal alert lead time
      description: super_admin (with `tenant_id`) or org_admin (own tenant). Compliance module.
      parameters:
        - { name: tenant_id, in: query, schema: { type: string }, description: required for super_admin }
      responses:
        '200':
          description: The setting, its effective value, and the document types that override it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenewalAlertLeadTime' }
        '403':
          description: Not an admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      tags: [Renewals]
      summary: Set how many days before a due date owners are warned
      description: |
        super_admin (with `tenant_id`) or org_admin (always its own tenant).
        `lead_days` is required: a whole number from 7 to 365, or null for the
        60-day default. A change stamps `renewal_alert_lead_updated_at/_by` and
        writes a `renewal_alert_lead_time_updated` audit row with the previous
        value; saving the same value writes nothing. Changing it never re-sends
        a record already alerted within the 7-day cooldown.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lead_days]
              properties:
                lead_days: { type: integer, minimum: 7, maximum: 365, nullable: true }
                tenant_id: { type: string, description: super_admin only }
      responses:
        '200':
          description: The saved setting
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenewalAlertLeadTime' }
        '400':
          description: Missing, fractional, non-numeric or out-of-range `lead_days`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Not an admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/expirations/lead-time/preview:
    get:
      tags: [Renewals]
      summary: Preview what a lead time change would do at the next run
      description: |
        super_admin or org_admin. Read-only: classifies the tenant's documents
        under the stored and the proposed configuration and applies the
        scheduled run's re-alert rules. Writes nothing and sends nothing. With
        `document_type_id` it previews that type's override; without, the
        organization setting.
      parameters:
        - { name: lead_days, in: query, required: true, schema: { type: string }, description: '7-365, or `inherit` / empty for null' }
        - { name: document_type_id, in: query, schema: { type: string } }
        - { name: as_of, in: query, schema: { type: string, format: date } }
        - { name: tenant_id, in: query, schema: { type: string }, description: required for super_admin }
      responses:
        '200':
          description: Counts, and up to 25 documents entering and leaving the warning window
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenewalLeadTimePreview' }
        '400':
          description: Bad `lead_days` or `as_of`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Document type not in this tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/supplier-gaps:
    get:
      tags: [Supplier Requirements]
      summary: What each supplier still owes (applicable minus confirmed closures)
      description: |
        The gap engine (`shared/requirementGap.ts`). One shape for one supplier
        or the whole tenant. `status` has FOUR values and never collapses the
        warnings into a pass: `not_configured` (nothing applies), `open`,
        `products_not_configured` (migration 0123: everything counted is closed,
        but per-product requirements are in use for this supplier and an active
        product has nothing applying to it -- amber, never green) and
        `satisfied`.

        Requirement scope (0123): a requirement with `scope: product` is owed
        by every ACTIVE product of the supplier (linked through
        `product_suppliers` or the legacy `products.supplier_id`, active, not
        marked no longer supplied), minus `product_requirements` exemptions,
        plus its `add` rows. A (requirement, product) pair is closed only by a
        confirmed document linked to that product (`document_products`); a
        confirmed document linked to NO product closes nothing and is listed in
        `unattributed`. Zero active products is open with
        `gap_reason: no_products`. Such an item carries `scope`,
        `subjects_total`, `subjects_satisfied`, `open_subjects`,
        `exempt_subjects` and `unattributed`; a supplier-scope item carries
        none of them. `scope: lot` is stored but judged once per supplier
        (`lot_evaluation: supplier_level`) with a `lot_scope_not_evaluated`
        caveat until per-lot checking ships.

        `products` lists each active product's own state: `not_checked` while
        no per-product requirement applies to the supplier (the gate -- a
        supplier on supplier scope only is otherwise unchanged),
        `not_configured`, `open`, `satisfied`.
      parameters:
        - { name: supplier_id, in: query, schema: { type: string } }
        - { name: tenant_id, in: query, schema: { type: string }, description: super_admin only }
        - { name: include_recommended, in: query, schema: { type: boolean, default: false } }
        - { name: status, in: query, schema: { type: string, enum: [open, satisfied, not_configured, products_not_configured] } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Gaps, a rollup (incl. `products_not_configured`), and which tiers were counted
          content:
            application/json:
              schema: { type: object }

  /api/requirements/{id}/scope-preview:
    get:
      tags: [Supplier Requirements]
      summary: What changing one requirement's scope would do (read-only)
      description: |
        Migration 0123. super_admin / org_admin. Loads the gap inputs of every
        supplier the requirement reaches once and judges them twice -- as they
        are, and as if the requirement had `scope` -- so the preview and the
        report cannot compute "after" two ways. Save the change with
        `PUT /api/requirements/{id}` `{ scope }`, which writes a
        `requirement.scope_changed` audit row with the previous value.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: scope, in: query, required: true, schema: { type: string, enum: [supplier, product, lot] } }
      responses:
        '200':
          description: Status transitions per supplier, product obligations created, documents that would stop counting
          content:
            application/json:
              schema: { type: object }
        '400':
          description: Unknown scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/product-requirements:
    get:
      tags: [Supplier Requirements]
      summary: Per-product exceptions (add / exempt)
      description: Migration 0123. Any role in the tenant. Filters by supplier_id, product_id, requirement_id, mode.
      parameters:
        - { name: supplier_id, in: query, schema: { type: string } }
        - { name: product_id, in: query, schema: { type: string } }
        - { name: requirement_id, in: query, schema: { type: string } }
        - { name: mode, in: query, schema: { type: string, enum: [add, exempt] } }
      responses:
        '200':
          description: Rows with requirement, product and supplier names joined
          content:
            application/json:
              schema: { type: object }
    post:
      tags: [Supplier Requirements]
      summary: Add a per-product requirement to one product, or exempt one product
      description: |
        super_admin / org_admin. The requirement must be `scope: product` and
        the product one the supplier ships (either link path). An exemption
        needs a `reason`. 409 when the (supplier, product, requirement) row
        exists. Audited `product_requirement.added` / `.exempted`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supplier_id, product_id, requirement_id, mode]
              properties:
                supplier_id: { type: string }
                product_id: { type: string }
                requirement_id: { type: string }
                mode: { type: string, enum: [add, exempt] }
                tier: { type: string, enum: [required, recommended], default: required }
                reason: { type: string, nullable: true }
      responses:
        '201': { description: Created }
        '400': { description: Invalid target or missing reason }
        '409': { description: A row already exists for this product and requirement }

  /api/product-requirements/{id}:
    put:
      tags: [Supplier Requirements]
      summary: Change mode, tier or reason
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Updated (audited product_requirement.updated with both sides) }
        '404': { description: Not found in this tenant }
    delete:
      tags: [Supplier Requirements]
      summary: Remove the exception (hard delete; the whole row is audited)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Removed }
        '404': { description: Not found in this tenant }

  /api/suppliers/{id}/products/{productId}:
    put:
      tags: [Suppliers]
      summary: No longer supplied / nothing owed per product; approval and facility
      description: |
        Migration 0135 adds `approval_status` (+ `approval_note`) and
        `facility_id`. Approval is a separate fact from `discontinued`.
        `not_approved` needs a note (400, and nothing else in the request is
        applied). A decision made here is stamped `approval_source: person`
        and is never overridden by the supplier list. `facility_id` must be
        one of this supplier's facilities that is in use, or null. Audited
        `product_supplier.approval_decided` / `product_supplier.facility_set`.
        Neither changes a gap, a renewal, a search answer or an order send.

        Migration 0123. super_admin / org_admin. `discontinued` marks the link
        no longer supplied (the product leaves per-product checking and is
        named in a caveat); `nothing_owed_reason` declares the product owes
        nothing per product (a reason is required; null clears). A legacy-only
        link gets a `product_suppliers` row (source NULL) to hold the facts.
        Audited `supplier_product.discontinued` / `.resupplied` /
        `.nothing_owed_declared` / `.nothing_owed_cleared`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: productId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                discontinued: { type: boolean }
                nothing_owed_reason: { type: string, nullable: true }
                approval_status: { type: string, enum: [approved, pending, not_approved] }
                approval_note: { type: string, nullable: true, description: Required with not_approved }
                facility_id: { type: string, nullable: true }
      responses:
        '200': { description: The link row after the change }
        '400': { description: 'Nothing to change, a declaration without a reason, not_approved without a note, or a facility that is not this supplier''s or is retired' }
        '404': { description: Supplier or product not found, or not linked }

  /api/spec-gaps:
    get:
      tags: [Spec Register]
      summary: What was NOT judged on an approved document
      description: |
        The other half of `/api/spec-checks` (migration 0109). Any role in the
        tenant — evidence, not configuration. Read-only: rows are written at
        approval and replaced on re-approval, and there is nothing to
        acknowledge (an unjudged result is fixed by configuring a limit, a
        missing analyte by the supplier sending one).

        `kind=missing_required` — an analyte this supplier's certificates of
        this type MUST report (a supplier watch, `/api/spec-required-analytes`)
        that the certificate did not report.
        `kind=unjudged` — a printed result with no limit in scope and no printed
        specification.
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [all, missing_required, unjudged], default: all } }
        - { name: document_id, in: query, schema: { type: string } }
        - { name: supplier_id, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Gap rows and total
          content:
            application/json:
              schema:
                type: object
                properties:
                  specGaps: { type: array, items: { type: object } }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }

  /api/approved-items:
    get:
      tags: [Suppliers]
      summary: The approved item list - one row per item-and-supplier pair
      description: |
        Migration 0135. Any role in the organization. Approval
        (`approval_status`) and whether the item is currently supplied
        (`supplied`) are separate facts and both are returned. `counts`
        ignore the `approval` filter. `private_label` is a display flag.
        Nothing is blocked by this list, and no gap, renewal or search answer
        reads it. Change an approval with
        `PUT /api/suppliers/{id}/products/{productId}`.
      parameters:
        - { name: supplier_id, in: query, schema: { type: string } }
        - { name: product_id, in: query, schema: { type: string } }
        - { name: facility_id, in: query, schema: { type: string } }
        - { name: approval, in: query, schema: { type: string, enum: [approved, pending, not_approved] } }
        - { name: supplied, in: query, schema: { type: string, enum: ['1', '0'] }, description: 1 = currently supplied, 0 = no longer supplied }
        - { name: q, in: query, schema: { type: string }, description: 'Item, supplier, brand owner, producer, facility or any identifier of the item' }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: tenant_id, in: query, schema: { type: string }, description: super_admin only }
      responses:
        '200':
          description: The pairs
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ApprovedItem' }
                  total: { type: integer }
                  counts:
                    type: object
                    properties:
                      approved: { type: integer }
                      pending: { type: integer }
                      not_approved: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        '400': { description: An unknown approval or supplied value, or no tenant for a super_admin }

  /api/suppliers/{id}/facilities:
    get:
      tags: [Suppliers]
      summary: The supplier's facilities
      description: Migration 0135. Any role in the tenant. Each facility carries `item_count`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Facilities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierFacilities' }
        '404': { description: Supplier not found in the tenant }
    post:
      tags: [Suppliers]
      summary: Add a facility
      description: |
        org_admin / super_admin. A facility is added by a person; nothing
        infers one from a certificate. One per name under a supplier (case and
        spacing ignored). Audited `supplier.facility_added`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                plant_code: { type: string, nullable: true }
                notes: { type: string, nullable: true }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierFacilities' }
        '400': { description: No name }
        '409': { description: The supplier already has a facility of that name }

  /api/suppliers/{id}/facilities/{facilityId}:
    put:
      tags: [Suppliers]
      summary: Edit, retire or reactivate a facility
      description: |
        org_admin / super_admin. `active: false` retires it: items that name
        it keep it and no new item can take it. Audited
        `supplier.facility_updated`; a save that changes nothing writes no row.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: facilityId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                plant_code: { type: string, nullable: true }
                notes: { type: string, nullable: true }
                active: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierFacilities' }
        '404': { description: Facility not found for this supplier }
        '409': { description: Another facility of this supplier has that name }
    delete:
      tags: [Suppliers]
      summary: Remove a facility
      description: |
        org_admin / super_admin. The items that named it go back to "no
        facility recorded" (`cleared_items`); no item is removed. Audited
        `supplier.facility_removed` with the whole row and the item ids.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: facilityId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The remaining facilities and how many items were cleared
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/SupplierFacilities' }
                  - type: object
                    properties:
                      cleared_items: { type: integer }

  /api/customers/{id}/contacts:
    get:
      tags: [Orders]
      summary: The people at a customer and who receives COAs
      description: |
        Migration 0135. Any role in the tenant. Contacts with `coa_recipient`
        are pre-filled on an order send; the sender can still edit the list.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Contacts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerContacts' }
        '404': { description: Customer not found in the tenant }
    post:
      tags: [Orders]
      summary: Add a customer contact
      description: |
        org_admin / super_admin. `coa_recipient` defaults true; the first
        contact is the primary unless told otherwise. Audited
        `customer.contact_added`. Adding a contact sends nothing.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
                name: { type: string, nullable: true }
                role: { type: string, nullable: true }
                is_primary: { type: boolean }
                coa_recipient: { type: boolean }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerContacts' }
        '400': { description: Missing or invalid email }
        '409': { description: The customer already has a contact at that address }

  /api/customers/{id}/contacts/{contactId}:
    put:
      tags: [Orders]
      summary: Edit a customer contact
      description: org_admin / super_admin. Naming a new primary steps the previous one down. Audited `customer.contact_updated`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: contactId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                name: { type: string, nullable: true }
                role: { type: string, nullable: true }
                is_primary: { type: boolean }
                coa_recipient: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerContacts' }
        '404': { description: Contact not found for this customer }
        '409': { description: Another contact of this customer has that address }
    delete:
      tags: [Orders]
      summary: Remove a customer contact
      description: |
        org_admin / super_admin. A COA requirement that named it keeps its
        other details and has no delivery contact. Audited
        `customer.contact_removed`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: contactId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The remaining contacts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerContacts' }

  /api/customers/{id}/item-requirements:
    get:
      tags: [Orders]
      summary: What this customer needs for each item
      description: Migration 0135. Any role in the tenant. One row per customer and item.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Requirements
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerItemRequirements' }
        '404': { description: Customer not found in the tenant }
    post:
      tags: [Orders]
      summary: Add a COA requirement for an item
      description: |
        org_admin / super_admin. A requirement decides nothing: the order
        review prints it beside the item and warns when a required item has no
        certificate on the order. Audited `customer.item_requirement_added`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id]
              properties:
                product_id: { type: string }
                coa_required: { type: string, enum: ['yes', 'no', on_request], default: 'yes' }
                must_show: { type: string, nullable: true }
                timing: { type: string, nullable: true }
                delivery_contact_id: { type: string, nullable: true, description: A contact of this customer }
                notes: { type: string, nullable: true }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerItemRequirements' }
        '400': { description: 'No product, a product of another organization, an unknown coa_required, or a contact of another customer' }
        '409': { description: The customer already has a requirement for that item }

  /api/customers/{id}/item-requirements/{requirementId}:
    put:
      tags: [Orders]
      summary: Edit a COA requirement
      description: |
        org_admin / super_admin. Any field except `product_id` - another item
        is another row. Audited `customer.item_requirement_updated`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: requirementId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                coa_required: { type: string, enum: ['yes', 'no', on_request] }
                must_show: { type: string, nullable: true }
                timing: { type: string, nullable: true }
                delivery_contact_id: { type: string, nullable: true }
                notes: { type: string, nullable: true }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerItemRequirements' }
        '400': { description: An attempt to move it to another item, or an invalid value }
        '404': { description: Requirement not found for this customer }
    delete:
      tags: [Orders]
      summary: Remove a COA requirement
      description: org_admin / super_admin. Audited `customer.item_requirement_removed` with the whole row.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: requirementId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The remaining requirements
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerItemRequirements' }

  /api/suppliers/{id}/contacts:
    get:
      tags: [Suppliers]
      summary: The supplier's contacts and its document contact
      description: |
        Migration 0133. Any role in the tenant. `document_contact` is the one
        address renewal requests to this supplier are sent to, or null.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Contacts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierContacts' }
        '404':
          description: Supplier not found in the tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [Suppliers]
      summary: Add a contact
      description: |
        org_admin / super_admin. The first contact becomes the document contact
        unless `is_document_contact` says otherwise; naming a new document
        contact demotes the previous one. Audited `supplier.contact_added`.
        Adding a contact sends nothing.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierContactWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierContacts' }
        '400':
          description: Missing or invalid email
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: The supplier already has a contact with that address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/suppliers/{id}/contacts/{contactId}:
    put:
      tags: [Suppliers]
      summary: Edit a contact
      description: |
        org_admin / super_admin. Deactivating the document contact leaves the
        supplier with none; nothing is promoted in its place. Audited
        `supplier.contact_updated` with the previous and current values.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: contactId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierContactWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierContacts' }
        '404':
          description: Contact not found for this supplier
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Suppliers]
      summary: Remove a contact
      description: org_admin / super_admin. Audited `supplier.contact_removed` with the whole row.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: contactId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The remaining contacts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierContacts' }

  /api/suppliers/{id}/lot-scheme:
    get:
      tags: [Suppliers]
      summary: The supplier's declared lot format, and how its lots read against it
      description: |
        Migration 0110. Any role in the tenant. Returns every declared VERSION
        (the table is append-only), the one in force, and a read-only fit
        preview over this supplier's stored lots. With no declaration the
        legacy `suppliers.lot_scheme` enum is mapped onto an equivalent spec.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Versions, the resolved spec, and the fit preview
          content:
            application/json:
              schema: { type: object }
        '404':
          description: Supplier not found in the tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      tags: [Suppliers]
      summary: Declare a lot format (appends a version)
      description: |
        org_admin / super_admin. Body `{ spec, note? }`. The spec is validated
        before anything is written — a declaration that cannot mean one thing
        (a Julian day with no year, a date segment with no role) is refused 400.
        A new VERSION is appended; nothing is updated in place, so a stored
        decode stays explainable. Saving the format already in force writes
        nothing and returns `unchanged: true`. Audited
        (`supplier.lot_scheme_declared`) with the previous spec and the fit
        counts the new one produces.

        **A declaration is a validator and a labelled fallback, never an
        authority**: saving one rewrites no stored lot key and no stored date.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spec]
              properties:
                spec: { type: object }
                note: { type: string }
      responses:
        '200':
          description: The declaration in force after the call
          content:
            application/json:
              schema: { type: object }
        '400':
          description: The spec is not a valid declaration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/products/{id}/identifiers:
    get:
      tags: [Products]
      summary: What this product goes by
      description: |
        Migration 0107. Any role in the tenant. One row per identifier — our
        SKU, a supplier's item number, a supplier's product name, an alias, a
        GTIN, a pack — each with `source`, `confirmed`, `superseded` and the
        evidence in `note`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The product's identifiers
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifiers: { type: array, items: { type: object } }
    post:
      tags: [Products]
      summary: Add an identifier
      description: |
        org_admin / super_admin, audited. A person adding an identifier here
        stands behind it, so it is written `confirmed: true`, `source:
        'reviewer'` unless the body says `confirmed: false` — search then
        labels every result reached through it "via unconfirmed identifier".
        `kind` and `supplier_id` are paired: the supplier kinds require one,
        the rest refuse one. Uniqueness is per product, so two products may
        legitimately claim one number — that ambiguity is something search
        shows rather than hides.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, value]
              properties:
                kind: { type: string, enum: [our_sku, supplier_item, supplier_name, alias, gtin, pack] }
                value: { type: string }
                supplier_id: { type: [string, 'null'] }
                confirmed: { type: boolean, default: true }
                superseded: { type: boolean, default: false }
                note: { type: string }
      responses:
        '200':
          description: 'The identifier already existed (`created: false`)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier: { type: object }
                  created: { type: boolean }
        '201':
          description: 'The identifier as stored (`created: true`)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier: { type: object }
                  created: { type: boolean }
        '400':
          description: Invalid kind/value/supplier pairing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/product-identifiers/{id}:
    put:
      tags: [Products]
      summary: Confirm an identifier, mark it a former number, or edit its note
      description: |
        org_admin / super_admin, own tenant, audited. The value, kind and
        supplier of an identifier are its IDENTITY and are not editable: a
        wrong number is removed and the right one added, so the audit log shows
        both.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmed: { type: boolean }
                superseded: { type: boolean }
                note: { type: [string, 'null'] }
      responses:
        '200':
          description: The identifier after the change
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier: { type: object }
    delete:
      tags: [Products]
      summary: Remove an identifier
      description: |
        org_admin / super_admin, own tenant. The `product_identifier.removed`
        audit row carries the WHOLE row, since nothing else keeps it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  /api/supplier-list/import:
    post:
      tags: [Supplier Requirements]
      summary: Derive supplier requirements from the verified supplier list
      description: |
        Migration 0112. super_admin / org_admin. The ONE door to the derivation
        rules (`shared/requirementDerivation.ts`), so a spreadsheet and a future
        webhook get the same answer for the same supplier.

        Exactly one list source: `csv`, `xlsx_base64` (first sheet), `rows`, or
        `rerun_of` (the id of an earlier APPLIED run, whose stored input is
        re-run). `dry_run` DEFAULTS TO TRUE and writes nothing at all — not even
        a run row; a caller has to say it means to write.

        Applying creates missing suppliers, writes derived rows with their
        provenance, ADOPTS rows nobody had attributed (never lowering a tier),
        FLAGS derived rows the list no longer implies rather than deleting them,
        and never touches a row a human or a packet wrote.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                csv: { type: string }
                xlsx_base64: { type: string }
                rows: { type: array, items: { type: object } }
                rerun_of: { type: string }
                dry_run: { type: boolean, default: true }
                file_name: { type: string }
                pack: { type: string }
                tenant_id: { type: string, description: super_admin only }
      responses:
        '200':
          description: The plan a dry run would apply. Nothing was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierListImportResponse' }
        '201':
          description: Applied. `run_id` is the stored run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierListImportResponse' }
        '400':
          description: No list source, more than one, or the rows are unreadable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/supplier-list/imports:
    get:
      tags: [Supplier Requirements]
      summary: Applied supplier-list import runs
      description: |
        super_admin / org_admin. Newest first, summary only — a run's per-row
        outcomes are on `GET /api/supplier-list/imports/{id}`. A dry run is not
        a run and never appears here.
      parameters:
        - { name: tenant_id, in: query, schema: { type: string }, description: super_admin only }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: Run summaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  imports: { type: array, items: { type: object } }

  /api/supplier-list/imports/{id}:
    get:
      tags: [Supplier Requirements]
      summary: One import run, with its per-row outcomes
      description: super_admin / org_admin, own tenant.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The run, its counts, its row outcomes and its stored input
          content:
            application/json:
              schema:
                type: object
                properties:
                  import: { type: object }
        '404':
          description: Run not found in the tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/bundles/{id}/download:
    get:
      tags: [Documents]
      summary: Download a bundle as a ZIP
      description: |
        Every document of the bundle at its pinned version (or the current one),
        under the uploaded file names. **Any authenticated user** with tenant
        access. Module-gated under `library`.

        **Sharing rule (migration 0137).** The same rule as the search ZIP: a
        `locked` document never goes in; a `qa` document only for a QA releaser
        (audited `document.qa_release_approved`); an API key gets `free` only.
        A package missing a document must not look complete, so what was kept
        back is named in `NOT-INCLUDED.txt` inside the archive, in the
        `X-Bundle-Refused` / `X-Bundle-Refused-Ids` headers and in the audit
        row. When nothing may go: 403 `sharing_rule_refused`.

        Audited as `bundle.downloaded`, naming every document that went (this
        route wrote no audit row before 0137), or `bundle.download_refused`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: ZIP archive
          content:
            application/zip:
              schema: { type: string, format: binary }
          headers:
            X-Bundle-Documents:
              schema: { type: integer }
            X-Bundle-Refused:
              schema: { type: integer }
            X-Bundle-Refused-Ids:
              schema: { type: string, example: "9f2c:locked,41ab:needs_qa" }
            X-Bundle-Unavailable:
              schema: { type: integer }
              description: Documents left out because storage does not hold the file.
            X-Bundle-Unavailable-Ids:
              schema: { type: string }
              description: Present when any were. Comma separated document ids.
        '400': { description: The bundle has no items (a deleted document is not one), or no file could be retrieved }
        '403':
          description: The sharing rule kept every document back
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharingRuleRefused' }
        '404': { description: No such bundle }

  /api/document-exports/zip:
    post:
      tags: [Documents]
      summary: Export selected documents as a ZIP
      description: |
        Zips the CURRENT version of each selected document plus a `manifest.csv`
        naming, per file, the document, supplier, document type, lot and
        production date.

        Tenant-scoped in SQL: an id belonging to another tenant is reported as
        missing, never exported. **Any authenticated user with tenant access,
        reader included** — the same bar as downloading one document at a time.

        Writes ONE audit row (`document_export.zip`) naming every document.

        Refused with 413 over 50 documents or 40 MB of source files; the message
        states the cap. Module-gated under `library`.

        **Sharing rule (migration 0137).** A ZIP is a file leaving. A `locked`
        document never goes in; a `qa` document goes in only when the caller is
        a QA releaser (an admin, a non-reader on the `QA` owner route, else the
        organization's master user), and that is audited as the approval
        (`document.qa_release_approved`); an API key gets `free` documents only.
        What was kept back is named in `manifest.csv` ("Not included"), in the
        `X-Export-Refused` / `X-Export-Refused-Ids` headers and in the audit
        row. When NOTHING may go: 403 `sharing_rule_refused`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_ids]
              properties:
                document_ids:
                  type: array
                  items: { type: string }
                tenant_id:
                  type: string
      responses:
        '200':
          description: ZIP archive
          content:
            application/zip:
              schema:
                type: string
                format: binary
          headers:
            X-Export-Documents:
              schema: { type: integer }
            X-Export-Missing:
              schema: { type: integer }
            X-Export-Refused:
              schema: { type: integer }
              description: How many documents the sharing rule kept back.
            X-Export-Refused-Ids:
              schema: { type: string, example: "9f2c:locked,41ab:needs_qa" }
              description: Present when any were. `id:reason`, comma separated.
        '400': { description: Empty selection }
        '403':
          description: The sharing rule kept every document back
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharingRuleRefused' }
        '404': { description: Nothing in the selection is available }
        '413': { description: Over the document or size cap }

  /api/document-exports/send:
    post:
      tags: [Documents]
      summary: Email the selected documents as a token-gated link
      description: |
        Mints a `document_export_links` row (migration 0115) and emails a LINK —
        never attachments — from the portal's own sender with a reply-to of the
        calling user. `on_behalf_of` is free text printed as context; nothing
        impersonates a recipient's domain.

        Rate limited to 30 sends per hour per user. The link is revoked if the
        email fails, so a live link never exists for a message nobody received.
        Audited as `document_export.sent` with the recipients and the id list.
        Module-gated under `library`.

        **Sharing rule (migration 0137).** Asked BEFORE the link is minted,
        because the mint is the approval: a `locked` document is never put on a
        link; a `qa` document only when the sender is a QA releaser (audited
        `document.qa_release_approved`); an API key sends `free` documents only.
        What was kept back comes home in `refused`; the rest still goes. When
        nothing may go, nothing is minted or mailed: 403 `sharing_rule_refused`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_ids, recipients]
              properties:
                document_ids:
                  type: array
                  items: { type: string }
                recipients:
                  type: array
                  items: { type: string, format: email }
                on_behalf_of: { type: string }
                message: { type: string }
                tenant_id: { type: string }
      responses:
        '200':
          description: Sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: boolean }
                  recipients:
                    type: array
                    items: { type: string }
                  document_count: { type: integer }
                  missing_ids:
                    type: array
                    items: { type: string }
                  refused:
                    type: array
                    description: Documents the sharing rule kept back. The rest went.
                    items: { $ref: '#/components/schemas/SharingRefusal' }
                  qa_released_ids:
                    type: array
                    description: "`qa` documents that went because the sender is a QA releaser."
                    items: { type: string }
                  expires_at: { type: string }
        '400': { description: No recipients, or an address that is not valid }
        '403':
          description: |
            A reader may download an export but may not mail one; or the sharing
            rule kept every document back (`code: sharing_rule_refused`, with `refused`).
        '413': { description: Over the document or size cap }
        '429': { description: Rate limited }
        '502': { description: The email could not be sent; the link was revoked }
        '503': { description: Email is not configured for this portal }

  /api/document-exports/links:
    get:
      tags: [Documents]
      summary: Documents you sent - the register of export links
      description: |
        One row per send (migrations 0115 + 0116): when, by whom, on whose
        behalf, to which addresses, how many documents with the first few
        titles, the view and download counts, and a resolved `state` of
        `active` / `expired` / `revoked` (revoked wins over expired).

        An admin (super_admin / org_admin) sees the organization's sends;
        anybody else sees their own. `scope` is a request, not a guarantee -
        the response reports the scope it actually answered in.

        THE TOKEN IS NEVER RETURNED. This is the accountability screen, not a
        second way to open every export ever sent. Counts are counts of
        REQUESTS against the link, not of people: the URL is a bearer
        credential and may be forwarded, so nothing here can say which
        recipient opened it. Module-gated under `library`.
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [tenant, mine] }
        - name: tenant_id
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, maximum: 200, default: 100 }
      responses:
        '200':
          description: The sends, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  links:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        state: { type: string, enum: [active, expired, revoked] }
                        created_at: { type: string }
                        expires_at: { type: string }
                        never_expires:
                          type: boolean
                          description: A link that does not run out (0134). Still revocable; its state is never `expired`.
                        revoked_at: { type: string, nullable: true }
                        revoked_by_name: { type: string, nullable: true }
                        sent_by_id: { type: string }
                        sent_by_name: { type: string, nullable: true }
                        sent_by_email: { type: string, nullable: true }
                        on_behalf_of: { type: string, nullable: true }
                        message: { type: string, nullable: true }
                        recipients:
                          type: array
                          items: { type: string }
                        document_count: { type: integer }
                        document_titles:
                          type: array
                          items: { type: string }
                        documents_truncated: { type: boolean }
                        view_count: { type: integer }
                        last_viewed_at: { type: string, nullable: true }
                        download_count: { type: integer }
                        last_downloaded_at: { type: string, nullable: true }
                        can_revoke: { type: boolean }
                  scope: { type: string, enum: [tenant, mine] }
                  can_see_tenant: { type: boolean }
                  order_sends:
                    description: Documents sent from an order as attachments (migration 0134), in the same scope. Nothing to revoke or count.
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        order_id: { type: string }
                        order_number: { type: string }
                        status: { type: string, enum: [sent, partial, failed] }
                        recipients: { type: array, items: { type: string } }
                        part_count: { type: integer }
        '400': { description: No organization selected }
        '403': { description: Another tenant }

  /api/orders/{id}/items:
    post:
      tags: [Orders]
      summary: Put lines on an order by hand - pick approved documents, or type a line
      description: |
        Migration 0134. `document_ids` picks approved documents: one line per
        lot row of each, written exactly as an accepted lot match is
        (`coa_document_id`, `lot_id`, `lot_matched`, `coa_match_status =
        'matched'`, `coa_matched_at`) plus `picked_by` / `picked_at` and an
        `accepted` suggestion with `match_basis: manual_pick`. An existing line
        for that lot with no certificate is filled, not duplicated. `item` adds
        one typed line; a typed lot number is resolved and the matcher's
        certificates arrive as suggestions.

        Only ACTIVE documents of the order's own organization that have a file
        may be picked. Anything else is listed in `refused` with its reason and
        the rest still land. Nothing checks the document's type. `user` and
        above; module-gated under `fulfillment`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                document_ids:
                  type: array
                  maxItems: 50
                  items: { type: string }
                item:
                  type: object
                  properties:
                    product_id: { type: string, nullable: true }
                    product_name: { type: string, nullable: true }
                    product_code: { type: string, nullable: true }
                    quantity: { type: number, nullable: true }
                    lot_number: { type: string, nullable: true }
      responses:
        '201':
          description: What was written, and what was refused
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        document_id: { type: string }
                        order_item_id: { type: string }
                        outcome: { type: string, enum: [added, filled, already_on_order] }
                        lot_id: { type: string, nullable: true }
                        lot_number: { type: string, nullable: true }
                  refused:
                    type: array
                    items:
                      type: object
                      properties:
                        document_id: { type: string }
                        reason: { type: string }
                  item_id: { type: string }
        '400': { description: Nothing could be written (every document refused, or an empty request) }
        '403': { description: A read-only account cannot build an order }
        '404': { description: No such order in this organization }
        '409': { description: The order is still in staged connector review }

  /api/orders/{id}/items/{itemId}:
    put:
      tags: [Orders]
      summary: Change one order line, or put a document on it / take it off
      description: |
        `coa_document_id` is the pick: a document id puts that approved
        document on the line (with `lot_id` when it certifies several lots),
        `null` takes it off - and the matcher then never offers that pair back.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                product_id: { type: string, nullable: true }
                product_name: { type: string, nullable: true }
                product_code: { type: string, nullable: true }
                quantity: { type: number, nullable: true }
                lot_number: { type: string, nullable: true }
                coa_document_id: { type: string, nullable: true }
                lot_id: { type: string, nullable: true }
      responses:
        '200': { description: Saved }
        '400': { description: Not an active document of this organization, or the lot was not named }
        '403': { description: A read-only account }
        '404': { description: No such order or line }
    delete:
      tags: [Orders]
      summary: Remove one order line
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Removed; the whole row is in the audit record }
        '403': { description: A read-only account }
        '404': { description: No such order or line }

  /api/orders/{id}/send-preview:
    get:
      tags: [Orders]
      summary: Exactly what sending this order's documents would do - sends nothing
      description: |
        The review screen's data (migration 0134): every file under the
        GENERATED name it travels under, which email each rides in, whether a
        certificate goes whole (`source: original`) or as one lot's page, what
        leaves as a link, which lines will not be sent, and whether the order
        can be sent at all. Carries a `fingerprint` that Send echoes back.
        No storage key or queue id is returned.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The plan
          content:
            application/json:
              schema:
                type: object
                properties:
                  recipient: { type: string, nullable: true, description: The customer's own address on record }
                  recipients:
                    type: array
                    items: { type: string }
                    description: |
                      Migration 0135. The addresses to pre-fill: the customer's
                      COA contacts (primary first), then any delivery contact
                      named by a requirement for an item on this order; capped
                      at 10. With no such contact, the customer's own address.
                  recipient_source: { type: string, enum: [coa_contacts, customer_email, none] }
                  recipients_over_cap: { type: integer, description: COA contacts left off the list by the cap }
                  item_requirements:
                    type: array
                    description: The customer's requirement for each line whose item has one. Information and a warning only - never part of `blocked` or the fingerprint.
                    items:
                      type: object
                      properties:
                        order_item_id: { type: string }
                        product_id: { type: string }
                        product_name: { type: string, nullable: true }
                        lot_label: { type: string, nullable: true }
                        coa_required: { type: string, enum: ['yes', 'no', on_request] }
                        must_show: { type: string, nullable: true }
                        timing: { type: string, nullable: true }
                        summary: { type: string }
                        delivery_contact:
                          type: object
                          nullable: true
                          properties:
                            name: { type: string, nullable: true }
                            email: { type: string }
                        document_on_line: { type: boolean }
                        missing: { type: boolean, description: Required and nothing on this line will be sent }
                  from_name: { type: string }
                  reply_to: { type: string }
                  default_subject: { type: string }
                  email_configured: { type: boolean }
                  part_count: { type: integer }
                  total_bytes: { type: integer }
                  fingerprint: { type: string }
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        file_name: { type: string }
                        bytes: { type: integer }
                        delivery: { type: string, enum: [attachment, link] }
                        source: { type: string, enum: [document, original] }
                        part_number: { type: integer }
                        document_ids: { type: array, items: { type: string } }
                        lot_label: { type: string, nullable: true }
                        notes: { type: array, items: { type: string } }
                        link_days:
                          type: integer
                          nullable: true
                          description: For a `link` file. Absent or null = a file too large to attach, on a link that does not expire. 30 = a document order's link (migration 0138).
                        document_lines:
                          type: array
                          description: The document lines (0138) this file stands for.
                          items:
                            type: object
                            properties:
                              order_document_id: { type: string }
                              product_name: { type: string, nullable: true }
                              supplier_name: { type: string, nullable: true }
                              document_type_name: { type: string, nullable: true }
                  documents:
                    type: object
                    description: |
                      Migration 0138. The order's document lines in the three
                      groups the review screen shows. Absent when the order has
                      none. `only_asks_qa` = nothing reaches the customer with
                      this send: it holds documents for QA and reports what is
                      missing or expired (`part_count` is then 0).
                    properties:
                      goes_now: { type: array, items: { type: object } }
                      waits_for_qa: { type: array, items: { type: object } }
                      will_not_go: { type: array, items: { type: object } }
                      link_days: { type: integer }
                      only_asks_qa: { type: boolean }
                  parts:
                    type: array
                    items:
                      type: object
                      properties:
                        part_number: { type: integer }
                        subject: { type: string }
                        bytes: { type: integer }
                        file_count: { type: integer }
                  lines_not_sent:
                    type: array
                    items:
                      type: object
                      properties:
                        order_item_id: { type: string }
                        reason: { type: string }
                        sharing_refusal:
                          type: string
                          enum: [locked, needs_qa]
                          description: Set when the sharing rule is why the line is not sent (migration 0137).
                        document_id: { type: string }
                        order_document_id:
                          type: string
                          description: Set when this is a document line (0138). `order_item_id` is then empty.
                  warnings: { type: array, items: { type: string } }
                  blocked:
                    type: object
                    nullable: true
                    properties:
                      code: { type: string, enum: [nothing_to_send, too_many_parts, too_many_linked, order_staged] }
                      message: { type: string }
        '403': { description: A read-only account cannot send, so has no review to make }
        '404': { description: No such order in this organization }

  /api/orders/{id}/send:
    post:
      tags: [Orders]
      summary: Mail an order's documents to the customer, attached
      description: |
        An exact copy of each file ATTACHED under a generated name, from
        "<Organization> via SupDox" with a reply-to of the caller. 15 MB of
        files per email; what does not fit goes in numbered emails ("2 of 3").
        A single file over 15 MB leaves as a link that does not expire. More
        than 10 emails is refused with the number. A multi-lot certificate
        goes whole, once. Each email succeeds or fails on its own; the order
        becomes `delivered` only when every part went and no line was left
        behind.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recipients:
                  description: Defaults to the customer's address on record.
                  type: array
                  maxItems: 10
                  items: { type: string, format: email }
                subject: { type: string }
                message: { type: string }
                fingerprint:
                  type: string
                  description: From the preview that was reviewed. A changed plan is refused.
      responses:
        '200':
          description: At least one email went. `send.status` is `sent` or `partial`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: boolean }
                  order_status: { type: string }
                  send:
                    type: object
                    properties:
                      id: { type: string }
                      status: { type: string, enum: [sent, partial, failed] }
                      recipients: { type: array, items: { type: string } }
                      subject: { type: string }
                      part_count: { type: integer }
                      can_resend: { type: boolean }
                      outcome:
                        type: string
                        enum: [sent, partial, failed, withdrawn, sent_rest_withdrawn]
                        description: "What to call the result. withdrawn = nothing left at all, every email's files were withdrawn on a resend (stored status failed); sent_rest_withdrawn = some emails went and the rest were withdrawn (stored status partial). Neither can be resent."
                      kind:
                        type: string
                        enum: [send, qa_request, qa_release]
                        description: Migration 0138. `qa_request` = nothing went to the customer; QA was asked. `qa_release` = the mail a QA release produced.
                  documents:
                    type: object
                    description: What happened to the order's document lines (0138). Absent when it has none.
                    properties:
                      sent: { type: integer }
                      pending_qa: { type: integer }
                      not_sent: { type: integer }
                      qa_notice:
                        type: object
                        nullable: true
                        properties:
                          line_count: { type: integer }
                          sent: { type: boolean }
                          via: { type: string, enum: [owner_route, routing_gap, none] }
                          recipients: { type: array, items: { type: string } }
        '400': { description: Nothing to send, no address to send to, or an address that is not valid }
        '403': { description: A read-only account cannot send }
        '404': { description: No such order in this organization }
        '409': { description: The order changed since it was reviewed, or is still in staged review }
        '413': { description: More emails than one send allows; the message carries both numbers }
        '429': { description: Rate limited (30 sends an hour per user) }
        '502': { description: No email could be sent. The failed send is recorded and can be resent. }
        '503': { description: Email is not configured for this portal }

  /api/orders/{id}/sends/{sendId}/resend:
    post:
      tags: [Orders]
      summary: Send again only the emails of a send that did not go
      description: |
        Rebuilt from the stored record - the same files, names, subject and
        recipients, the reply-to of the original sender. Emails that already
        went are never sent twice. The sender or an admin.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: sendId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: The send record after the attempt }
        '403': { description: Not the sender, not an admin, or a read-only account }
        '404': { description: No such order or send }
        '409': { description: Every email of this send already went, or the record is a QA release (released again from the waiting list, not resent) }
        # 200 may carry `not_resent: [{ file_name, reason }]` (migration 0138): files left out
        # because the document line they came from was refused, removed or re-pointed, or its
        # document expired or changed. The rest of the email still goes.
        '429': { description: Rate limited }
        '503': { description: Email is not configured for this portal }

  /api/orders/{id}/documents:
    get:
      tags: [Orders]
      summary: The document lines of an order
      description: |
        Migration 0138. Each line is one (item, supplier, document type),
        judged for the CALLER against the document's sharing rule as it stands
        now: `disposition` is what a send by them would do with it.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The lines
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items: { $ref: '#/components/schemas/OrderDocumentLine' }
        '404': { description: No such order in this organization }
    post:
      tags: [Orders]
      summary: Add documents for items to an order (a document order)
      description: |
        Migration 0138, decisions C-043 / C-044. One line is written per
        (item, supplier, document type), resolved to the supplier's CURRENT
        approved document of that type: the item's own document
        (`document_products`) before a supplier-level one, the newest of
        those; an expired newest document is `expired` (an older one in date
        is never used in its place); nothing on file is `missing`. A document
        linked only to OTHER items is never offered.

        ANY LOGIN, a read-only account included. APPROVED PAIRS ONLY: a pair
        that is pending or not approved is listed in `refused` with the reason
        and the rest still land. A product with several approved suppliers is
        one line per pair that was asked for; nothing picks a supplier.

        `dry_run: true` writes nothing and answers what would resolve.
        At most 200 lines (items x types) per request.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, document_type_ids]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [product_id, supplier_id]
                    properties:
                      product_id: { type: string }
                      supplier_id: { type: string }
                document_type_ids:
                  type: array
                  items: { type: string }
                dry_run: { type: boolean }
      responses:
        '200': { description: A dry run, or every line asked for was already on the order }
        '201':
          description: At least one line was added
          content:
            application/json:
              schema:
                type: object
                properties:
                  dry_run: { type: boolean }
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        product_id: { type: string }
                        product_name: { type: string, nullable: true }
                        supplier_id: { type: string }
                        supplier_name: { type: string, nullable: true }
                        document_type_id: { type: string }
                        document_type_name: { type: string, nullable: true }
                        resolution: { type: string, enum: [found, missing, expired] }
                        resolution_note: { type: string, nullable: true }
                        document_id: { type: string, nullable: true }
                        document_title: { type: string, nullable: true }
                        document_due_date: { type: string, nullable: true }
                        sharing_rule: { type: string, nullable: true, enum: [free, qa, locked] }
                        private_label: { type: boolean }
                        advisory: { type: string, nullable: true }
                        outcome: { type: string, enum: [added, already_on_order, would_add] }
                        order_document_id: { type: string }
                  refused:
                    type: array
                    items:
                      type: object
                      properties:
                        product_id: { type: string }
                        supplier_id: { type: string }
                        document_type_id: { type: string }
                        reason: { type: string }
        '400': { description: Nothing chosen, too many lines, or everything asked for was refused }
        '404': { description: No such order in this organization }
        '409': { description: The order is still in staged review }

  /api/orders/{id}/documents/{lineId}:
    delete:
      tags: [Orders]
      summary: Take one document line off an order
      description: "Any login of the organization, except that a read-only account may not remove a line that is waiting for QA, being released or released (403). The whole line goes into the audit record."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: lineId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Removed }
        '403': { description: "A read-only account, on a line that is waiting for QA, released or refused" }
        '404': { description: No such order or line in this organization }
        '409': { description: "The line is in the middle of a release; release it again or put it back first" }

  /api/orders/{id}/documents/{lineId}/refresh:
    post:
      tags: [Orders]
      summary: Resolve a document line again
      description: |
        A line keeps the document it was added with; nothing re-resolves it on
        its own. When the answer is a different document, whatever was decided
        about the old one (release, refusal, notice to QA) is cleared.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: lineId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The line as it now stands
          content:
            application/json:
              schema:
                type: object
                properties:
                  changed: { type: boolean }
                  document: { $ref: '#/components/schemas/OrderDocumentLine' }
        '404': { description: No such order or line in this organization }

  /api/orders/{id}/documents/release:
    post:
      tags: [Orders]
      summary: QA releases documents held on an order
      description: |
        A QA releaser signed in to the portal (the `QA` owner route, else the
        master user, or an administrator). NEVER an API key and never a
        read-only account. The LIVE sharing rule is asked of the releaser: a
        document locked, archived or expired since the line was added is not
        released and stays waiting, with the reason in `refused`.

        Lines released together and bound for the same recipients leave on ONE
        link in ONE email. The link works for 30 days and is minted in the
        releaser's name. The recipients are those of the send that asked.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  maxItems: 50
                  description: |
                    Each line WITH WHAT QA SAW, as GET /api/order-documents/pending
                    returned it. A line whose document, version or asking send has
                    changed since is not released (`refused[].code: changed`).
                    More than 50 is a 400 and releases nothing.
                  items:
                    type: object
                    required: [id, document_id, version_number, pending_send_id]
                    properties:
                      id: { type: string }
                      document_id: { type: string }
                      version_number: { type: integer }
                      pending_send_id: { type: string }
      responses:
        '200':
          description: At least one document was released
          content:
            application/json:
              schema:
                type: object
                properties:
                  released: { type: array, items: { type: string } }
                  refused:
                    type: array
                    items:
                      type: object
                      properties:
                        order_document_id: { type: string }
                        reason: { type: string }
                        code:
                          type: string
                          enum: [changed, in_progress, unfinished, undone]
                          description: "changed = not what QA saw any more; in_progress = being released right now; unfinished = the outcome of the email was not recorded; undone = somebody put the release back while its mail was going out, and its link was withdrawn."
                  order_status: { type: string }
                  sends: { type: array, items: { type: object } }
        '403': { description: Not a QA releaser, a read-only account, or an API key }
        '404': { description: No such order, or a line id that is not a line of it }
        '409': { description: Nothing was released; `refused` says why for each line }
        '503': { description: Email is not configured for this portal }

  /api/orders/{id}/documents/{lineId}/release:
    post:
      tags: [Orders]
      summary: QA releases one held document
      description: The batch route with one line. Same rules, same responses.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: lineId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_id, version_number, pending_send_id]
              properties:
                document_id: { type: string }
                version_number: { type: integer }
                pending_send_id: { type: string }
      responses:
        '200': { description: Released }
        '403': { description: Not a QA releaser, a read-only account, or an API key }
        '404': { description: No such order or line in this organization }
        '409': { description: Not released; `refused` says why }

  /api/orders/{id}/documents/{lineId}/refuse:
    post:
      tags: [Orders]
      summary: QA refuses one held document, with a note
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: lineId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note, document_id, pending_send_id]
              properties:
                note: { type: string, maxLength: 500 }
                document_id: { type: string, description: The document QA saw on the line }
                pending_send_id: { type: string, description: The send that asked, as QA saw it }
      responses:
        '200': { description: Refused. The line stays on the order, marked, with the note. }
        '400': { description: "No note, or no document_id / pending_send_id" }
        '403': { description: Not a QA releaser, a read-only account, or an API key }
        '404': { description: No such order or line in this organization }
        '409': { description: "The line is not waiting for QA any more, or changed since QA opened it" }

  /api/orders/{id}/documents/{lineId}/give-back:
    post:
      tags: [Orders]
      summary: Put a release that did not finish back in the waiting list
      description: |
        A release is claimed (`releasing`) before its mail is sent and is
        `released` only once the mail went and the record was written. A line
        still `releasing` after five minutes did not finish. This revokes the
        link that attempt minted, marks its record, and returns the line to
        `pending_qa`. A QA releaser signed in; never an API key.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: lineId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Back in the waiting list }
        '403': { description: "Not a QA releaser, a read-only account, or an API key" }
        '404': { description: No such order or line in this organization }
        '409': { description: "The line is not in the middle of a release, or the release is still in progress" }

  /api/order-documents/pending:
    get:
      tags: [Orders]
      summary: Every document waiting for QA across the organization's orders
      description: |
        QA's worklist (migration 0138). A person who can release gets the
        lines; anybody else gets `can_release: false` and an empty list (a 200,
        so navigation can ask for the count). An API key is never a releaser.
      parameters:
        - { name: tenant_id, in: query, required: false, schema: { type: string }, description: super_admin only }
        - { name: count, in: query, required: false, schema: { type: string, enum: ['1'] }, description: "Answer can_release and count from one COUNT, with no lines. What the navigation polls." }
      responses:
        '200':
          description: The waiting lines
          content:
            application/json:
              schema:
                type: object
                properties:
                  can_release: { type: boolean }
                  count: { type: integer }
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        order_id: { type: string }
                        order_number: { type: string }
                        customer_name: { type: string, nullable: true }
                        product_name: { type: string, nullable: true }
                        supplier_name: { type: string, nullable: true }
                        facility_name: { type: string, nullable: true }
                        document_type_name: { type: string, nullable: true }
                        document_id: { type: string, nullable: true }
                        document_title: { type: string, nullable: true }
                        version_number: { type: integer, nullable: true, description: "The version a release would send. Echoed back on release." }
                        document_approved_at: { type: string, nullable: true }
                        pending_send_id: { type: string, nullable: true, description: "The send that asked. Echoed back on release." }
                        release_status: { type: string, enum: [pending_qa, releasing] }
                        stuck: { type: boolean, description: "releasing for more than five minutes: the release did not finish" }
                        sharing_rule: { type: string, nullable: true, enum: [free, qa, locked] }
                        requested_by_name: { type: string, nullable: true }
                        requested_at: { type: string, nullable: true }
                        recipients: { type: array, items: { type: string } }
                        advisory: { type: string, nullable: true }
                        releasable: { type: boolean }
                        blocked_reason: { type: string, nullable: true }
                        earlier_refusals:
                          type: array
                          description: QA refused the same item, supplier and type on this order before the line was taken off and asked for again.
                          items:
                            type: object
                            properties:
                              by_name: { type: string, nullable: true }
                              at: { type: string, nullable: true }
                              note: { type: string }
                              document_id: { type: string, nullable: true }

  /api/document-exports/links/{id}/revoke:
    post:
      tags: [Documents]
      summary: Revoke a sent export link
      description: |
        Shuts the link off immediately and on ALL THREE recipient routes - the
        landing read, the ZIP and the per-file download - because every one of
        them resolves its token through `loadUsableExportLink`, which returns
        null for a revoked row, and all three then answer the same 404 they
        answer for a token that never existed.

        The sender may revoke their own; an admin may revoke anyone's in the
        tenant. Another tenant's link answers 404, never 403, so the endpoint
        cannot be used as a probe. A second press is a no-op that does not move
        the first revocation's timestamp.

        It cannot recall a file already downloaded, and THERE IS NO EXTEND:
        lengthening a link after the fact changes the terms of a mail already
        sent. Send again instead. Audited as `document_export.revoked` with the
        recipients, the id list and the counts at the moment it was pulled.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The link, now revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  link: { type: object }
        '403': { description: Not the sender, and not an admin }
        '404': { description: No such link in this tenant }

  /api/document-exports/public/{token}:
    get:
      tags: [Documents]
      summary: What an export link contains (public, token-gated)
      description: |
        The unauthenticated read behind `/export/:token`. The response is an
        explicit allow-list carrying no internal id; files are addressed by
        their POSITION in the link's own frozen list. Every unusable state —
        unknown, expired, revoked — answers 404 alike. Each view is audited
        (`document_export_link.view`) and rate limited per (link, IP).

        The sharing rule is re-read on every request (migration 0137): a
        document that has been LOCKED since the link was sent is no longer
        listed or served, here or on the two file routes below. A `qa` document
        is served only while the person who minted the link can still release
        QA documents (decision C-045). `unavailable_count` says how many
        documents the link was sent with that it no longer serves (withheld
        or removed), and nothing about which or why.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The documents this export contained
        '404': { description: Unknown, expired or revoked }
        '429': { description: Rate limited }

  /api/document-exports/public/{token}/download:
    get:
      tags: [Documents]
      summary: The recipient's ZIP (public, token-gated)
      description: |
        The same archive and manifest as the signed-in export. The document set
        comes from the link, never from the request. Audited as
        `document_export_link.download` (with `withheld_ids` when the sharing
        rule now withholds a document that was on the link).
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ZIP archive
          content:
            application/zip:
              schema: { type: string, format: binary }
        '404': { description: Unknown, expired or revoked }
        '429': { description: Rate limited }

  /api/document-exports/public/{token}/file/{index}:
    get:
      tags: [Documents]
      summary: One file out of an export (public, token-gated)
      description: |
        `index` is a POSITION in the link's own list, not a document id, so it
        addresses nothing outside this export. Audited as
        `document_export_link.file`.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
        - name: index
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: The file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { description: Unknown link, or a position not in the export }
        '429': { description: Rate limited }

  /api/graphql:
    post:
      tags: [GraphQL]
      summary: GraphQL endpoint
      description: |
        Full GraphQL API with queries and mutations mirroring the REST API.
        Supports GraphiQL IDE when accessed via GET in a browser.
        Authentication is optional (login mutation works without a token).
        Authenticated requests use the same Bearer JWT as REST endpoints.
        **No auth required** (the /api/graphql path is public; individual resolvers enforce auth).

        **Errors match the REST surface for the same condition.** A refusal
        carries the same message the REST handler returns and an
        `extensions.code` of `UNAUTHENTICATED` / `FORBIDDEN` / `NOT_FOUND` /
        `BAD_REQUEST` / `CONFLICT`, and the response status is the matching
        401 / 403 / 404 / 400 / 409. A module refusal keeps its own
        `module_disabled` / `module_not_visible` code. **Everything else is
        masked**: a genuine server error is always `Unexpected error.` with
        code `INTERNAL_SERVER_ERROR` and nothing of the original attached.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
