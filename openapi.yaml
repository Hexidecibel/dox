openapi: 3.1.0
info:
  title: Dox API
  description: |
    Multi-tenant document upload/download portal with version tracking, role-based access control,
    audit logging, and report generation. Built on Cloudflare Pages Functions with D1 (SQLite) and R2 (object storage).

    ## Authentication
    All endpoints except login, forgot-password, reset-password, and GraphQL require authentication
    via either a Bearer JWT token in the Authorization header or an API key in the X-API-Key header.
    JWT tokens are issued by POST /api/auth/login and expire after 24 hours.
    API keys are created via POST /api/api-keys and use the prefix `dox_sk_`.
    Sessions can be revoked server-side via POST /api/auth/logout.

    ## Roles
    - **super_admin** — Full access across all tenants. Can manage tenants, users, and all documents.
    - **org_admin** — Admin within their tenant. Can manage users (user/reader only) and documents in their org.
    - **user** — Can create, upload, update, and delete documents within their tenant.
    - **reader** — Read-only access to documents within their tenant.

    ## Multi-tenancy
    All data is scoped to tenants. Non-super_admin users are automatically restricted to their own tenant.
  version: 0.1.0
  contact:
    name: Dox

servers:
  - url: http://localhost:8788
    description: Local development
  - url: https://dox.pages.dev
    description: Production (Cloudflare Pages)

security:
  - BearerAuth: []
  - ApiKeyAuth: []

tags:
  - name: Auth
    description: Authentication and password management
  - name: Documents
    description: Document CRUD, file upload/download, versioning, and search
  - name: Tenants
    description: Tenant (organization) management
  - name: Users
    description: User management and profiles
  - name: Reports
    description: Document report generation (CSV/JSON)
  - name: Audit
    description: Audit log queries
  - name: API Keys
    description: API key management for programmatic access
  - name: Supplier Arrivals
    description: |
      Files suppliers sent through a request link, as staff see them, and the
      decision about which requirements each one satisfies (migration 0104).
  - name: Intake Duplicates
    description: |
      Files that arrived byte-identical to one already approved or already
      waiting in the Review Queue, recorded instead of queued a second time,
      and "Review anyway" (migration 0108).
  - name: Spec Register
    description: |
      The out-of-spec register — every judged COA test result, which limit it
      was judged against, who judged it, and who acknowledged it.
  - name: Renewals
    description: |
      The renewal dashboard, renewal alerts, and how far ahead owners are
      warned (renewal alert lead time, migration 0111).
  - name: Suppliers
    description: |
      Suppliers, the product identifiers each one's certificates are read
      through, and each supplier's declared lot format (migration 0110).
  - name: Products
    description: |
      Our products and the identifier graph that says what each one goes by —
      our SKU, a supplier's item number or name, an alias, a GTIN, a pack
      (migration 0107).
  - name: Supplier Requirements
    description: |
      What a supplier owes, derived from the verified supplier list rather than
      guessed uniformly (migration 0112).
  - name: GraphQL
    description: GraphQL API (alternative to REST)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token obtained from POST /api/auth/login.
        Token payload contains: sub (user ID), email, role, tenantId.
        Tokens expire after 24 hours. Sessions are tracked server-side and can be revoked.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        API key for programmatic access, created via POST /api/api-keys.
        Keys use the prefix `dox_sk_` and authenticate as the user who created them.
        Pass the full key in the X-API-Key header. Keys can be scoped to a tenant
        and optionally have an expiration date.

  schemas:
    SupplierListImportResponse:
      type: object
      description: |
        What a supplier-list import did, or would do. Identical in shape for a
        dry run and an apply — the only difference is `dry_run` and whether
        `run_id` is set — so a reviewer reads the same report either way.
      properties:
        dry_run: { type: boolean }
        run_id: { type: [string, 'null'], description: The stored run. Always null on a dry run, which stores nothing. }
        pack: { type: string }
        file_name: { type: [string, 'null'] }
        counts: { type: object }
        suppliers: { type: array, items: { type: object }, description: Per supplier, the requirements derived and why. }
        flagged: { type: array, items: { type: object }, description: Derived rows the list no longer implies. Flagged, never deleted. }
        rows: { type: array, items: { type: object }, description: Per input row, what became of it. }
        unmatched: { type: array, items: { type: object }, description: Products and claims the row named that the tenant does not hold. Reported, never invented. }
        rule_problems: { type: array, items: { type: string } }
        unrecognized_headers: { type: array, items: { type: string } }
        rules: { type: object, description: The rules in force for this pack, echoed back. }
    ResolvedRenewalAlertLead:
      type: object
      description: A resolved renewal alert lead time and which rung answered.
      properties:
        days: { type: integer }
        source: { type: string, enum: [document_type, tenant, default] }
    ExpirationRow:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        primary_category_name: { type: string, nullable: true }
        owner: { type: string, nullable: true }
        renewal_type: { type: string }
        renewal_due_date: { type: string, format: date, nullable: true }
        status: { type: string, enum: [current, expiring, expired, overdue, stale], description: Judged against the dashboard look-ahead }
        days_until: { type: integer, nullable: true }
        renewal_rule: { type: string }
        renewal_period_months: { type: integer, nullable: true }
        alert_lead_days: { type: integer, description: "Days before due this document's owner is warned" }
        alert_lead_source: { type: string, enum: [document_type, tenant, default] }
        alert_status: { type: string, enum: [current, expiring, expired, overdue, stale], description: "Judged against alert_lead_days; what alerts mail on" }
    RenewalAlertedDocument:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        status: { type: string }
        renewal_due_date: { type: string, format: date, nullable: true }
        days_until: { type: integer, nullable: true }
        alert_lead_days: { type: integer }
        alert_lead_source: { type: string, enum: [document_type, tenant, default] }
    RenewalAlertLeadTime:
      type: object
      properties:
        tenant_id: { type: string }
        lead_days: { type: integer, nullable: true, description: "The stored setting; null = the default applies" }
        effective: { $ref: '#/components/schemas/ResolvedRenewalAlertLead' }
        default_lead_days: { type: integer, example: 60 }
        min_lead_days: { type: integer, example: 7 }
        max_lead_days: { type: integer, example: 365 }
        presets: { type: array, items: { type: integer }, example: [30, 60, 90] }
        updated_at: { type: string, nullable: true }
        updated_by: { type: string, nullable: true }
        updated_by_name: { type: string, nullable: true }
        document_type_overrides:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              lead_days: { type: integer }
              updated_at: { type: string, nullable: true }
    RenewalLeadTimePreview:
      type: object
      properties:
        as_of: { type: string, format: date }
        scope: { type: string, enum: [tenant, document_type] }
        document_type_id: { type: string, nullable: true }
        proposed_lead_days: { type: integer, nullable: true }
        current_tenant_lead: { $ref: '#/components/schemas/ResolvedRenewalAlertLead' }
        proposed_tenant_lead: { $ref: '#/components/schemas/ResolvedRenewalAlertLead' }
        current_alerting_count: { type: integer }
        proposed_alerting_count: { type: integer }
        newly_entering_count: { type: integer, description: "Alerting under the proposal and not today" }
        newly_entering_would_send_count: { type: integer, description: "Of those, the ones the next scheduled run would mail (cooldown applied)" }
        leaving_count: { type: integer }
        lead_changed_count: { type: integer }
        newly_entering:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              days_until: { type: integer, nullable: true }
              alert_lead_days: { type: integer }
              alert_lead_source: { type: string }
              current_alert_lead_days: { type: integer }
              next_run_decision: { type: string, enum: [first, escalated, cooldown_elapsed, suppressed], nullable: true }
        leaving: { type: array, items: { type: object } }
    User:
      type: object
      properties:
        id:
          type: string
          description: Hex UUID (no dashes)
          example: "a1b2c3d4e5f6789012345678abcdef01"
        email:
          type: string
          format: email
          example: "user@example.com"
        name:
          type: string
          example: "John Doe"
        role:
          type: string
          enum: [super_admin, org_admin, user, reader]
          example: "user"
        tenant_id:
          type: string
          nullable: true
          description: Tenant this user belongs to. Null for super_admins without a tenant.
          example: "abcdef1234567890abcdef1234567890"
        active:
          type: integer
          enum: [0, 1]
          description: "1 = active, 0 = deactivated"
          example: 1
        last_login_at:
          type: string
          nullable: true
          format: date-time
        created_at:
          type: string
          format: date-time
      required: [id, email, name, role, active]

    Tenant:
      type: object
      properties:
        id:
          type: string
          example: "abcdef1234567890abcdef1234567890"
        name:
          type: string
          example: "Acme Corp"
        slug:
          type: string
          description: URL-safe identifier, auto-generated from name if not provided
          example: "acme-corp"
        description:
          type: string
          nullable: true
          example: "Manufacturing division"
        active:
          type: integer
          enum: [0, 1]
          example: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, name, slug, active, created_at, updated_at]

    Document:
      type: object
      properties:
        id:
          type: string
          example: "doc123abc456def789012345678abcde"
        tenant_id:
          type: string
        title:
          type: string
          example: "Safety Data Sheet - Widget A"
        description:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
          example: "regulatory"
        tags:
          type: string
          description: JSON-encoded array of tag strings
          example: '["safety","compliance"]'
        current_version:
          type: integer
          description: Latest version number (0 = no file uploaded yet)
          example: 3
        status:
          type: string
          enum: [active, archived, deleted]
          example: "active"
        created_by:
          type: string
          description: User ID of creator
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        creator_name:
          type: string
          nullable: true
          description: Joined from users table
        creator_email:
          type: string
          nullable: true
          description: Joined from users table
        tenant_name:
          type: string
          nullable: true
          description: Joined from tenants table
        external_ref:
          type: string
          nullable: true
          description: Stable external reference ID for programmatic upserts
          example: "REF-2024-001"
        source_metadata:
          type: string
          nullable: true
          description: JSON string with ingestion metadata (source, from, subject, received_at, etc.)
      required: [id, tenant_id, title, current_version, status, created_by, created_at, updated_at]

    DocumentVersion:
      type: object
      properties:
        id:
          type: string
        document_id:
          type: string
        version_number:
          type: integer
          example: 2
        file_name:
          type: string
          example: "sds-widget-a-v2.pdf"
        file_size:
          type: integer
          description: File size in bytes
          example: 524288
        mime_type:
          type: string
          example: "application/pdf"
        r2_key:
          type: string
          description: Storage key in R2
          example: "acme-corp/doc123/2/sds-widget-a-v2.pdf"
        checksum:
          type: string
          nullable: true
          description: SHA-256 hex digest
        change_notes:
          type: string
          nullable: true
          example: "Updated section 4.2 with new regulations"
        uploaded_by:
          type: string
          description: User ID of uploader
        created_at:
          type: string
          format: date-time
        uploader_name:
          type: string
          nullable: true
          description: Joined from users table (present in list responses)
      required: [id, document_id, version_number, file_name, file_size, mime_type, r2_key, uploaded_by, created_at]

    AuditEntry:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: string
          nullable: true
        tenant_id:
          type: string
          nullable: true
        action:
          type: string
          description: "Action performed, e.g. login, logout, document_created, document_updated, document_deleted, document_version_uploaded, document_downloaded, user_created, user_updated, user_deactivated, user.password_reset, tenant_created, tenant_updated, tenant_deactivated, password_changed, report.generate"
          example: "document_created"
        resource_type:
          type: string
          nullable: true
          example: "document"
        resource_id:
          type: string
          nullable: true
        details:
          type: string
          nullable: true
          description: JSON string with change details
        ip_address:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        user_name:
          type: string
          nullable: true
          description: Joined from users table
        user_email:
          type: string
          nullable: true
          description: Joined from users table
      required: [id, action, created_at]

    AuthPayload:
      type: object
      properties:
        token:
          type: string
          description: JWT bearer token (24h expiry)
        user:
          type: object
          properties:
            id:
              type: string
            email:
              type: string
            name:
              type: string
            role:
              type: string
            tenant_id:
              type: string
              nullable: true
            force_password_change:
              type: integer
              enum: [0, 1]
              description: "1 if user must change password on next login"
      required: [token, user]

    Error:
      type: object
      properties:
        error:
          type: string
          example: "Unauthorized"
      required: [error]

    ApiKey:
      type: object
      properties:
        id:
          type: string
          description: Hex UUID
        name:
          type: string
          description: Human-readable name for the API key
          example: "CI Pipeline Key"
        key_prefix:
          type: string
          description: First 12 characters of the key (for identification)
          example: "dox_sk_abc12"
        user_id:
          type: string
          description: User who created the key
        tenant_id:
          type: string
          nullable: true
          description: Tenant this key is scoped to (null = determined by user's tenant)
        permissions:
          type: string
          description: JSON array of permission strings (default '["*"]')
          example: '["*"]'
        last_used_at:
          type: string
          nullable: true
          format: date-time
        expires_at:
          type: string
          nullable: true
          description: Last moment the key works (UTC timestamp). Older keys may hold a bare date, which means through the end of that day UTC.
        revoked:
          type: integer
          enum: [0, 1]
          description: "0 = active, 1 = revoked"
        created_at:
          type: string
          format: date-time
        user_name:
          type: string
          nullable: true
          description: Joined from users table
        user_email:
          type: string
          nullable: true
          description: Joined from users table
      required: [id, name, key_prefix, user_id, permissions, revoked, created_at]

    RequestArrivalClaim:
      type: object
      description: |
        One "this file covers that requirement" claim, mapped onto the CURRENT
        version of the request by line identity. `line_id` is the id to decide
        with; `claimed_line_id` is the row the claim was made against.
      properties:
        claim_id: { type: string }
        line_id: { type: string, nullable: true, description: Null when a later amendment removed the line. }
        claimed_line_id: { type: string }
        line_name: { type: string }
        line_kind: { type: string, enum: [requirement, free_text] }
        requirement_id: { type: string, nullable: true }
        tier: { type: string, enum: [required, recommended] }
        line_status: { type: string, nullable: true, enum: [not_started, received, under_review, accepted, needs_attention] }
        line_accepted_document_id: { type: string, nullable: true }
        claimed_by: { type: string, enum: [supplier, staff] }
        added_by_name: { type: string, nullable: true }
        decision: { type: string, nullable: true, enum: [accepted, needs_attention] }
        decision_document_id: { type: string, nullable: true }
        decided_at: { type: string, nullable: true }
        decided_by_name: { type: string, nullable: true }
        decided_elsewhere:
          type: boolean
          description: Undecided here, but the line was settled from another file or by hand.

    SpecCheck:
      type: object
      description: |
        One judged test result in the out-of-spec register. Verdicts are never
        edited; only acknowledgement is written from outside.
      properties:
        id: { type: string }
        tenant_id: { type: string }
        document_id: { type: string }
        version_number: { type: integer, nullable: true }
        queue_item_id: { type: string, nullable: true }
        spec_test_id: { type: string, nullable: true }
        test_name_raw: { type: string }
        value_raw: { type: string, nullable: true }
        value_num: { type: number, nullable: true }
        unit_raw: { type: string, nullable: true }
        verdict: { type: string, enum: [in_spec, out_of_spec, not_checked] }
        reason: { type: string, nullable: true }
        source: { type: string, enum: [printed, limit], description: "printed = the COA's own spec; limit = our configured limit" }
        limit_id: { type: string, nullable: true }
        limit_snapshot: { type: string, nullable: true, description: JSON of the limit as it stood when judged }
        acknowledged_by: { type: string, nullable: true }
        acknowledged_at: { type: string, nullable: true }
        acknowledgement_note: { type: string, nullable: true }
        notified_at: { type: string, nullable: true }
        judgement_origin:
          type: string
          nullable: true
          enum: [approval, bulk_recheck]
          description: |
            Who judged it (migration 0103). `approval` = a reviewer had the
            document open with this result showing. `bulk_recheck` =
            bin/backfill-spec-register computed it over history; nobody reviewed
            it at approval and nobody was emailed.
        bulk_run_at: { type: string, nullable: true, description: The bulk pass's timestamp; NULL at approval }
        result_key: { type: string, nullable: true, description: 'Where on the certificate the result was printed (migration 0105), e.g. "ai_fields::t0r2c9"' }
        result_location: { type: string, nullable: true, description: 'The same place in words, e.g. "Table 1, row 3 (26141R)"' }
        created_at: { type: string }
        document_title: { type: string, nullable: true }
        supplier_id: { type: string, nullable: true }
        supplier_name: { type: string, nullable: true }
        spec_test_name: { type: string, nullable: true }
        acknowledged_by_name: { type: string, nullable: true }

    IntakeDuplicate:
      type: object
      description: |
        One arrival that did not become a review card because the identical
        file (same SHA-256, same tenant) was already approved or already
        waiting. Never carries the storage key.
      properties:
        id: { type: string }
        tenant_id: { type: string }
        checksum: { type: string }
        match_kind: { type: string, enum: [already_approved, already_waiting] }
        matched_document_id: { type: string, nullable: true }
        matched_document_title: { type: string, nullable: true }
        matched_queue_id: { type: string, nullable: true }
        matched_queue_file_name: { type: string, nullable: true }
        matched_queue_status: { type: string, nullable: true, enum: [pending, approved, rejected] }
        source: { type: string, description: "The door: import, email, api, public_link, s3, manual, request_link" }
        source_detail: { type: string, nullable: true }
        source_id: { type: string, nullable: true }
        connector_run_id: { type: string, nullable: true }
        request_upload_id: { type: string, nullable: true }
        file_name: { type: string }
        file_size: { type: integer }
        mime_type: { type: string }
        received_at: { type: string }
        created_by: { type: string, nullable: true }
        created_by_name: { type: string, nullable: true }
        queue_id: { type: string, nullable: true, description: NULL while still suppressed; the queue item Review anyway created. }
        overridden_by: { type: string, nullable: true }
        overridden_by_name: { type: string, nullable: true }
        overridden_at: { type: string, nullable: true }

    RequestArrival:
      type: object
      description: |
        One supplier upload. Never carries the uploader IP or the storage key;
        the bytes are served by GET /api/request-uploads/{id}/file.
      properties:
        id: { type: string }
        tenant_id: { type: string }
        supplier_id: { type: string }
        supplier_name: { type: string, nullable: true }
        request_id: { type: string, description: The version current when the file arrived. }
        root_request_id: { type: string }
        current_request_id: { type: string, description: The version decisions are made against. }
        current_request_status: { type: string, enum: [draft, issued, cancelled, closed] }
        request_title: { type: string }
        file_name: { type: string }
        file_size: { type: integer }
        mime_type: { type: string }
        uploaded_at: { type: string }
        uploader_label: { type: string, nullable: true }
        queue_id: { type: string, nullable: true }
        document_id: { type: string, nullable: true }
        document_title: { type: string, nullable: true }
        documents:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
        pipeline_state:
          type: string
          enum: [not_read, extracting, extraction_error, awaiting_approval, rejected_in_queue, document_linked]
          description: Only `document_linked` allows a requirement to be accepted from this file.
        rejection_reason: { type: string, nullable: true }
        rejection_note: { type: string, nullable: true }
        processing_error: { type: string, nullable: true }
        spec:
          type: object
          nullable: true
          properties:
            out_of_spec: { type: integer }
            not_checked: { type: integer }
            source: { type: string, enum: [queue, register] }
        claims:
          type: array
          items:
            $ref: '#/components/schemas/RequestArrivalClaim'
        pending_count:
          type: integer
          description: Undecided claims whose current line is still received or under review.

    DecideArrivalRequest:
      type: object
      required: [decisions]
      properties:
        decisions:
          type: array
          minItems: 1
          items:
            type: object
            required: [line_id, decision]
            properties:
              line_id: { type: string, description: A line on the CURRENT version. }
              decision: { type: string, enum: [accepted, needs_attention] }
              document_id:
                type: string
                nullable: true
                description: Accept only. Defaults to the arrival's document; must be an active document of the same supplier.
              status_note: { type: string, nullable: true, description: Internal. Never shown to the supplier. }
              attention_reason:
                type: string
                nullable: true
                description: Needs-attention only. The sentence the supplier reads; blank falls back to one composed from the line's criteria.

    SearchConstraint:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [lot, date, supplier, product, document_type, metadata, text] }
        label: { type: string, example: "production date Jul 31, 2026" }
        raw: { type: string }
        value: { type: string }
        fields: { type: array, items: { type: string } }
        role: { type: string, enum: [production, code, expiration, ship, uploaded, any] }
        date_from: { type: string, nullable: true }
        date_to: { type: string, nullable: true }
        month_day:
          type: object
          nullable: true
          properties:
            month: { type: integer }
            day: { type: integer }
        match: { type: string, enum: [equals, contains] }
        source: { type: string, enum: [query_text, ai_parse] }
        note: { type: string, nullable: true }
    SearchConstraintCheck:
      type: object
      properties:
        constraint_id: { type: string }
        outcome:
          type: string
          enum: [match, near, role_mismatch, ambiguous, partial_lot, multiple_values, mismatch, missing, unverified]
        field: { type: string, nullable: true }
        field_label: { type: string, nullable: true }
        value: { type: string, nullable: true }
        provenance: { type: string, enum: [extracted, linked_record, system], nullable: true }
        message: { type: string }
        distance_days: { type: integer, nullable: true }
    CoverageDocumentRow:
      type: object
      description: A document row (d.* plus joined names and snippets). Coverage fields are present on constrained searches only.
      additionalProperties: true
      properties:
        id: { type: string }
        title: { type: string }
        match_status: { type: string, enum: [covering, candidate_not_matching] }
        match_checks: { type: array, items: { $ref: '#/components/schemas/SearchConstraintCheck' } }
        match_reason: { type: string, nullable: true }
    SearchUnreviewedCandidate:
      type: object
      properties:
        queue_id: { type: string }
        file_name: { type: string }
        supplier: { type: string, nullable: true }
        created_at: { type: string, nullable: true }
        review_url: { type: string, example: "/review?item=39c0426404e44947a83ed8b15f3423be" }
        match_status: { type: string, enum: [unreviewed_candidate] }
        matches_all_constraints: { type: boolean }
        record_label: { type: string, nullable: true }
        match_checks: { type: array, items: { $ref: '#/components/schemas/SearchConstraintCheck' } }
        match_reason: { type: string }
    SearchCoverageFields:
      type: object
      properties:
        coverage: { type: string, enum: [covered, likely, ambiguous, none, unconstrained] }
        constraints: { type: array, items: { $ref: '#/components/schemas/SearchConstraint' } }
        dropped_constraints:
          type: array
          items:
            type: object
            properties:
              kind: { type: string }
              label: { type: string }
              raw: { type: string }
              reason: { type: string }
        coverage_summary: { type: string, nullable: true, example: "No document on file covers production date Jul 31, 2026." }
        covering_count: { type: integer }
        candidate_count: { type: integer }
        unreviewed_candidates: { type: array, items: { $ref: '#/components/schemas/SearchUnreviewedCandidate' } }
        coverage_scan_truncated: { type: boolean }
    UniversalSearchBlock:
      type: object
      properties:
        total: { type: integer }
        results: { type: array, items: { type: object, additionalProperties: true } }

    PaginatedDocuments:
      type: object
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/Document'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    PaginatedAudit:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

  parameters:
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 50
        maximum: 200
      description: Maximum number of results (capped at 200)
    OffsetParam:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
      description: Number of results to skip for pagination

paths:
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in and obtain a JWT
      description: |
        Authenticates with email and password. Returns a JWT token valid for 24 hours.
        Creates a server-side session record. Rate limited to 5 attempts per 15 minutes per IP+email.
        **No auth required.**
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required: [email, password]
            example:
              email: "admin@example.com"
              password: "SecurePass1"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPayload'
        '400':
          description: Missing email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Account inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited (too many failed attempts)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register (create) a new user
      description: |
        Creates a new user account. **Requires super_admin or org_admin role.**
        - super_admin can create any role in any tenant.
        - org_admin can only create user/reader roles within their own tenant.
        Sends an invitation email if RESEND_API_KEY is configured.
        The new user is created with force_password_change = 1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                role:
                  type: string
                  enum: [super_admin, org_admin, user, reader]
                password:
                  type: string
                  description: "Must be 8-128 chars with uppercase, lowercase, and number"
                tenantId:
                  type: string
                  description: Required for non-super_admin roles. org_admin defaults to own tenant.
              required: [email, name, role, password]
            example:
              email: "newuser@example.com"
              name: "Jane Doe"
              role: "user"
              password: "Welcome123"
              tenantId: "abcdef1234567890abcdef1234567890"
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  emailSent:
                    type: boolean
                    description: Whether invitation email was sent
        '400':
          description: Validation error (missing fields, bad email, weak password)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: User with this email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/password:
    put:
      tags: [Auth]
      summary: Change own password
      description: |
        Allows the authenticated user to change their own password.
        Requires the current password for verification.
        Clears the force_password_change flag.
        **Requires any authenticated user.**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  description: "Must be 8-128 chars with uppercase, lowercase, and number"
              required: [currentPassword, newPassword]
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Missing fields or weak password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Current password incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Log out (revoke session)
      description: |
        Revokes the current session server-side. The JWT in the Authorization header
        is looked up by its SHA-256 hash and marked as revoked.
        **Requires any authenticated user.**
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

  /api/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset email
      description: |
        Sends a password reset email with a one-time token (1 hour expiry).
        Always returns the same success message regardless of whether the email exists (prevents enumeration).
        Rate limited to 3 attempts per 15 minutes per IP.
        **No auth required.**
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required: [email]
      responses:
        '200':
          description: Always returns success message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "If an account exists with that email, a reset link has been sent"
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password using a token
      description: |
        Completes a password reset using the token from the reset email.
        Validates password complexity, updates the password, and revokes all existing sessions.
        **No auth required.**
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: Reset token from the email link
                newPassword:
                  type: string
                  description: "Must be 8-128 chars with uppercase, lowercase, and number"
              required: [token, newPassword]
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Password has been reset successfully"
        '400':
          description: Invalid/expired token or weak password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/documents:
    get:
      tags: [Documents]
      summary: List documents
      description: |
        Returns a paginated list of documents. Non-super_admin users are restricted to their own tenant.
        **Requires any authenticated user.**
      parameters:
        - name: tenantId
          in: query
          schema:
            type: string
          description: Filter by tenant (super_admin only; others auto-scoped)
        - name: category
          in: query
          schema:
            type: string
          description: Filter by category
        - name: status
          in: query
          schema:
            type: string
            enum: [active, archived, deleted]
            default: active
          description: Filter by status
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: Paginated document list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDocuments'

    post:
      tags: [Documents]
      summary: Create a new document
      description: |
        Creates a document metadata record (no file yet — upload separately).
        **Requires super_admin, org_admin, or user role.**
        Non-super_admins are forced to their own tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                category:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
                tenantId:
                  type: string
                  description: Required. super_admin can specify any tenant.
              required: [title]
            example:
              title: "Safety Data Sheet - Widget A"
              description: "SDS for Widget A per OSHA 2024"
              category: "regulatory"
              tags: ["safety", "osha", "2024"]
              tenantId: "abcdef1234567890abcdef1234567890"
      responses:
        '201':
          description: Document created
          content:
            application/json:
              schema:
                type: object
                properties:
                  document:
                    $ref: '#/components/schemas/Document'
        '400':
          description: Missing title or tenantId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions or wrong tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Tenant not found or inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/documents/{id}:
    get:
      tags: [Documents]
      summary: Get a single document
      description: |
        Returns document metadata with current version info.
        Requires tenant access (user must belong to the document's tenant, or be super_admin).
        **Requires any authenticated user.**
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Document with current version
          content:
            application/json:
              schema:
                type: object
                properties:
                  document:
                    $ref: '#/components/schemas/Document'
                  currentVersion:
                    $ref: '#/components/schemas/DocumentVersion'
        '403':
          description: Access denied to this tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [Documents]
      summary: Update document metadata
      description: |
        Updates title, description, category, tags, and/or status.
        Logs a diff of what changed in the audit trail.
        **Requires super_admin, org_admin, or user role** with tenant access.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                category:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
                status:
                  type: string
                  enum: [active, archived]
            example:
              title: "Updated Title"
              status: "archived"
      responses:
        '200':
          description: Updated document
          content:
            application/json:
              schema:
                type: object
                properties:
                  document:
                    $ref: '#/components/schemas/Document'
        '400':
          description: No fields to update or invalid status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Documents]
      summary: Delete a document (soft delete)
      description: |
        Sets document status to 'deleted'. Does not remove files from R2.
        **Requires super_admin, org_admin, or user role** with tenant access.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Document deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/documents/{id}/upload:
    post:
      tags: [Documents]
      summary: Upload a new document version
      description: |
        Uploads a file as a new version of the document. Accepts multipart form data.
        The file is stored in R2 with key: `{tenantSlug}/{docId}/{version}/{fileName}`.
        SHA-256 checksum is computed and stored.

        **Allowed file types:** PDF, DOC, DOCX, XLS, XLSX, CSV, TXT, PNG, JPG.
        **Max file size:** 100 MB.

        **Requires super_admin, org_admin, or user role** with tenant access.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload
                changeNotes:
                  type: string
                  description: Optional notes describing what changed in this version
              required: [file]
      responses:
        '201':
          description: Version uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    $ref: '#/components/schemas/DocumentVersion'
        '400':
          description: Missing file, invalid type, or file too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Document not found or not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/documents/{id}/download:
    get:
      tags: [Documents]
      summary: Download a document file
      description: |
        Downloads the file for a specific version (or current version by default).
        Returns the raw file with Content-Disposition header for browser download.
        Logs a download audit entry.
        **Requires any authenticated user** with tenant access.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: query
          schema:
            type: integer
          description: Version number to download (defaults to current version)
      responses:
        '200':
          description: File download
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="report.pdf"'
            Content-Type:
              schema:
                type: string
                example: "application/pdf"
            ETag:
              schema:
                type: string
                description: SHA-256 checksum
        '400':
          description: Invalid version number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Document, version, or file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/documents/{id}/versions:
    get:
      tags: [Documents]
      summary: List all versions of a document
      description: |
        Returns all versions for a document, ordered by version number descending.
        Includes uploader name and email.
        **Requires any authenticated user** with tenant access.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Version list
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions:
                    type: array
                    items:
                      $ref: '#/components/schemas/DocumentVersion'
                  document_id:
                    type: string
                  current_version:
                    type: integer
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/documents/search:
    get:
      tags: [Documents]
      summary: Search documents
      description: |
        Searches documents by title, description, tags, and file names using SQL LIKE.
        Joins document_versions to match against file_name as well.
        Only returns active documents. Non-admins are restricted to their own tenant.
        **Requires any authenticated user.**
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query (matches title, description, tags, and file names)
        - name: tenantId
          in: query
          schema:
            type: string
          description: Filter by tenant (admin only)
        - name: category
          in: query
          schema:
            type: string
          description: Filter by category
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDocuments'

  /api/search:
    get:
      tags: [Documents]
      summary: Universal search with coverage
      description: |
        Grouped FTS5 search across documents, suppliers, products, document types, orders,
        customers and bundles (top-N per type).

        **Coverage.** When the query states a lot (`1042620303`, `10426203-03`, `lot 10426203 sublot 03`)
        or a date (`production date 7/31/2026`, `exp 31-Jul-2026`, a bare `2026-07-31`), those become
        constraints. Each document is checked against its OWN structured fields (lot records,
        extracted production/code/expiration/ship dates, supplier) and the `documents` block becomes
        the covering documents followed by labelled non-matching candidates (`match_status`,
        `match_checks`, `match_reason`). `coverage` is `covered`, `none` or `unconstrained`. A prefix of a
        lot is never covering; a code date never covers a production date; a stored date that reads
        two ways (`02/07/2026`) is reported as unverifiable. Pending Review Queue files that match are
        returned in `unreviewed_candidates` and are never covering.

        **Products and orders (migration 0107).** A product named the way a person knows it — our SKU
        (`2235`), the supplier's item (`810004`), a pack (`300 gal tote`), or words next to another
        constraint (`bulk unsalted butter produced 7/22/26`) — resolves through the product identifier
        graph into a `product` constraint carrying `product_resolution` (what it resolved to, and how).
        A phrase that fits several products is `coverage: ambiguous`: nothing is picked, and each
        candidate carries its own `covering_count`. Anything reached through an unconfirmed identifier,
        a pending lot-match suggestion, or an older auto-link is `likely` ("confirm"), never covering.
        A WMS order number (`1797062`) becomes an `order` constraint that follows its lines to the lots
        they shipped; a certificate covers only through a person's accepted match or an exact lot row.

        Query-time folding: simple singular/plural and `gal/gallon`, `lb/lbs/pound`, `oz/ounce`.
        **Requires any authenticated user.**
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: tenant_id
          in: query
          schema: { type: string }
          description: Required for super_admin; ignored for everyone else.
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: limit_per_type
          in: query
          schema: { type: integer, default: 5, maximum: 25 }
        - name: lot
          in: query
          schema: { type: string }
          description: |
            A lot typed as its own input rather than inside `q`. Combined with
            `sublot` the two are matched PART AGAINST PART — a sublot never
            matches against a base lot number.
        - name: sublot
          in: query
          schema: { type: string }
          description: The sublot half of a two-input lot search. Only meaningful alongside `lot`.
      responses:
        '200':
          description: Grouped results, plus coverage fields
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SearchCoverageFields'
                  - type: object
                    properties:
                      documents:
                        type: object
                        properties:
                          total: { type: integer }
                          results:
                            type: array
                            items: { $ref: '#/components/schemas/CoverageDocumentRow' }
                      suppliers: { $ref: '#/components/schemas/UniversalSearchBlock' }
                      products: { $ref: '#/components/schemas/UniversalSearchBlock' }
                      doc_types: { $ref: '#/components/schemas/UniversalSearchBlock' }
                      orders: { $ref: '#/components/schemas/UniversalSearchBlock' }
                      customers: { $ref: '#/components/schemas/UniversalSearchBlock' }
                      bundles: { $ref: '#/components/schemas/UniversalSearchBlock' }

  /api/documents/search/natural:
    post:
      tags: [Documents]
      summary: Natural-language document search with coverage
      description: |
        An LLM parses the question into structure (`parsed_query`). Every structured predicate
        (supplier, products, document type, lot / date / other metadata filters, date range with
        `date_role`, expiration filter) is a CONSTRAINT judged per document, never a SQL filter
        dropped until something comes back. A role-dated phrase typed in the question ("produced
        7/22/26") overrides the model's reading of it. Anything that cannot be applied is listed in
        `dropped_constraints`, and then `coverage` cannot be `covered`. With no constraints the
        response is a plain keyword-ranked list (`coverage: unconstrained`).
        Returns 503 when the LLM is unavailable. **Requires any authenticated user.**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, example: "Darigold bulk unsalted butter produced 7/22/26" }
                tenant_id: { type: string }
      responses:
        '200':
          description: Results with coverage
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SearchCoverageFields'
                  - type: object
                    properties:
                      parsed_query: { type: object, description: 'LLM parse, including optional date_role' }
                      results:
                        type: array
                        items: { $ref: '#/components/schemas/CoverageDocumentRow' }
                      total: { type: integer }
        '503':
          description: LLM unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/tenants:
